sections:
- say: On the twenty-first of September, two thousand and twenty-six, flags across Dubai were lowered to half mast. Ten
    days of mourning were declared. Sheikh Ahmed bin Rashid Al Maktoum, son of the man who built modern Dubai and uncle
    of Prince Hamdan, had died at the age of seventy-six. Most people outside the Gulf had never heard his name. But
    his death marked the end of an era. Because with him, the ruler of Dubai, Sheikh Mohammed, lost the last of his three
    brothers. Who were the four brothers who built Dubai? Who was the quiet sheikh the whole city mourned? And what does
    this moment mean for Fazza and his generation? Stay until the end. Like and subscribe, and let's begin.
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Mohammed bin Rashid Al Maktoum
  - cat:Dubai Creek
- say: 'To understand this story, we have to go back to the father. Sheikh Rashid bin Saeed Al Maktoum ruled Dubai from
    nineteen fifty-eight until his death in nineteen ninety. When he took power, Dubai was a small trading town on a
    creek, with no paved roads and no running water in most homes. He borrowed money to dredge the creek, built a port,
    an airport, a hospital and later the giant port of Jebel Ali and the Dubai World Trade Centre. People called him
    the father of Dubai. And he raised four sons who would carry his vision forward: Maktoum, Hamdan, Mohammed and Ahmed.
    Four brothers, one city, and a promise to turn the desert into something the world had never seen.'
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Jebel Ali Port
  - cat:Dubai World Trade Centre
  - cat:Dubai Creek
- say: The eldest, Sheikh Maktoum bin Rashid, became ruler of Dubai when their father died in nineteen ninety. He governed
    for sixteen years and also served as Vice President and Prime Minister of the United Arab Emirates. He was calm,
    private and deeply respected. In January two thousand and six, while on a trip to Australia, he died suddenly, and
    his younger brother Mohammed became ruler. The second brother, Sheikh Hamdan bin Rashid, was the UAE's Minister of
    Finance for half a century, from the creation of the country in nineteen seventy-one until his death in March two
    thousand and twenty-one. He was also famous across the world of horse racing, with his own stables and champions.
    Two brothers gone. Two brothers left.
  show:
  - cat:Sheikh Maktoum bin Rashid Al Maktoum
  - cat:Sheikh Hamdan bin Rashid Al Maktoum
  - cat:Royal Ascot
- say: 'The brothers shared one great passion: horses. In the nineteen eighties and nineties, the Maktoum brothers transformed
    British horse racing. Sheikh Maktoum built the Gainsborough Stud. Sheikh Hamdan built Shadwell, whose blue and white
    colours won some of the most famous races in Europe. Sheikh Mohammed created Darley and later Godolphin, which became
    one of the most successful racing operations on Earth. At Royal Ascot, at Newmarket and at Epsom, the sight of the
    Dubai brothers in the winners'' enclosure became a tradition. Ahmed shared that love of racing too. For British racing
    fans, the four sons of Sheikh Rashid were not just royals from the desert. They were the family that changed the
    sport.'
  show:
  - cat:Royal Ascot
  - cat:Meydan Racecourse
  - cat:Sheikh Hamdan bin Rashid Al Maktoum
  - search:Newmarket racecourse
- say: The youngest of the brothers was Sheikh Ahmed bin Rashid. Like his nephew Hamdan would years later, he trained
    at the Royal Military Academy Sandhurst in Britain. He came home and joined Dubai's Central Military Command, eventually
    rising to become its Commander-in-Chief. For many years he also served as Deputy Chairman of Dubai Police and Public
    Security, one of the most sensitive positions in the emirate. Unlike his famous brother, Ahmed avoided the cameras.
    He was known for his business interests in real estate and his love of sport and racing. Inside the family, people
    say, he was a quiet pillar. Outside, almost invisible. Have you ever heard of Sheikh Ahmed before today? Tell us
    in the comments.
  show:
  - cat:Dubai Police
  - cat:Mohammed bin Rashid Al Maktoum
  - cat:Meydan Racecourse
  - search:Sandhurst
- say: Then came the announcement on the twenty-first of September, two thousand and twenty-six. The Dubai Media Office
    confirmed that Sheikh Ahmed bin Rashid had passed away. Dubai declared ten days of mourning, with flags at half mast
    across the emirate. The funeral prayer was held at Zabeel Grand Mosque, and for days afterwards, a long line of rulers,
    ministers, ambassadors and ordinary citizens came to the Zabeel majlis to offer condolences. Sheikh Mohammed shared
    a deeply personal message about his brother. The UAE President, Sheikh Mohamed bin Zayed, sent his condolences, as
    did the rulers of Bahrain and Oman. Even India's Prime Minister, Narendra Modi, sent a message of sympathy. As is
    the custom, the ruler's sons stood beside their father to receive the mourners.
  show:
  - him:condolence|mourning
  - cat:Zabeel Palace
  - cat:Mohammed bin Rashid Al Maktoum
- say: 'Mourning in Dubai follows old traditions. For three days, the family opens its majlis, and anyone, from rulers
    to ordinary residents, can come to sit, pray and offer condolences. Coffee is poured, verses of the Quran are recited,
    and the men of the family stand for hours to greet every visitor personally. Official mourning, with flags at half
    mast, can last longer, and for Sheikh Ahmed it lasted ten days. Behind the gold and glass of modern Dubai, these
    moments show the old desert values that the city was built on: family, faith, and standing together in grief.'
  show:
  - him:condolence|mourning
  - cat:Zabeel Palace
  - cat:Jumeirah Mosque
- say: For Sheikh Mohammed, now in his late seventies, this loss is different from any other. In two thousand and six
    he lost Maktoum, his eldest brother, the man he succeeded. In two thousand and twenty-one he lost Hamdan, the brother
    who ran the nation's money for fifty years. And now, Ahmed, the youngest. Of the four sons of Sheikh Rashid bin Saeed,
    only Sheikh Mohammed remains. The generation that turned a fishing town into one of the most famous cities on Earth
    is reaching its end. Think about that for a moment. Every skyscraper, every airline, every island shaped like a palm
    tree, was imagined by these four brothers and their father.
  show:
  - cat:Mohammed bin Rashid Al Maktoum
  - cat:Burj Khalifa
  - cat:Palm Jumeirah
  - cat:Burj Al Arab
- say: And that is why all eyes now turn to the next generation. Prince Hamdan, Fazza, has been Crown Prince since two
    thousand and eight and has run the Dubai Executive Council for twenty years, a period in which, according to recent
    reports, Dubai's economy roughly doubled. Since two thousand and twenty-four, he has also been the UAE's Deputy Prime
    Minister and Minister of Defence, the very post his father held when the country was born. His brother Sheikh Maktoum
    is First Deputy Ruler and the UAE's Minister of Finance, the job their late uncle Hamdan held for half a century.
    The names repeat, the duties pass down, and slowly, the sons are stepping into the places of the brothers.
  show:
  - him:Executive Council|defence|Minister
  - cat:Maktoum bin Mohammed Al Maktoum
  - cat:Hamdan bin Mohammed Al Maktoum
  - him
- say: There is something poetic about it. Fazza shares his name with his late uncle Hamdan bin Rashid. His eldest son
    carries the name Rashid, the name of the founder of modern Dubai and of Fazza's late brother. And now the last of
    the old brothers is gone, and Fazza stands closer than ever to the moment when he will lead the city his grandfather
    built. Nobody in the family speaks about that day in public. Sheikh Mohammed is still ruler, still writing poetry,
    still working every day. But every loss in the old generation is a reminder that the future of Dubai is already standing
    beside him, in a white kandura, receiving the mourners with his father.
  show:
  - him
  - him:Mohammed bin Rashid
  - cat:Hamdan bin Mohammed Al Maktoum
- say: Four brothers built Dubai. Maktoum, Hamdan, Mohammed and Ahmed. Three are gone, and one remains, watching his
    sons carry the city into its next chapter. May Sheikh Ahmed bin Rashid rest in peace. What do you think Dubai will
    look like when Fazza becomes ruler one day? Write your thoughts in the comments, we read every one. Like this video
    and subscribe to The Luxury Lane for more true stories from inside the Dubai royal family. See you next time.
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - him
