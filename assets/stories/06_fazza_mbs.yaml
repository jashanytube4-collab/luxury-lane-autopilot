sections:
- say: They are the two most famous crown princes in the Arab world. One rides horses through the desert, writes love
    poetry and has more than seventeen million followers. The other has transformed the largest country in the Gulf and,
    according to reports, has been linked to a four hundred and fifty million dollar painting. Prince Hamdan of Dubai
    and Mohammed bin Salman of Saudi Arabia. When they meet, the cameras are always there. But what is the real relationship
    between them? Who is richer? And why do people say Dubai and Riyadh are now in a silent race? Stay until the end.
    Like and subscribe, and let's begin.
  show:
  - him:Salman|Saudi
  - cat:Mohammad bin Salman in 2016
  - him
- say: 'Mohammed bin Salman was born on the thirty-first of August, nineteen eighty-five, the son of King Salman of Saudi
    Arabia. The world knows him by three letters: MBS. Prince Hamdan was born three years earlier, in November nineteen
    eighty-two, the son of Sheikh Mohammed bin Rashid, ruler of Dubai. Both men grew up in powerful royal families, but
    their paths to power were very different. Fazza was named Crown Prince of Dubai in two thousand and eight, at twenty-five,
    and spent years in the spotlight. MBS rose with astonishing speed. In June two thousand and seventeen, at thirty-one,
    he was named Crown Prince of Saudi Arabia, replacing his older cousin, and later he also became Prime Minister. Two
    princes, two very different stories.'
  show:
  - cat:Mohammad bin Salman
  - cat:Hamdan bin Mohammed Al Maktoum
  - search:Riyadh skyline
- say: Under MBS, Saudi Arabia changed faster than almost anyone thought possible. In two thousand and sixteen he launched
    Vision twenty-thirty, a plan to make the kingdom less dependent on oil. In two thousand and eighteen, women were
    allowed to drive for the first time. Cinemas reopened after decades, concerts and festivals filled Riyadh, and tourists
    were welcomed with new visas. For millions of young Saudis, it felt like a new country. For his critics, it came
    with a harder side, and international human rights groups have strongly criticised parts of his rule. Either way,
    nobody in the Gulf has made the world talk as much as MBS.
  show:
  - cat:Mohammad bin Salman in 2016
  - search:Riyadh
  - search:Saudi Arabia women driving
- say: Their meetings have always made headlines. In May two thousand and nineteen, Prince Hamdan travelled to Saudi
    Arabia. He was received by King Salman, and the next day by Mohammed bin Salman himself. The official footage shows
    the two crown princes side by side, smiling and talking. Months later, in November two thousand and nineteen, MBS
    came to the UAE, and Fazza personally showed him around the headquarters of Expo twenty-twenty in Dubai, the project
    Hamdan had helped win for the city years earlier. Two future kings of the Gulf walking through the plans of the world's
    biggest fair. Back in two thousand and sixteen, Dubai had even named a major street after King Salman, and Fazza
    opened it himself.
  show:
  - him:Salman|Saudi
  - cat:Expo 2020
  - him:Expo
- say: 'Now the money, and this is where the stories get wild. International newspapers reported that MBS was linked
    to the purchase of Salvator Mundi, a painting attributed to Leonardo da Vinci that sold for about four hundred and
    fifty million dollars in two thousand and seventeen, the most expensive painting ever sold. Reports also linked him
    to a French château bought for around three hundred million dollars and to a giant superyacht. None of these purchases
    were officially confirmed by the Saudi government, but they made MBS a symbol of royal spending. Fazza''s luxuries
    look almost modest by comparison: horses, falcons, cars and adventure. Which lifestyle would you choose? Tell us
    in the comments.'
  show:
  - cat:Mohammad bin Salman in 2019
  - search:Salvator Mundi
  - search:French chateau
  - search:superyacht
- say: And then there is the race nobody talks about officially. For decades, Dubai has been the business capital of
    the Middle East. Global companies opened their regional headquarters there, attracted by its airport, its free zones
    and its lifestyle. Then Saudi Arabia, under MBS, decided it wanted that crown too. Riyadh announced that, from two
    thousand and twenty-four, companies wanting government contracts would need a regional headquarters inside Saudi
    Arabia. Saudi Arabia launched giant projects like NEOM and won the right to host Expo twenty-thirty in Riyadh. Many
    analysts described it as a friendly but very real competition between Riyadh and Dubai.
  show:
  - search:Riyadh skyline
  - cat:Burj Khalifa
  - cat:Palm Jumeirah
  - search:NEOM
- say: Interestingly, Dubai's answer has often come from Fazza himself. As head of Dubai's Executive Council for twenty
    years, he has overseen plans to double the size of Dubai's economy, attract new companies and make the city even
    more attractive to live in. According to recent reports, Dubai's economy roughly doubled during his two decades in
    charge. Expo twenty-twenty, which he helped win back in two thousand and thirteen, brought the world to Dubai. And
    while Riyadh builds new cities in the desert, Dubai keeps reinventing itself with projects like the Museum of the
    Future and new districts across the city.
  show:
  - him:Executive Council|economy|Expo
  - cat:Museum of the Future
  - cat:Expo 2020
  - cat:Dubai Creek
- say: So are they rivals? Personally, there is no sign of any bad blood. Every official meeting has been warm, and Saudi
    Arabia and the UAE are close allies. But their styles could not be more different. MBS is the reformer and dealmaker
    who changes rules overnight, opens cinemas and concerts, and makes headlines in global politics. Fazza is the people's
    prince who rides at dawn, writes poetry and shares the little moments of his life. One is building a new Saudi Arabia
    from scratch. The other is protecting and growing a city the world already loves.
  show:
  - cat:Mohammad bin Salman in 2016
  - him
  - him:horse|poetry|people
- say: 'Their public images are opposites too. Fazza lives on Instagram, with more than seventeen million followers who
    see his horses, his falcons, his adventures and his children''s little hands. MBS almost never shares his private
    life online, and most photos of him come from summits, palaces and official visits. Fazza is the prince fans feel
    they know personally. MBS is the prince the world watches through the news. In a strange way, each has what the other
    does not: Fazza has the love of millions of fans, MBS has the attention of every government on Earth.'
  show:
  - him:horse|falcon|adventure
  - cat:Mohammad bin Salman
  - search:Instagram app
- say: 'There is one more twist. Both men are fathers who keep their families private. MBS rarely shows his wife or children
    in public. Fazza has four children and has never shown his wife''s face. For all their power, both crown princes
    protect the same thing: the people closest to them. And both are expected to rule for decades. That means the relationship
    between these two men, and between Riyadh and Dubai, will shape the Gulf for a generation. What happens between them
    matters far beyond their palaces. Think about how rare this is. Two young men, both sons of rulers, both expected
    to lead for decades, both admired and debated by millions. In most of the world, leaders change every few years.
    In the Gulf, the relationship between two crown princes can shape the region for half a century. Every handshake
    between Fazza and MBS is watched closely by investors, diplomats and fans alike, because the friendship between Dubai
    and Riyadh affects jobs, travel and business for millions of people, including the millions of Indians, Pakistanis
    and Filipinos who live and work across both countries.'
  show:
  - him:family|children|Eid
  - cat:Mohammad bin Salman
  - cat:Zabeel Palace
- say: So, Fazza or MBS? The poet horseman of Dubai or the bold reformer of Riyadh? Friends, rivals, or both? Write your
    answer in the comments, and tell us which crown prince you admire more. If you enjoyed this, like the video and subscribe
    to The Luxury Lane for more stories about Prince Hamdan and the royals of the Gulf. See you next time. And if you
    live in Dubai or Saudi Arabia, tell us which city you think will win the race to be the capital of the Gulf in the
    next ten years, and why.
  show:
  - him
  - cat:Mohammad bin Salman in 2019
