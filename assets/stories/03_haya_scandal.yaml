id: haya-scandal
title: "The Princess, the Bodyguard and £554 Million — The Scandal Behind Fazza's Stepmother"
thumbnail: {text: "THE BODYGUARD SCANDAL", tag: "SHOCKING", inset: "cat:Princess Haya bint Al Hussein"}
mood: epic
footage: "Mohammed bin Rashid|father"
description: >-
  A Jordanian princess, the ruler of Dubai, a secret relationship with a bodyguard, millions in hush money and the
  biggest divorce settlement in British history. The scandal behind Princess Haya — Prince Hamdan's (Fazza's)
  stepmother — as revealed in the London High Court. Based on court rulings and major news reports.
tags: [Princess Haya, Princess Haya bodyguard, Haya bint Hussein scandal, Sheikh Mohammed divorce, Dubai royal scandal,
       Princess Haya affair, Haya 554 million, Fazza stepmother, Prince Hamdan family, Dubai royal family secrets,
       Princess Haya London court, Sheikh Mohammed wife]
sections:
  - say: >-
      She was the daughter of a king and the wife of one of the richest rulers on Earth. She had palaces, racehorses
      and a seat beside the ruler of Dubai at Royal Ascot. And then, behind closed doors, everything fell apart. A
      secret relationship with her own bodyguard. Millions of pounds paid to keep it quiet. A midnight escape to
      London. And the most expensive royal divorce in British history. This is the story of Princess Haya, the
      stepmother of Prince Hamdan, and the scandal the Dubai royal family never wanted the world to hear. What really
      happened inside that marriage? Why did she pay her own security guards millions? And what did the London court
      reveal about the ruler of Dubai? Stay until the end, because the final ruling shocked everyone. Like and
      subscribe, and let's begin.
    show: ["cat:Princess Haya bint Al Hussein", "cat:Mohammed bin Rashid Al Maktoum", "cat:Royal Ascot"]
  - say: >-
      Haya bint Al Hussein was born in Amman in May nineteen seventy-four, the daughter of King Hussein of Jordan,
      one of the most famous kings of the Arab world. When she was only two, her mother, Queen Alia, was killed in a
      helicopter crash. The little princess grew up between palaces and boarding schools in England, and later studied
      at Oxford. She loved horses more than anything. She rode for Jordan at the Olympic Games in Sydney, and became
      president of the International Equestrian Federation, the most powerful position in world horse sport. She was
      beautiful, educated and fiercely independent. It was horses that brought her to the man who would change her
      life: Sheikh Mohammed bin Rashid, the horse-mad ruler of Dubai.
    show: ["cat:Hussein I of Jordan", "cat:Princess Haya bint Al Hussein", "cat:Endurance riding"]
  - say: >-
      In April two thousand and four, the Jordanian princess became the junior wife of Sheikh Mohammed, a man almost
      twenty-five years older than her, who already had other wives and many children, including his senior wife,
      Sheikha Hind, the mother of Prince Hamdan. Unlike Sheikha Hind, who never appeared in public, Haya was
      everywhere. She stood beside her husband at Royal Ascot, she spoke at the United Nations, she flew to disaster
      zones as a messenger of peace. They had two children, Jalila in two thousand and seven and Zayed in two
      thousand and twelve. Magazines called her the modern face of Dubai. To the world, it looked like a fairy tale.
      But in a royal palace, what the world sees and what really happens can be two very different things.
    show: ["cat:Royal Ascot", "cat:Mohammed bin Rashid Al Maktoum", "cat:Princess Haya bint Al Hussein", "cat:Zabeel Palace"]
  - say: >-
      In two thousand and eighteen, a storm hit the family. Sheikha Latifa, one of Sheikh Mohammed's daughters from
      another wife, tried to escape Dubai by boat and was captured at sea. Haya later told a London court that what she
      learned about Latifa changed everything. At around the same time, according to evidence heard by the court, Haya
      had begun a relationship with one of her British bodyguards. The court heard that when members of her security
      team found out, some of them threatened to expose the affair. And then came the detail that stunned Britain.
      Haya admitted paying members of her own security staff millions of pounds. Reports from the hearings put the
      total at around six point seven million pounds. She told the judge she paid because she was scared. Here is our
      question for you. Was Haya a victim of blackmail, or did she make the biggest mistake of her life? Tell us in the
      comments.
    show: ["cat:Royal Courts of Justice", "cat:Princess Haya bint Al Hussein", "search:London night"]
  - say: >-
      Sheikh Mohammed found out. In February two thousand and nineteen, without the world knowing, he divorced her
      under Islamic law. Soon after, he published a poem online that many readers took as a message to a wife who had
      betrayed him. In April two thousand and nineteen, Princess Haya made her move. She left Dubai with Jalila and
      Zayed, flew to Germany, and then to London, where she owned a mansion near Kensington Palace. The ruler of Dubai
      went to the High Court in London to demand that his children be brought back. Haya asked the court to protect
      them. A royal marriage that had looked perfect for fifteen years was now a public legal war, with some of the
      most expensive lawyers in Britain on both sides.
    show: ["cat:Mohammed bin Rashid Al Maktoum", "cat:Royal Courts of Justice", "search:Kensington Palace"]
  - say: >-
      The court case lasted years and produced judgment after judgment. In two thousand and twenty, the court found,
      on the balance of probabilities, that Sheikh Mohammed had ordered the abduction of two of his adult daughters and
      had run a campaign of fear against Haya. In two thousand and twenty-one, another ruling found that her phone and
      her lawyers' phones had been hacked with powerful spyware on his behalf. Sheikh Mohammed denied the allegations
      and said the court had heard only one side, because as a head of government he could not take part. Then, in
      December two thousand and twenty-one, came the money. The judge ordered a settlement worth around five hundred
      and fifty-four million pounds, mostly for the security and future of Jalila and Zayed. Reports said it was the
      largest divorce award ever made in a British court.
    show: ["cat:Royal Courts of Justice", "cat:Mohammed bin Rashid Al Maktoum", "search:London High Court"]
  - say: >-
      The details of the ruling were extraordinary. Reports said the money covered round-the-clock security,
      armoured cars and bodyguards for life, homes in England, holidays, ponies and even the cost of feeding
      the family's animals. Haya was also reported to have been awarded millions for jewellery and clothes she said she
      had left behind in Dubai. The judge said the biggest threat to Haya and her children was not paparazzi or
      kidnappers, but Sheikh Mohammed himself. For a ruler who had built one of the most glamorous cities on Earth, it
      was a stunning public humiliation. And through all of it, there was one man the whole of Dubai was watching: his
      son and heir, Prince Hamdan, the stepson of Princess Haya.
    show: ["cat:Royal Courts of Justice", "search:armoured car", "cat:Princess Haya bint Al Hussein", him]
  - say: >-
      Fazza never said a word. Not one statement, not one post, not one interview about his stepmother, his half-sister
      Jalila or his half-brother Zayed. While the London newspapers printed every detail, the Crown Prince kept riding,
      kept working and kept posting his adventures, as if nothing had happened. In the Gulf, a son does not speak
      against his father, and Hamdan's loyalty to Sheikh Mohammed has always been total. Today, Haya lives in England
      with her children, protected by the security the court ordered. Sheikh Mohammed still rules Dubai. And Hamdan
      stands beside him as Crown Prince and the UAE's Minister of Defence, carrying a family story he has never once
      talked about in public.
    show: [him, "him:Mohammed bin Rashid", "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      After the escape, Haya built a new life in England. Reports said she owned a grand mansion in Kensington Palace
      Gardens, one of the most expensive streets in London, and a country estate in Surrey. Jalila and Zayed grew up
      in Britain, far from the palaces of Dubai, protected by guards around the clock. Haya mostly disappeared from
      public life. The woman who once stood beside the ruler of Dubai at Royal Ascot now avoided cameras completely.
      Her brother, King Abdullah of Jordan, stayed publicly silent too, caught between his sister and one of the most
      important allies of his country. For a princess who had always loved the spotlight, it was a strange new life:
      rich, safe, and almost invisible.
    show: ["search:Kensington Palace Gardens", "search:Surrey countryside", "cat:Princess Haya bint Al Hussein"]
  - say: >-
      So who was the villain in this story? A princess who broke the rules of a royal marriage and paid to hide it? Or
      a ruler whose own family accused him of terrible things in a foreign court? The judges gave their answer, Sheikh
      Mohammed gave his denial, and the world is still divided. Write your verdict in the comments, we read every one.
      And if you want more untold stories from inside the Dubai royal family, including Fazza's own private life, like
      this video and subscribe to The Luxury Lane. See you in the next story.
    show: ["cat:Princess Haya bint Al Hussein", him]
