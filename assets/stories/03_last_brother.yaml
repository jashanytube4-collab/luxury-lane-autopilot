id: last-brother
title: Sheikh Mohammed Just Lost His Last Brother — What It Means for Fazza and Dubai's Future
thumbnail:
  text: THE LAST BROTHER
  tag: DUBAI MOURNS
  inset: cat:Sheikh Rashid bin Saeed Al Maktoum
mood: elegant
footage: condolence|Mohammed bin Rashid|mourning
description: On 21 September 2026, Dubai declared ten days of mourning. Sheikh Ahmed bin Rashid Al Maktoum, son of the
  founder of modern Dubai and uncle of Prince Hamdan (Fazza), had died at 76. With him, Sheikh Mohammed lost the last
  of his three brothers. The story of four brothers who built Dubai, and why this moment changes everything for Fazza's
  generation.
