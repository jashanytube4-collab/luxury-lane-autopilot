id: wives-children
title: How Many Wives and Children Does Fazza's Father Really Have? Inside Dubai's Biggest Royal Family
thumbnail:
  text: HOW MANY KIDS?
  tag: FAZZA'S FAMILY
  inset: cat:Mohammed bin Rashid Al Maktoum
mood: elegant
footage: Mohammed bin Rashid|Maktoum bin Mohammed|Ahmed bin Mohammed|family|Eid
description: Six wives? Thirty children? Princesses who married billionaires, sons who run Dubai, daughters who ran away.
  Inside the giant family of Sheikh Mohammed bin Rashid, ruler of Dubai and father of Prince Hamdan (Fazza) — who the
  wives are, who the famous children are, and why Fazza was the one chosen to be heir.
