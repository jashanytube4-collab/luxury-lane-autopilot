id: father
title: "Fazza's Father: How Sheikh Mohammed Turned a Desert Into Dubai"
thumbnail: {text: "LIKE FATHER LIKE SON", tag: "TRUE STORY", inset: "cat:Mohammed bin Rashid Al Maktoum"}
mood: epic
description: >-
  He grew up in a house without electricity and became the man who built the most famous skyline on Earth. The story
  of Sheikh Mohammed bin Rashid Al Maktoum — ruler of Dubai, poet, champion horseman — and the son he prepared for
  thirty years to follow him: Prince Hamdan, Fazza.
tags: [Sheikh Mohammed bin Rashid, Fazza father, Prince Hamdan father, Dubai ruler, Sheikh Mohammed life story,
       how Dubai was built, Dubai history, Burj Khalifa story, Sheikh Mohammed and Hamdan, Dubai royal family,
       Fazza family, Sheikh Mohammed horses]
sections:
  - say: >-
      He was born in a house with no electricity and no running water, in a small town on a creek where the main
      business was pearl diving. Seventy years later, the same town has the tallest building on Earth, one of the
      biggest airlines in the world and more than fifteen million visitors a year. One man stands at the centre of
      that story, and he is Prince Hamdan's father. Who is Sheikh Mohammed bin Rashid Al Maktoum? How did he turn a
      desert town into Dubai? And why did he choose Hamdan, out of so many sons, to follow him? Stay until the end,
      because the way he prepared Fazza for power is the most surprising part of this story. If you like royal
      stories, like this video and subscribe. Let's begin.
    show: ["cat:Mohammed bin Rashid Al Maktoum", "cat:Burj Khalifa", him]
  - say: >-
      Sheikh Mohammed was born on the fifteenth of July, nineteen forty-nine, in the old Al Maktoum house in Al
      Shindagha, by the mouth of Dubai Creek. He was the third son of Sheikh Rashid bin Saeed, who would become ruler
      of Dubai, and of Sheikha Latifa bint Hamdan, from the ruling family of Abu Dhabi. In those days Dubai had no
      paved roads and no electricity in most homes. Children learned from the desert. Young Mohammed learned to ride
      horses and camels, to hunt with falcons, to read tracks in the sand and to sit for hours in his father's majlis
      listening to merchants, Bedouin elders and fishermen. His father noticed something in him early. The boy was
      restless, curious and fearless. Sheikh Rashid began to take him everywhere, to building sites, meetings and the
      port, teaching him that a leader must see everything with his own eyes.
    show: ["cat:Sheikh Rashid bin Saeed Al Maktoum", "cat:Dubai Creek", "cat:Al Bastakiya", "search:Al Shindagha"]
  - say: >-
      As a teenager, Mohammed was sent to Britain to study English in Cambridge, and then to military training at
      Mons Officer Cadet School in Aldershot. He came home with a vision of a modern state. In nineteen sixty-eight,
      still a teenager, he was put in charge of Dubai's police and defence force. And when the United Arab Emirates
      was born in December nineteen seventy-one, he became its first Minister of Defence, at just twenty-two years
      old, the youngest defence minister in the world. Remember that detail, because it comes back at the end of this
      story. In the years that followed, his father gave him more and more responsibility. Oil money was flowing in,
      and Sheikh Rashid wanted it used for ports, trade and the future, not for luxury. Mohammed absorbed every lesson.
    show: ["cat:Mohammed bin Rashid Al Maktoum", "cat:Sheikh Rashid bin Saeed Al Maktoum", "cat:Dubai World Trade Centre"]
  - say: >-
      Then the projects began, one more ambitious than the other. In nineteen eighty-five, he helped launch Emirates
      airline with just two leased planes. People laughed. Today it is one of the largest international airlines in
      the world. In nineteen ninety-two, he founded the Godolphin racing stable, which would win the biggest races on
      the planet. In nineteen ninety-six, he created the Dubai World Cup, for years the richest horse race in the
      world. In nineteen ninety-five, his older brother, Sheikh Maktoum, by then the ruler, named him Crown Prince.
      Under his drive came Burj Al Arab, the Palm Jumeirah, Dubai Internet City and Dubai Media City. Critics called
      the plans crazy. Islands shaped like palm trees. A hotel in the sea. A city of glass in the desert. But one by
      one, the crazy plans became Dubai.
    show: ["search:Emirates airline Airbus A380", "cat:Meydan Racecourse", "search:Palm Jumeirah aerial", "search:Burj Al Arab"]
  - say: >-
      On the fourth of January, two thousand and six, Sheikh Maktoum died, and Sheikh Mohammed became ruler of Dubai
      and, days later, Vice President and Prime Minister of the United Arab Emirates. He was fifty-six. The challenges
      came quickly. In two thousand and nine, the global financial crisis hit Dubai hard. Projects stopped, prices
      crashed, and newspapers predicted the end of the Dubai dream. In January two thousand and ten, the tallest
      building in the world opened anyway, renamed Burj Khalifa in honour of the president of the UAE, Sheikh Khalifa
      of Abu Dhabi, whose support had helped Dubai through the crisis. The city recovered, and then grew faster than
      ever. And through all of it, the ruler of Dubai kept riding. In two thousand and twelve, at sixty-three years
      old, he won the world endurance championship, one hundred and sixty kilometres on horseback, beating riders
      half his age. What do you think is Sheikh Mohammed's greatest achievement? Tell us in the comments.
    show: ["cat:Burj Khalifa", "cat:Endurance riding", "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      But his most important project was not a building. It was his successor. Sheikh Mohammed has many children, and
      several sons. He watched them all. In two thousand and six, he made his second son, Hamdan, Chairman of the
      Dubai Executive Council, the body that runs the city's government, at just twenty-three. Two years later, on the
      first of February, two thousand and eight, he named Hamdan Crown Prince of Dubai. The father did with the son
      exactly what his own father had done with him. He took him everywhere. Hamdan sat in meetings, visited building
      sites, rode beside him in endurance races and learned to write poetry, just like his father, who has published
      his own poems for decades. Father and son even compete in poetry, answering each other's verses. People in
      Dubai say that when you see Hamdan, you see a young Mohammed.
    show: ["him:Mohammed bin Rashid", "cat:Hamdan bin Mohammed Al Maktoum", "him:horse|endurance", him]
  - say: >-
      Under father and son, Dubai kept reaching higher. In two thousand and thirteen, Dubai won the right to host
      Expo twenty-twenty, and Hamdan climbed to the very top of the Burj Khalifa to wave the UAE flag. In February two
      thousand and twenty-one, the Hope probe, the first Arab mission to Mars, entered orbit around the red planet.
      In two thousand and twenty-two, the Museum of the Future opened, already called one of the most beautiful
      buildings on Earth. And then, in July two thousand and twenty-four, came a moment that closed a circle of more
      than fifty years. Prince Hamdan was appointed Deputy Prime Minister and Minister of Defence of the United Arab
      Emirates. Minister of Defence. The very first position his father had held, at twenty-two, when the country
      was born. The son was now standing exactly where the father had started.
    show: ["cat:Expo 2020", "cat:Museum of the Future", "him:defence|military|armed forces", "cat:Burj Khalifa"]
  - say: >-
      Today Sheikh Mohammed is in his seventies, still ruling, still writing poetry and still pushing Dubai toward
      the next impossible project. And beside him, ready, is the son he spent thirty years preparing. Like father,
      like son: horsemen, poets, builders. The desert boy from Al Shindagha built a city the whole world knows. Now
      it is Fazza's turn to decide what Dubai becomes next. Do you think Hamdan will be as great a ruler as his
      father? Write your answer in the comments, we read every one. And if you enjoyed this story, like the video and
      subscribe to The Luxury Lane for more true stories about Prince Hamdan and the Dubai royal family. See you next
      time.
    show: ["him:Mohammed bin Rashid", him, "cat:Mohammed bin Rashid Al Maktoum"]
