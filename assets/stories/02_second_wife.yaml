description: Millions of people are searching for "Fazza second wife" and "Hadiya Zen". Viral videos claim the Crown
  Prince of Dubai secretly married again, that wedding photos leaked and that his family is in crisis. We checked every
  claim against official sources. Here is what is real, what is fake, and the true story of Prince Hamdan's marriage
  and children.
