    show:
    - clip:in-pm-greet
    - clip:dmo-dprt-00
    sfx: impact
  - say: Then they walked in together, side by side, past a long row of flags.
    show:
    - clip:dmo-dprt-10
    - clip:in-pm-walk
    fx: flash
  - say: Inside, they first stood together for a moment, and then the talks began in a quiet room.
