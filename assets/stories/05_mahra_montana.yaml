id: mahra-montana
title: "Fazza's Sister Divorced Her Husband on Instagram — Then Got Engaged to a Rapper"
thumbnail: {text: "DIVORCE TO RAPPER", tag: "FAZZA'S SISTER", inset: "cat:French Montana"}
mood: modern
footage: "Mohammed bin Rashid|family|Eid"
description: >-
  "I hereby divorce you." One Instagram post from Sheikha Mahra, the daughter of Dubai's ruler and Prince Hamdan's
  half-sister, shocked the world — then came a perfume called "Divorce" and an engagement to American rapper French
  Montana with a reported million-dollar ring. The full story of the most rebellious princess in Dubai.
tags: [Sheikha Mahra, Mahra French Montana, Dubai princess divorce, Mahra Instagram divorce, Fazza sister,
       Prince Hamdan sister, French Montana engaged, Mahra bint Mohammed, Dubai royal family, Sheikh Mohammed daughter,
       Mahra Divorce perfume, Dubai princess rapper]
sections:
  - say: >-
      A princess of Dubai. A royal wedding reportedly worth tens of millions of dollars. A newborn baby. And then, just
      weeks later, a message on Instagram that went around the world in a few hours. Dear husband. As you are occupied
      with other companions, I hereby declare our divorce. I divorce you, I divorce you, and I divorce you. Take care.
      Your ex-wife. The woman who wrote it was Sheikha Mahra, daughter of the ruler of Dubai and half-sister of Prince
      Hamdan. And that was only the beginning. Months later, she was engaged to an American rapper. How did a royal
      fairy tale turn into the most talked-about divorce on the internet? What did her family say? And will this
      wedding really happen? Stay until the end. Like and subscribe, and let's begin.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "cat:French Montana", "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      Sheikha Mahra bint Mohammed bin Rashid Al Maktoum was born in nineteen ninety-four. Her father is Sheikh
      Mohammed bin Rashid, ruler of Dubai and Prime Minister of the United Arab Emirates. Her mother, according to most
      reports, is Zoe Grigorakos, a woman of Greek origin, one of the ruler's lesser-known wives. That makes Mahra the
      half-sister of Fazza, who was born to the ruler's senior wife, Sheikha Hind. Mahra grew up between palaces, with
      brothers and sisters from different mothers, in one of the largest royal families in the world. She studied
      international relations, spoke about women's empowerment, loved horses and fashion, and built a huge following
      on social media. Unlike most women in her family, she never hid from the cameras.
    show: ["cat:Mohammed bin Rashid Al Maktoum", "cat:Princess Mahra bint Mohammed of Dubai", "cat:Burj Khalifa", "cat:Palm Jumeirah"]
  - say: >-
      In two thousand and twenty-three, Mahra married Sheikh Mana bin Mohammed bin Rashid bin Mana Al Maktoum, a
      businessman from a branch of the extended ruling family. Fashion magazines later reported that the celebrations
      cost around fifty million dollars. The photos looked like a dream: the princess in white, flowers everywhere,
      the most glamorous guests in the Gulf. In May two thousand and twenty-four, the couple welcomed a baby daughter,
      and Mahra shared her joy with her followers in a loving message to her husband. Then fans noticed something
      strange. Photos of the couple disappeared. They stopped following each other. People asked questions in the
      comments. And on the sixteenth of July, two thousand and twenty-four, Mahra answered them all, in public.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "cat:Emirates Palace", "search:luxury wedding Dubai"]
  - say: >-
      I hereby declare our divorce. With those words, Mahra turned an old Islamic divorce tradition, called talaq,
      upside down. Traditionally it is the husband who pronounces it three times. She did it herself, for millions to
      see. Her reason was written in the very first line: as you are occupied with other companions. The internet
      exploded. Newspapers from London to New York to Mumbai reported it. Some called her the bravest princess in the
      world, a woman refusing to suffer in silence. Others said a royal divorce should never be announced online. And
      what did her father, the ruler of Dubai, say? Nothing. And her half-brother Fazza? Not a word. Here is our
      question. Was Mahra right to make it public? Tell us in the comments.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "cat:Mohammed bin Rashid Al Maktoum", him]
  - say: >-
      Just weeks later, Mahra did something even more daring. Her own brand, Mahra M1, launched a perfume. Its name
      was Divorce. Black bottle, dramatic campaign, and a message nobody could miss. She had taken the most painful
      moment of her life and turned it into a product. Fans bought it, critics mocked it, and her name was everywhere
      again. And then the gossip pages noticed something else. Mahra was being seen with a very famous American, the
      rapper French Montana, in Paris and in Morocco. At first, both sides said nothing. Fans asked: a princess of Dubai
      and a hip hop star from New York? It sounded impossible.
    show: ["cat:French Montana", "search:perfume bottle", "cat:Princess Mahra bint Mohammed of Dubai", "search:Paris"]
  - say: >-
      It was not impossible. According to reports, French Montana proposed in June two thousand and twenty-five, during
      Paris Fashion Week. At the end of August two thousand and twenty-five, the couple confirmed it themselves with a
      joint post on Instagram. Reports described the ring as an eleven and a half carat diamond worth more than a
      million dollars. French Montana, born Karim Kharbouch in Morocco and raised in New York, had become engaged to the
      daughter of the ruler of Dubai. His representatives said the families were working on the details of the
      wedding. The world waited for photos of a royal wedding mixing Dubai palaces with Hollywood and hip hop.
    show: ["cat:French Montana", "search:diamond ring", "cat:Princess Mahra bint Mohammed of Dubai", "search:Paris Fashion Week"]
  - say: >-
      So has the wedding happened? As far as the public record shows, no wedding date has been confirmed, and the
      family has stayed silent, exactly as it did during the divorce. What we know is this: Mahra has rewritten every
      rule for a Gulf princess. Compare her to the other women of her family. Sheikha Hind, Fazza's mother, has almost
      never been photographed. Fazza's own wife has never shown her face to the world. And then there is Mahra, posting
      her wedding, her baby, her divorce and her new love story for millions. Three women in one family, three
      completely different worlds. Meanwhile, Fazza continues as Crown Prince and Minister of Defence, keeping his own
      private life completely closed.
    show: ["cat:Zabeel Palace", him, "cat:Princess Mahra bint Mohammed of Dubai", "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      Who exactly is the man who won the heart of a Dubai princess? French Montana was born Karim Kharbouch in Morocco
      in nineteen eighty-four. At thirteen, he moved with his family to the Bronx in New York, speaking almost no
      English. He started with street mixtapes and rose to fame, scoring a huge global hit in two thousand and
      seventeen with the song Unforgettable. His love life was already tabloid gold. He had a son, Kruz, with his
      ex-wife, and he famously dated Khloe Kardashian back in two thousand and fourteen. So when this rapper from the
      Bronx was seen with the daughter of the ruler of Dubai, the internet could not believe it. Two worlds that could
      not be more different: hip hop and a Gulf royal palace.
    show: ["cat:French Montana", "search:Bronx New York", "search:Casablanca Morocco"]
  - say: >-
      Mahra's divorce also started a huge debate across the Arab world. Under traditional Islamic practice, talaq is
      the husband's right, and a wife usually has to go through a court or reach an agreement to end a marriage.
      Scholars argued about whether Mahra's words had any legal meaning at all. Many women online saw something else:
      a princess saying publicly what millions of women in unhappy marriages never dare to say. Within days, her post
      had been shared in dozens of languages. Whatever the legal truth, Mahra had become a symbol, loved by some,
      criticised by others, and impossible to ignore.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "search:Dubai Marina night", "cat:Burj Khalifa"]
  - say: >-
      The engagement split opinion across the region. French Montana grew up in a Muslim family in Morocco, and many
      fans in North Africa celebrated a Moroccan boy from the Bronx winning the heart of a Gulf princess. Others in
      the Gulf were shocked that the daughter of Dubai's ruler would marry a rapper known for parties and music
      videos. Comment sections filled with congratulations, jokes and angry debates in Arabic, English and French.
      Fashion magazines called them the most unexpected royal couple of the decade. And through it all, Mahra kept
      posting, smiling and wearing that enormous ring, as if to say that this time, her story would be written by her
      alone.
    show: ["cat:French Montana", "search:Morocco Rabat", "cat:Princess Mahra bint Mohammed of Dubai"]
  - say: >-
      So is Sheikha Mahra a rebel princess, or simply a modern woman living on her own terms? A royal who broke the
      rules, or one who rewrote them? Whatever you think, her story proves that even the most traditional royal
      families are changing. Would you go to a wedding between a Dubai princess and a rapper? Write it in the comments.
      And if you want more untold stories about Fazza's family, like this video and subscribe to The Luxury Lane. See
      you in the next story.
    show: ["cat:French Montana", "cat:Princess Mahra bint Mohammed of Dubai", him]
