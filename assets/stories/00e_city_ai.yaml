- beats:
  - say: The plan has a simple name. The City AI Agent.
    show:
    - clip:ai-fw-6
    - clip:ai-ex-1
    sfx: whoosh
    fx: flash
  - say: Officially, it will understand people's needs.
    show:
    - clip:ai-ex-2
    - clip:ai-fw-1
  - say: It will do the tasks.
    show:
    - clip:ai-fw-2
  - say: And it will join up the work of different government departments, so people get one single, seamless experience.
    show:
    - clip:ai-ex-5
    - clip:ai-fw-7
    - clip:ai-ex-4
  - say: He called it a move to a government redesigned around AI.
    show:
    - clip:ai-fw-3
    - clip:ai-ex-3
  - say: More than twenty-five thousand people came to Future Week in just four days.
    show:
    - clip:ai-fw-5
    - clip:ai-ex-6
    sfx: impact
  - say: So what could this mean for you, on your phone?
    show:
    - sb-348571898
  - say: Today, moving house or starting a small business can mean papers for one office, then another office, then another one.
    show:
    - sb-346746299
    - clip:ai-dc-3
  - say: Different forms. Different screens. The same documents, typed in again, by you, every single time.
    show:
    - sb-352704086
    - clip:ai-dc-18
    fx: flash
  - say: Many people already use government apps on their phone every day, for visas, bills and fines.
    show:
    - clip:ai-dc-15
    - sb-11100822
    sfx: whoosh
  - say: But each app on your phone works on its own.
    show:
    - sb-347275426
  - say: Separate logins. Separate waiting.
    show:
    - clip:ai-dc-6
  - say: A city agent would understand what you need, talk to every department behind the scenes, and handle the steps for you.
    show:
    - clip:ai-ex-7
    - clip:ai-fw-4
    - clip:ai-dc-12
  - say: One request on your phone. Not ten. Not twenty. Just one.
    show:
    - sb-347420163
    sfx: impact
  - say: But here is the honest part.
    show:
    - clip:ai-fw-8
  - say: No launch date for residents has been announced yet. Not even a rough one.
    show:
    - clip:emarat-m1
    - clip:hxm-m1
  - say: Right now, it is only a plan, not an app on your phone.
    show:
    - sb-348705571
    fx: flash
- beats:
  - say: The part that is already running is different.
    show:
    - clip:ai-cp-1
    - clip:ai-cp-2
    sfx: whoosh
    fx: flash
  - say: Ninety-three specialised AI agents. Not robots. Computer programs.
    show:
    - clip:ai-cp-3
    - sb-11117370
  - say: They live inside one shared computer system that the government uses for its own back office.
    show:
    - clip:ai-cp-5
    - sb-8166728
  - say: 'They handle the boring parts: staff, money and buying.'
    show:
    - sb-352806686
    - clip:ai-cp-4
