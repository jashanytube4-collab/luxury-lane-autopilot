description: Twins Rashid and Shaikha, a son named Mohammed and a baby daughter named Hind. Prince Hamdan (Fazza) has
  four children — but why does he hide their faces, what do their names really mean, and which one could one day rule
  Dubai? The true story of Fazza as a father, from the blue foot and the pink foot to the birth card of baby Hind.
