id: fazza-vs-musk
title: "Prince Hamdan vs Elon Musk — Who Is Really Richer in 2026? (The Real Numbers)"
thumbnail:
  text: WHO IS RICHER?
  tag: FAZZA VS MUSK
  inset: "search:Elon Musk"
mood: modern
commons: true                       # Musk, SpaceX, Tesla and Dubai photos from Wikimedia Commons next to the official Hamdan footage
footage: Burj|economy|future|AI|council|London|horse|race|airport|housing|meals|graduates
description: 'Prince Hamdan or Elon Musk: who is richer in 2026? We put the published numbers side by side: Musk''s
  fortune as estimated by Forbes and Bloomberg, the guesses about the Al Maktoum family, Dubai''s own economy in
  dirhams and dollars, and the one number nobody has ever published: Prince Hamdan''s personal wealth. All
  estimates are labelled as estimates. Sources: Forbes, Bloomberg, Dubai Media Office, Dubai Statistics Center, WAM.'
tags: [Prince Hamdan net worth, Fazza net worth, Elon Musk net worth 2026, Hamdan vs Musk, richest prince,
       Crown Prince of Dubai wealth, Fazza 2026, Dubai D33, Dubai economy 2026, Sheikh Hamdan salary, richest people 2026,
       Dubai AI Week]
sections:
  - say: >-
      Elon Musk. The richest man on the planet. Prince Hamdan. The Crown Prince of Dubai, the man the internet calls
      Fazza. Two names that millions of people search every single day, and one question that nobody has answered
      properly. Who is really richer in twenty twenty six? Today we are going to put every published number side by
      side. Musk's fortune. The guesses about the Al Maktoum family. Dubai's economy in dirhams and in dollars. And
      one number that nobody in the world has ever seen. Stay until the end, because the answer is not what you
      think. And if you like real numbers, not rumours, like the video and subscribe. Let's begin.
    show: [him, "search:Elon Musk", "event:Burj|future|council", "search:Dubai skyline"]
  - say: >-
      Let's start with the easy side, because Musk's money is public. Every year Forbes and Bloomberg publish a list
      of the richest people alive, and every year his name is at the top. In twenty twenty six their estimates have
      moved around a lot, from roughly six hundred billion dollars early in the year to well over eight hundred
      billion dollars in the summer, depending on who is counting and how they value his private companies. Think
      about that number. One billion is a thousand million. And he is counted in hundreds of those.
    show: ["search:Elon Musk", "search:SpaceX Starship launch", "search:Tesla Gigafactory", "search:Falcon 9 liftoff"]
  - say: >-
      But where does that money actually sit? Not in a bank. It sits in shares. A big part of it is his stake in
      SpaceX, the rocket company, and another large part is his stake in Tesla. If those share prices fall, his
      fortune falls with them, sometimes by tens of billions in a single day. That is why the lists disagree and
      why his number goes up and down like a heartbeat. His wealth is huge, but it is paper wealth, tied to the
      price of a few companies.
    show: ["search:SpaceX", "search:Tesla Model S", "search:stock exchange trading floor", "search:Elon Musk SpaceX"]
  - say: >-
      Now the other side. Here is where people go wrong, and here is where I want you to listen carefully. Prince
      Hamdan is not on the Forbes list. Not on the Bloomberg list. No magazine has ever published a verified figure
      for his personal wealth. If you see a video or a website that says he has exactly this many millions or this
      many billions, it is a guess, and most of those guesses come from pages that copy each other. We checked, and
      we will not repeat a number that nobody can prove.
    show: [him, "him:council|meeting", "him:Burj|airport", "event:housing|meals"]
  - say: >-
      So what do we actually know? We know his role. Hamdan bin Mohammed is the Crown Prince of Dubai. He is also
      the Deputy Prime Minister and the Minister of Defence of the United Arab Emirates, and he chairs the Executive
      Council of Dubai, the body that runs the daily work of the emirate. Those are public jobs, with public
      budgets, and they are not the same thing as a private bank account. This is the first big lesson of the
      story. Running a city and owning a fortune are two different things.
    show: ["him:council|meeting", "event:council|executive", "him:graduates|ceremony", "event:defence|armed forces"]
  - say: >-
      What about his family? Websites love to talk about the wealth of the Al Maktoum family, the ruling family of
      Dubai. You will find guesses from a few billion dollars to about eighteen billion dollars for the whole
      family. Here is the honest truth. None of those figures are official, none are audited, and they do not agree
      with each other. The reason is simple. In Dubai, a large part of what a visitor sees as royal wealth is held
      by the state, by government companies and by the emirate itself, not by one person.
    show: ["search:Mohammed bin Rashid Al Maktoum", "search:Dubai Creek", "search:Emirates Palace", "him"]
  - say: >-
      So let's do the part you asked for, the actual calculation. We are going to use only official Dubai numbers.
      In the first quarter of twenty twenty six, the Dubai Media Office reported that the economy of Dubai produced
      about two hundred and thirty two billion dirhams. That is about sixty three billion dollars in just three
      months. Multiply that by four, and the emirate is producing roughly two hundred and fifty billion dollars of
      output in a year. Keep that number in your head.
    show: ["event:economy|trade|business", "search:Dubai skyline night", "search:Dubai Marina", "event:Burj"]
  - say: >-
      Now compare. If Musk's fortune is around eight hundred billion dollars, you could take every dirham of
      everything Dubai produces for more than three years in a row, and you would only just reach his number. Three
      years of an entire city's output. That is the size of his paper wealth. So if the question is simply who
      has more money on a list, the answer is clear and we will say it plainly. Elon Musk is far ahead of any
      figure that has ever been attached to Prince Hamdan.
    show: ["search:Elon Musk", "search:Dubai Downtown", "search:SpaceX launch", "search:Tesla factory"]
  - say: >-
      But wait. Because this is where the comparison gets interesting, and where the question changes. Dubai's
      output is not Hamdan's money. It is the economy of a city of millions of people, and it belongs to the people
      who work there. What a Crown Prince holds is something different. Influence. Decisions. The power to say yes
      to a plan that changes how a whole emirate lives. In twenty twenty three he took on the plan called D thirty
      three, the Dubai Economic Agenda, with one stated goal: to double the size of the emirate's economy by the
      year twenty thirty three.
    show: [him, "event:economy|D33|agenda", "him:council", "search:Dubai construction cranes"]
  - say: >-
      And here is the twenty twenty six angle that makes this story feel so modern. In April of twenty twenty six,
      Dubai hosted the second Dubai AI Week, which Hamdan bin Mohammed had directed to return at double the scale of
      the first, with around twenty events across the city. He also launched the Dubai AI Academy, which aims to
      train ten thousand leaders in artificial intelligence. Musk builds rockets and cars. Hamdan is trying to
      build a city that leads the world in the same technology Musk talks about every day.
    show: ["event:AI|future|technology", "him:future|AI|innovation", "search:artificial intelligence robot", "event:future|museum"]
  - say: >-
      So are they rivals? Not really. They are almost opposite. Musk is a founder, and his wealth is the value of
      companies he started. Hamdan is an heir and a public servant, and his story is about a state and a family
      that have spent decades building a desert port into one of the most visited cities on earth. One is
      measured in share prices. The other is measured in airports, towers, schools, hospitals and homes. You cannot
      compare them on one list, and that is exactly why the question fascinates millions of people.
    show: ["search:Dubai 1970s", "search:Dubai International Airport", "search:Burj Khalifa", "him"]
  - say: >-
      Before we finish, let's clear up three mistakes that almost every video on this topic makes. Mistake number
      one. Confusing a country's money with a person's money. When you hear that a government has billions, that is
      a budget for roads, schools and salaries, not a private fortune. Mistake number two. Trusting websites that
      give a precise figure with no source. A real number comes with a name behind it, like Forbes or Bloomberg,
      and with a method. Mistake number three. Forgetting that even the real lists disagree, because private
      companies have no daily share price, so every list has to make an educated guess about what they are worth.
    show: ["search:newspaper business", "event:economy|council", "search:stock market chart", "him"]
  - say: >-
      Why does this matter? Because the internet runs on big numbers. A shocking figure gets clicked, shared and
      repeated, and after a week everybody treats it as a fact. We would rather give you a smaller truth than a
      bigger rumour. So when you see a video promising the secret fortune of any prince, any billionaire, any
      famous family, ask one simple question. Who published this number, and how did they get it?
    show: [him, "search:Dubai Mall", "event:Burj|housing", "him:ceremony|graduates"]
  - say: >-
      Now let me ask you something, because this is the part where you can help. Do you think Prince Hamdan's real
      number would ever be published, or do you think it will always stay a secret? Tell us in the comments, I read
      them, and your answer might be the next video. And if you want more stories where we check the numbers before
      we say them, make sure you are subscribed.
    show: [him, "him:horse|race|endurance", "him:Burj", "event:housing|meals"]
  - say: >-
      Here is what I want you to remember. On a list, Elon Musk is richer, by a very long way, and the published
      numbers say so. But the richest list was never the whole story. Behind Prince Hamdan there is a city that
      produces about two hundred and fifty billion dollars a year and a plan to double it. The truth is that nobody
      outside his family knows his personal fortune, and anyone who tells you the exact figure is guessing. We
      prefer to show you what is real. If you enjoyed this, like the video, subscribe, and we will see you in
      the next one.
    show: [him, "event:Burj|economy", "search:Dubai skyline", "him:ceremony|graduates"]
