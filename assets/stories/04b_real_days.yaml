- Fazza falcon
- Sheikh Hamdan Burj Khalifa
- Sheikh Hamdan children
- Crown Prince of Dubai life
- Fazza 2026
sections:
- beats:
  - say: He is the Crown Prince of Dubai, the Deputy Prime Minister and the Minister of Defence of the United Arab Emirates.
    show:
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
  - say: Millions of people follow his life online. But what does a day in his life really look like?
    show:
    - clip:skydive-pov
  - say: Not the official portraits. The real hours.
    show:
    - clip:skydive
  - say: Where does he go before sunrise? Who does he visit late at night? And what does he do that most leaders in the world
      never would?
    show:
    - video:condolence
    - clip:jetpack-rescue
  - say: Stay until the end, because the last part of his day is the one he never shows. Let's begin.
    show:
    - clip:horse-stable
- beats:
  - say: In the desert, the most important races of his life begin in the dark.
    show:
    - key:dubai crown prince arrives in manama for endurance race
  - say: Endurance riding is one of the toughest sports on Earth. Horse and rider cover up to one hundred and sixty kilometres
      in a single day, and in the Gulf, races often start before dawn to escape the heat.
    show:
    - key:dubai crown prince arrives in manama for endurance race
    - him:endurance race|Endurance Cup|endurance test
  - say: For Fazza, this is not a hobby. In two thousand and fourteen, he became world champion, winning individual gold at
      the World Equestrian Games in Normandy, France.
    show:
    - key:fazza leads uae riders in alltech fei world equestrian games
    - clip:windsor-stand
  - say: That same year, in England, Queen Elizabeth the Second honoured him after he won the Royal Windsor endurance race.
    show:
    - clip:queen
  - say: Champions are made in those quiet hours before the sun comes up, when nobody is watching.
    show:
    - key:queen elizabeth honors hamdan on winning windsor royal endurance race
- beats:
  - say: Then there is the city itself. In October two thousand and seventeen, Fazza launched something unusual for a royal.
      He asked an entire city to move.
    show:
    - key:hamdan bin mohammed inaugurates dubai fitness challenge
  - say: The Dubai Fitness Challenge asks every resident to exercise for thirty minutes a day, for thirty days.
    show:
    - key:hamdan bin mohammed challenges the city to join dubai fitness challenge 2018
  - say: And every year, Sheikh Zayed Road, the biggest highway in Dubai, is closed to cars so that thousands of cyclists
      can ride it at dawn.
    show:
    - key:third edition of dubai ride takes thousands of cycling enthusiasts on an exhilarating bike ride experience around
      city s iconic landmarks
  - say: In November two thousand and twenty-five, a record three hundred and seven thousand runners filled that same highway
      for the Dubai Run.
    show:
    - clip:dubairun
  - say: Afterwards, Fazza thanked them in a video, saying it showed a city that never stops inspiring.
    show:
    - key:hamdan bin mohammed challenges the city to join dubai fitness challenge 2018
    - key:hamdan bin mohammed inaugurates dubai fitness challenge
- beats:
  - say: But the Crown Prince is not just an athlete. Most of his days are full of work that the cameras rarely show in detail.
    show:
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
  - say: For twenty years, he has led the Executive Council of Dubai, the body that runs the city's government, from roads
      and schools to health and housing.
    show:
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
  - say: In those meetings, officials present their plans, and the Council decides which ones move forward.
    show:
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
  - say: Many of the city's plans for new districts, transport and public services pass through that council before they become
      real.
    show:
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
  - say: According to recent reports, Dubai's economy roughly doubled during his two decades in charge.
    show:
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
- beats:
  - say: And since two thousand and twenty-four, his days also belong to the armed forces.
    show:
    - video:armed forces|graduation|cadets|National Service
  - say: As Minister of Defence, he attends the graduation of young officers and recruits as they march past.
    show:
    - video:graduation|cadets|National Service
  - say: During Ramadan, he has broken his fast with national service recruits and with soldiers of the National Guard, sharing
      the same meal.
    show:
    - video:Iftar|recruits|National Guard
  - say: For many young Emiratis in uniform, sharing an iftar with the Crown Prince is a memory for life.
    show:
    - video:Iftar|recruits|National Guard|armed forces
- beats:
  - say: Now comes the part of his day that the world almost never hears about.
    show:
    - video:condolence
  - say: In the Emirates, when a family loses someone, the community comes to their majlis to offer condolences. And very
      often, the Crown Prince comes too.
    show:
    - video:condolence
  - say: Official footage shows him again and again, sitting quietly with grieving families and greeting the elders, listening.
    show:
    - video:condolence
  - say: During Ramadan, he also receives well-wishers, greeting long lines of citizens one by one.
    show:
    - video:Ramadan|well-wishers
  - say: No speeches, no stage. Just a son of Dubai sitting with his people when they need it most.
    show:
    - video:condolence|well-wishers
- beats:
  - say: Some of his favourite hours are spent with young people.
    show:
    - video:students|school|graduates|children
  - say: He meets top students and graduates, congratulates them personally, and shares their achievements with his millions
      of followers.
    show:
    - video:students|graduates|school
  - say: He once shared an iftar with autistic children and their families, a moment that was filmed and shared across the
      country.
    show:
    - video:autistic|children
  - say: For a teenager in Dubai, a handshake from Fazza is the ultimate prize.
    show:
    - video:students|children|graduates
- beats:
  - say: Between all the duties, there is another Fazza, the adventurer.
    show:
    - clip:skydive
  - say: He is a trained skydiver, and a diver who has swum with sharks in the open sea and trained in Deep Dive Dubai, the
      deepest pool in the world.
    show:
    - clip:sharks
    - clip:deepdive
  - say: In two thousand and thirteen, after Dubai won the right to host Expo twenty-twenty, he climbed to the very top of
      the Burj Khalifa, the tallest building in the world, and waved the UAE flag from the tip of the spire.
    show:
    - clip:burj-flag
  - say: 'And he has never lost his love for the old traditions of the desert: his camels, which he calls by name, and his
      falcons, the sport of his grandfathers.'
    show:
    - clip:camels
    - clip:car-falcon-camel
    - clip:falcon-hunt
  - say: Modern prince, ancient roots. That mix is exactly why young Emiratis see themselves in him.
    show:
    - clip:falcon-hunt
    - clip:camels
- beats:
  - say: And then there is the man who taught him everything. His father, Sheikh Mohammed bin Rashid, ruler of Dubai.
    show:
    - key:mohammed bin rashid and hamdan bin mohammed visits dubai motor show
  - say: Father and son are filmed together at ceremonies, visits and celebrations, and Fazza has spent his whole adult life
      at his father's side.
    show:
    - key:mohammed bin rashid attends 29th dubai world cup
    - key:mohammed bin rashid and hamdan bin mohammed visits dubai motor show
  - say: They share more than work. Both are horsemen, and both are poets. Sheikh Mohammed has written Nabati poetry for decades,
      and his son learned the art from him, writing under the name Fazza, which is often explained as the one who comes to
      help.
    show:
    - key:mohammed bin rashid attends al marmoum heritage festival closing races
    - key:mohammed bin rashid attends 29th dubai world cup
  - say: In public, Fazza always shows his father the deepest respect. In his culture, that is not protocol. It is love.
    show:
    - key:mohammed bin rashid attends al marmoum heritage festival closing races
    - key:mohammed bin rashid and hamdan bin mohammed visits dubai motor show
- beats:
  - say: Some of the most famous moments of his days were never planned at all. They were filmed by strangers on their phones.
    show:
    - clip:rescue-a
  - say: In March two thousand and seventeen, people filmed him in the desert using his own Mercedes G-Class to pull a stranger's
      lorry out of the sand. The rope broke the first time. He tried again, and the truck rolled free.
    show:
    - clip:rescue-a
    - clip:rescue-b
  - say: In July two thousand and twenty-two, he asked his followers to find a delivery rider who had cleared concrete blocks
      from a busy road. He phoned him personally to say thank you, and later met him in person.
    show:
    - clip:rider
    - clip:rider-meet
  - say: And in October two thousand and twenty-six, he went to the hospital bedside of an Indian pilot who had survived an
      axe attack in the cockpit, and called him part of our team.
    show:
    - clip:smit
    - key:hamdan bin mohammed visits flydubai pilot and praises his courage
- beats:
  - say: And when the official day ends, the cameras stop. Because the last part of his day belongs to his family.
    show:
    - clip:horse-car
  - say: Fazza is the father of four children, twins Rashid and Shaikha, a son named Mohammed and a daughter named Hind.
    show:
    - clip:twins-stroller
  - say: He almost never shows their faces. When he shares them at all, it is a tiny hand, a child seen from behind, a small
      moment at home.
    show:
    - clip:child-horse
    - clip:son-walk
  - say: And his wife, Sheikha Shaikha, has never been shown in public. For a man followed by seventeen million people, home
      is the one place no one is invited.
    show:
    - clip:white-horse
    - clip:horses
- beats:
  - say: Before sunrise on horseback. In the morning, running with his city. By day, running its government. At night, sitting
      with families in mourning. And then, quietly, home.
    show:
    - video:condolence
    - video:chairs.*Executive Council|marks 20 years leading the Executive Council
    - video:Iftar|recruits|National Guard
  - say: That is the real day of the Crown Prince of Dubai. Not a palace of gold, but a life of duty, sport and people.
    show:
    - video:students|graduates|school
    - key:queen elizabeth honors hamdan on winning windsor royal endurance race
  - say: Which part of Fazza's day would you most like to join? Tell us in the comments, and subscribe to The Luxury Lane
      for more of the real Fazza.
    show:
    - clip:oryx
    - clip:deepdive
