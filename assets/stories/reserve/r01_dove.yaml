    - him
  - say: Within two hours that video had five hundred forty-seven thousand views and more than seven thousand comments.
    show:
    - clip:ig-dove-hatch
  - say: Two hours, for a pair of doves.
    show:
    - clip:ig-dove-close
  - say: Why? Perhaps because people are tired of loud, expensive, perfect things.
    show:
    - clip:ig-cloud-roof-a
  - say: They saw a powerful man pause his own life for a bird, and it felt like calm.
    show:
    - clip:ig-dove-brood
  - say: Newspapers around the Gulf wrote about it. Fact checkers who looked into it rated the story true.
    show:
