sections:
- say: 'Baby, I lied about my age. My queen, just one minute please. I finally saw the real you. If you search for Fazza
    on YouTube, you have seen titles like these: emotional love poems, read in English by a deep, dramatic voice, over
    photos of Prince Hamdan. Some of these videos have tens of thousands of views. Many people in the comments believe
    the Crown Prince of Dubai wrote them, sometimes even for them personally. But did he? Who is really behind the Fazza
    poems? And what does his real poetry sound like? Stay until the end, because the truth will change how you see these
    videos forever. Like and subscribe, and let''s begin.'
  show:
  - him
  - him:poetry|poem|culture
- say: First, the real story. Prince Hamdan really is a poet. Since his youth he has written poetry under the name Fazza,
    the name millions now know him by. It is usually explained as meaning the one who comes to help. His poems are in
    Arabic, in a traditional style of Gulf poetry called Nabati, the poetry of the desert, which has been recited in
    Arabia for centuries. It is the same style his father, Sheikh Mohammed, has written in for decades. Father and son
    have even exchanged verses, answering each other in poetry, the way poets in the region have done for generations.
    His real poems speak about love, longing, the homeland, horses, the desert and his family.
  show:
  - him:poetry|poem|culture|heritage
  - cat:Mohammed bin Rashid Al Maktoum
  - search:desert Bedouin
- say: 'Poetry is not a hobby in the Gulf. It is part of the culture''s soul. In Abu Dhabi there is even a hugely popular
    television competition called Million''s Poet, where poets recite Nabati verses in front of judges and a live audience,
    and millions of viewers across the Arab world vote for their favourites. Great poets are celebrated like stars. That
    is the world Fazza''s real poetry belongs to: a centuries-old tradition where a single beautiful verse can be remembered
    and quoted for generations, and where rulers and princes are expected to master words as well as power.'
  show:
  - search:Arabic calligraphy
  - him:poetry|culture|heritage
  - cat:Abu Dhabi
- say: 'Now look at the videos you find when you search for Fazza poems. They follow almost exactly the same pattern.
    A dramatic title in English, often written as if Fazza is speaking directly to a woman: baby, my queen, my future
    wife. A thumbnail with his face, sometimes edited next to a woman he has never met. A long video, often thirty or
    forty minutes, with a deep artificial voice reading slow, emotional lines in English. And very often, somewhere in
    the description or in small letters on the screen, two important words: fan made. In other words, these poems were
    written by someone else, and simply use his name and his photos.'
  show:
  - him
  - search:microphone studio
  - cat:Hamdan bin Mohammed Al Maktoum
- say: Why do they do it? Because it works. Fazza is one of the most searched royals in the world, and his real poems
    are in Arabic, which most of his fans around the world cannot read. So these channels fill the gap with English poems
    that sound romantic and personal, and that people want to believe are from him. Every view earns them money. Some
    channels publish a new poem almost every day. Have you ever believed one of these poems was really written by Fazza?
    Be honest, and tell us in the comments.
  show:
  - search:smartphone YouTube
  - him
  - him:poetry|culture
- say: Here is the problem. Some of the comments under these videos are heartbreaking. Viewers write messages to Fazza
    as if he made the video for them. Some say they are waiting for him. Some believe the poems are secret messages about
    his private life, his marriage or a hidden love. But the Crown Prince of Dubai does not publish English love poems
    addressed to strangers on random YouTube channels. His real poetry appears on his official accounts and in the Arabic
    poetry world, not in forty-minute English videos with an artificial voice. Mixing his name with invented words can
    mislead people who simply love him.
  show:
  - him
  - cat:Zabeel Palace
  - him:people|citizens
- say: 'So how can you tell the difference? Here are four simple checks. One: is it in English? His original poems are
    written in Arabic. A translation must say it is a translation. Two: look for the words fan made, inspired by, or
    tribute, often hidden in the description. Three: check the channel. If it is not his official account, it is not
    him speaking. Four: look at the thumbnail. If Fazza appears next to a woman, the image is almost certainly edited,
    because he has never shown his wife''s face to the public. If a video fails these checks, you can still enjoy the
    poem, but know that the words are not his.'
  show:
  - search:magnifying glass
  - him
  - cat:Hamdan bin Mohammed Al Maktoum
- say: 'And if you want to know the real Fazza through his poetry, the best way is through translation done with care.
    Arabic Nabati poetry depends on rhythm, rhyme and the dialect of the Gulf, so a good translation always loses a little
    magic. But the themes are clear and beautiful: devotion to his father and his homeland, the pain of longing, the
    pride of the desert, the strength of horses and falcons. His most moving verses are often about the people he loves,
    written by a man who almost never speaks about his private life in any other way.'
  show:
  - him:poetry|horse|falcon|desert
  - search:Arabic calligraphy
  - cat:Endurance riding
- say: Here is a simple tip if you want to follow his real poetry. Look for poems shared on his official accounts, and
    for Arabic poetry pages that credit the poem and its date. If you use a translation app, remember that Nabati poetry
    is full of desert words and Gulf dialect that machines often get wrong, so the English may sound strange even when
    the original is beautiful. And always be suspicious when a poem in perfect, dramatic English claims to be a brand
    new message from Fazza to you personally. That is almost always a sign that someone else wrote it.
  show:
  - him:poetry|poem
  - search:smartphone screen
  - cat:Hamdan bin Mohammed Al Maktoum
- say: 'There is something touching in all of this. Millions of people around the world want to feel close to Fazza,
    so close that they will listen to poems they hope he wrote for them. That says something about him: a crown prince
    who inspires that kind of love. But real admiration deserves real words. The next time you see a Fazza poem in English
    with a dramatic voice, remember to check who really wrote it. It is also worth remembering that real poets put their
    names and their reputations on every verse they publish. When a poem is presented as the words of a crown prince,
    it should truly be his. Fans deserve to know the difference between a tribute written by an admirer and a poem written
    by Fazza himself. Both can be beautiful, but only one of them is really his voice. The more people learn to check,
    the harder it becomes for anyone to put words in the mouth of someone millions of people trust.'
  show:
  - him
  - him:people|citizens|children
- say: 'So, are the YouTube Fazza poems real? Mostly no: they are fan-made words using his name and photos. His real
    poems are in Arabic, written in the ancient style of the desert. Did you believe these videos were his? Write it
    in the comments, and tell us if you would like a video about his real Arabic poems, translated with care. And if
    you have seen a Fazza poem video that you are not sure about, write its title in the comments, and we will check
    it for you in a future video. Like this video and subscribe to The Luxury Lane for the real stories about Prince
    Hamdan. See you next time.'
  show:
  - him
  - him:poetry|culture
