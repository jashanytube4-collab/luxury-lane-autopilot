sections:
- beats:
  - say: On the thirtieth of September, a flydubai jet took off from Dubai with more than one hundred and seventy people
      on board.
    show: [clip:flydubai-jet2, clip:fz-plane-stairs]
  - say: Within hours, the whole world was asking how close it had come to disaster.
    show: [clip:fz-cabin-aisle]
  - say: The danger came from the seat right next to the captain.
    show: [clip:fz-bs-cockpit]
  - say: What happened behind that locked door has shocked pilots all over the world.
    show: [clip:fz-i24-passenger]
  - say: And the man who stopped it was bleeding when he made the choice that kept everyone alive.
    show: [clip:fz-smit-selfie]
  - say: Days later, Prince Hamdan was standing beside his hospital bed.
    show: [clip:smit-bedside, clip:fz-visit-shoulder]
  - say: Today, five shocking truths about the flydubai cockpit attack, and the words from Fazza that made millions of
      people proud. Let's begin.
    show: [clip:fz-visit-lean]
- beats:
  - say: Shocking truth number one. This was an ordinary flight, with a very experienced captain.
    show: [clip:fz-plane-gate, clip:fz-couple-suit]
  - say: Flight FZ one zero seven three was flying from Dubai to Tel Aviv.
    show: [clip:fz-kt-map, clip:fz-telaviv-window]
  - say: flydubai is Dubai's own airline, flying to more than a hundred destinations, and Prince Hamdan has reviewed
      the operations of Dubai's airport himself.
    show: ["key:hamdan bin mohammed reviews operations of dubai international airport and emirates"]
  - say: In the left seat sat Captain Smit Machchhar, from India.
    show: [clip:fz-smit-selfie2]
  - say: He grew up in Mumbai, and his father paid for his first flying lessons.
    show: [clip:fz-uncle]
  - say: He trained in New Zealand, flew for SpiceJet for about ten years, and joined flydubai in twenty twenty-two.
    show: [clip:fz-aunt]
- beats:
  - say: Shocking truth number two. The attack came from inside the flight deck, from his own first officer.
    show: [clip:fz-almog]
  - say: UAE prosecutors say the co-pilot assaulted the captain and tried to seize control of the plane.
    show: [clip:fz-reuters-arrive]
  - say: His weapon was the crash axe, an emergency tool that every airliner carries.
    show: [clip:fz-cabin-seats, clip:fz-cabin-call]
  - say: The captain was hit again and again, on his head, and on his hand, which was broken.
    show: [clip:fz-smit-call]
  - say: Later, from his hospital bed, he said that he had been fighting for his life.
    show: [clip:fz-smit-call2]
- beats:
  - say: Shocking truth number three. The door that was built to keep everyone safe had turned into a trap.
    show: [clip:fz-passenger-arrivals]
  - say: Since two thousand and one, cockpit doors have been reinforced, and the pilot inside can keep them shut.
    show: [clip:fz-arrive-night, clip:fz-arrive-gate]
  - say: That stops hijackers. But when the threat is already inside, every bit of help is locked on the wrong side.
    show: [clip:fz-bg-crowd, clip:fz-arrive-walk]
  - say: Captain Smit saw it in seconds. Injured and weakening, he could not fight and fly the jet at the same time.
      So he unlocked that door.
    show: [clip:fz-arrivals-hall]
  - say: One passenger, Yaniv Hayoun, told reporters that he and a crew member got the door open, and found the wounded
      captain on the other side.
    show: [clip:fz-yaniv, clip:fz-reunion-medics]
  - say: A relief pilot who was travelling on the flight took the controls and diverted to Tabuk, in the north-west of
      Saudi Arabia.
    show: [clip:fz-track-map, clip:fz-kt-city]
  - say: The jet touched down safely. Not one passenger lost their life, and the co-pilot was arrested.
    show: [clip:fz-tabuk-wide, clip:fz-tabuk-stairs, clip:fz-tabuk-landed]
  - say: 'From the ground, one passenger sent a message: We are in the Tabuk area of Saudi Arabia. All the passengers
      are okay, but not the pilot.'
    show: [clip:fz-tabuk-window, clip:fz-tabuk-walk, clip:fz-lounge]
  - say: Be honest. Would you have run toward that cockpit, or stayed frozen in your seat?
    show: [clip:fz-disembark, clip:fz-reunion-kiss]
- beats:
  - say: While the plane was on the ground in Tabuk, his family in India had no idea whether he was alive.
    show: [clip:prayers-india]
  - say: His wife, Sonal, later told Indian reporters she was shattered, and simply did not know how to react, until
      officials finally confirmed that he was stable.
    show: [clip:fz-couple-selfie, clip:fz-sonal]
  - say: Surgeons in Saudi Arabia treated him first. Then he was flown back to the UAE, to recover in Abu Dhabi.
    show: [clip:fz-ambulance, clip:fz-visit-seated]
  - say: The passengers were flown on to Tel Aviv, where their families were waiting with flags, balloons and tears.
    show: [clip:fz-flags, clip:fz-arrive-family, clip:fz-tears]
- beats:
  - say: Shocking truth number four. This was not a breakdown, and it was not a fight between two colleagues.
    show: ["key:hamdan bin mohammed chairs defence council meeting"]
  - say: The UAE's Attorney General, Hamad Al Shamsi, said investigators found that the co-pilot had attempted a
      terrorist act.
    show: [clip:fz-plane-night, clip:fz-reunion-hug]
  - say: News agencies, quoting their sources, reported that he was from Oman, and that Oman Air had earlier stopped him
      from flying over concerns about extremist views. UAE officials have not confirmed those reports, and the
      investigation is continuing. Now people are asking how a man with that history ended up in a cockpit at all.
    show: ["key:hamdan bin mohammed reviews preparations and protocols at dubai airport"]
- beats:
  - say: Meanwhile, in India, Captain Smit became a national hero almost overnight.
    show: [clip:fz-modi-post]
  - say: Prime Minister Narendra Modi called him on a video call.
    show: [clip:fz-modi-call]
  - say: Smit told him that one hundred and seventy-four lives were in his hands, and that he knew he could have died.
    show: [clip:fz-smit-call3]
  - say: He said he had chanted the Hanuman Chalisa in the cockpit, and he called Modi his biggest idol.
    show: [clip:fz-smit-call4]
  - say: Modi told him that the nation is proud of him, and Gujarat announced a state award in his honour.
    show: ["key:hamdan bin mohammed meets with indian prime minister to discuss future of bilateral partnership"]
  - say: Indian media reported that even Bollywood stars, including Shah Rukh Khan, Salman Khan and Ranveer Singh,
      praised him.
    show: ["key:hamdan bin mohammed arrives in new delhi on official visit to india"]
- beats:
  - say: Shocking truth number five. The most powerful reply came from the Crown Prince of Dubai himself.
    show: [clip:fz-visit-portrait, clip:fz-visit-monitor]
  - say: Prince Hamdan is not only Dubai's Crown Prince. He is also Deputy Prime Minister and Minister of Defence of
      the UAE.
    show: ["key:hamdan bin mohammed attends ceremony marking 49th anniversary of uae armed forces unification"]
  - say: On Saturday, the third of October, Prince Hamdan bin Mohammed went to see the captain in hospital.
    show: [clip:fz-visit-doctor]
  - say: With him was Sheikh Ahmed bin Saeed, the head of Dubai's civil aviation authority and the chairman of Emirates.
    show: ["key:hamdan bin mohammed and maktoum bin mohammed visit emirates group headquarters"]
  - say: Fazza took the captain's hand, rested a hand on his shoulder, and spoke with him warmly.
    show: [clip:fz-visit-hand]
  - say: Afterwards, he wrote that the flydubai pilot embodied the highest degrees of courage, responsibility, and care
      for human life.
    show: [clip:hamdan-post]
  - say: And he added that the UAE is proud he is part of our team, and part of our nation's story. A nation of
      compassion, of peace, and of life.
    show: ["key:hamdan bin mohammed concludes first official visit to india commends strong bilateral partnership"]
- beats:
  - say: Why did that one message spread so fast? The UAE is home to people of more than two hundred nationalities, and
      Indians are the biggest community of all.
    show: ["key:hamdan bin mohammed meets with uae diplomatic mission in india commends ministry of foreign affairs efforts"]
  - say: For millions of Indian workers and families living there, hearing the Crown Prince call an Indian captain part
      of the team meant everything.
    show: ["key:hamdan bin mohammed meets with chairman of international cricket council indian cricket stars"]
  - say: Fazza has a long habit of this. He has visited grieving families, and sat with wounded soldiers.
    show: [video:condolence]
  - say: He once tracked down a delivery rider, just to thank him for clearing concrete blocks out of the road.
    show: [clip:rider]
  - say: He did not need to go to that hospital. He chose to.
    show: ["key:hamdan bin mohammed visits dubai airshow 2017"]
- beats:
  - say: Today, the Indian embassy says Captain Smit is recovering well. Strangers keep sending him the same two words.
      Thank you.
    show: [clip:fz-ambassador, "key:hamdan bin mohammed reviews newly completed air taxi station near dubai international airport the first facility of its kind in the world"]
  - say: He never asked to be a hero. On the worst day of his working life, his first thought was for the people on the
      other side of that door.
    show: ["key:hamdan bin mohammed tours dubai airshow 2023"]
  - say: And Prince Hamdan showed what a real leader does when someone risks everything for others. He shows up, in
      person.
    show: ["key:hamdan bin mohammed visits dubai airshow exhibition"]
  - say: If you could send Captain Smit one message, what would it be? Tell us in the comments, and subscribe to The
      Luxury Lane for more real stories of Fazza.
    show: ["key:hamdan bin mohammed visits emirates flight catering commends its role in advancing dubai s aviation ecosystem"]
