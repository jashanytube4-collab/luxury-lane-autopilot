description: A video tribute to the brother he lost. A crying woman he refused to leave. A truck stuck in the desert
  that he pulled out with his own G-Class. A bird's nest he would not disturb. The most emotional real moments of Prince
  Hamdan (Fazza), Crown Prince of Dubai — the side of him the official photos never show.
