id: brother-rumours
title: Fazza's Brother Died at 33 — The Rumours Dubai Never Answered
thumbnail:
  text: WHAT REALLY HAPPENED?
  tag: UNSOLVED
  inset: cat:Endurance riding
mood: epic
footage: endurance|horse|condolence|Mohammed bin Rashid
description: He was the firstborn son of Dubai's ruler and the brother Prince Hamdan called his best friend. Why was
  he passed over for the crown, why did he die so suddenly at 33, and why do the rumours never stop? The story of Sheikh
  Rashid bin Mohammed — what was officially said, what was whispered, and what Fazza did years later.
