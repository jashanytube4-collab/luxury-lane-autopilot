description: Prince Hamdan's falcon Ghaith, bred for hunting and nicknamed the Phenomenon, broke a record at the Fazza Championship for Falconry, and then broke it again. What the Crown Prince of Dubai
  did with the prize surprised everyone. Plus the race his falcon Antar lost by five hundredths of a second, the international falconry federation he ordered, and the falcon season he opens with his son
  Rashid. Built from Khaleej Times, Gulf News, What's On Dubai, Dubai Media Office reports and his own Instagram videos. Stock footage of falcons and the desert is for atmosphere.
