sections:
- say: He rules one of the most famous cities on Earth. He is a poet, a champion horseman and one of the richest men
    in the Arab world. But the most surprising thing about Sheikh Mohammed bin Rashid, the father of Prince Hamdan, is
    the size of his family. How many wives has he had? How many children does he really have? Which of them married billionaires,
    which of them run Dubai, and which of them ran away? And out of all those sons, why was Fazza the one chosen to be
    heir? Stay until the end, because the family tree of Dubai's ruler is more dramatic than any soap opera. Like and
    subscribe if you love royal secrets. Let's begin.
  show:
  - cat:Mohammed bin Rashid Al Maktoum
  - him
  - cat:Zabeel Palace
- say: First, the numbers. The royal court has never published an official family list, which is why you will see so
    many different figures online. Most reports say Sheikh Mohammed has had at least six wives over his lifetime, while
    Islamic law allows a man up to four wives at the same time. And the children? Reports count more than twenty of them,
    and many say the real number is close to thirty, sons and daughters, born over more than four decades. That makes
    Prince Hamdan one of the most senior members of an enormous family, with brothers and sisters of all ages, from grown
    men who run government departments to children who are still at school.
  show:
  - cat:Mohammed bin Rashid Al Maktoum
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - him:family|Eid
- say: 'The most important wife is Sheikha Hind bint Maktoum, Fazza''s mother. She married Sheikh Mohammed in nineteen
    seventy-nine, when she was just seventeen, and remains his senior wife. Reports say she is the mother of around twelve
    of his children, including the eldest son Rashid, Fazza himself, and Sheikh Maktoum, who today is First Deputy Ruler
    of Dubai and the UAE''s Minister of Finance. And here is the strangest fact about her: in more than forty years,
    almost no photos of her have ever been published. The mother of the future ruler of Dubai is one of the most invisible
    women in the world. Can you imagine being that famous and that unseen at the same time?'
  show:
  - him:Mohammed bin Rashid
  - cat:Maktoum bin Mohammed Al Maktoum
  - him
- say: Sheikh Mohammed bin Rashid was the third son of Dubai's ruler at the time, Sheikh Rashid bin Saeed. By the late
    nineteen seventies he was already a powerful man. At just twenty-two, he had become the first Minister of Defence
    of the newly created United Arab Emirates, the youngest defence minister in the world. He was a horseman, a poet
    and a man everyone in Dubai knew. In nineteen seventy-nine, the families agreed on a marriage. Sheikh Mohammed was
    about thirty. Hind was just seventeen. Their wedding has become a legend in the Gulf. According to the stories still
    told in Dubai today, the celebration lasted for days, tens of thousands of guests were invited, and an entire arena
    was prepared for the festivities. Some accounts even call it one of the most expensive weddings ever held. Whatever
    the exact numbers were, one thing is certain. Dubai had never seen anything like it.
  show:
  - cat:Mohammed bin Rashid Al Maktoum
  - search:Dubai 1970s
  - cat:Zabeel Palace
- say: The most famous wife was the opposite. Princess Haya of Jordan, daughter of King Hussein, married Sheikh Mohammed
    in two thousand and four. She was an Olympic rider, glamorous and always in public. They had two children, Jalila
    and Zayed. But in two thousand and nineteen she fled to London with them, and a British court later ordered a divorce
    settlement of around five hundred and fifty-four million pounds, reported as the largest ever in Britain. Other wives
    have been much more private. Reports name an Algerian-born wife who is the mother of the princesses Latifa and Shamsa,
    and a wife of Greek origin, Zoe Grigorakos, the mother of Sheikha Mahra. Which wife's story do you find most interesting?
    Tell us in the comments.
  show:
  - cat:Princess Haya bint Al Hussein
  - cat:Hussein I of Jordan
  - cat:Royal Courts of Justice
  - cat:Royal Ascot
- say: 'Now the sons. The firstborn, Sheikh Rashid, was a champion endurance rider who many expected to be heir. He died
    suddenly in two thousand and fifteen, at only thirty-three. Prince Hamdan, the second son, was named Crown Prince
    in two thousand and eight and today is also Deputy Prime Minister and Minister of Defence of the UAE. Sheikh Maktoum
    handles the country''s finances. Other brothers lead Dubai''s culture, sports and knowledge institutions. Many of
    them married on the same night: in June two thousand and nineteen, Hamdan, Maktoum and Ahmed celebrated a spectacular
    triple royal wedding at the Dubai World Trade Centre, dancing beside their father in front of thousands of guests.'
  show:
  - cat:Endurance riding
  - cat:Hamdan bin Mohammed Al Maktoum
  - cat:Dubai World Trade Centre
  - him:wedding|celebrat|Eid
- say: And the daughters may have the most dramatic stories of all. Sheikha Manal married Sheikh Mansour bin Zayed of
    Abu Dhabi, the billionaire owner of Manchester City football club, uniting two of the most powerful families in the
    Emirates. Sheikha Maitha became a champion in martial arts and carried the hopes of the UAE in international sport.
    Sheikha Mahra divorced her husband on Instagram in two thousand and twenty-four and later got engaged to the American
    rapper French Montana. And Sheikha Latifa tried to escape Dubai on a yacht in two thousand and eighteen, in a story
    that became an international scandal. Princesses who married billionaires, princesses who broke every rule. All of
    them are Fazza's sisters.
  show:
  - search:Etihad Stadium Manchester
  - cat:French Montana
  - cat:Latifa bint Mohammed Al Maktoum (II)
  - cat:Princess Mahra bint Mohammed of Dubai
- say: So with so many sons, why was Fazza chosen? No official reason was ever given. But people who watch the family
    closely point to the same things. He was the son who travelled everywhere with his father, sat in his meetings, rode
    beside him in the desert and learned to write poetry like him. He was disciplined, popular and calm. When his father
    became ruler in two thousand and six, Hamdan was put in charge of Dubai's Executive Council at just twenty-three,
    and two years later he became Crown Prince. In a family this large, being chosen is not about being born first. It
    is about being trusted.
  show:
  - him:Mohammed bin Rashid
  - him
  - cat:Mohammed bin Rashid Al Maktoum
- say: Some of the ruler's youngest children are growing up very far from Dubai. Jalila and Zayed, his children with
    Princess Haya, have lived in England since two thousand and nineteen, protected by the security the British court
    ordered. They are Fazza's half-sister and half-brother, but their lives look nothing like his. While he trained in
    the desert beside their father, they are growing up in British schools and country houses. Whether they will ever
    return to the family in Dubai is one of the great unanswered questions of this royal story.
  show:
  - search:English country house
  - cat:Princess Haya bint Al Hussein
  - search:London park
- say: 'And the family keeps growing. Sheikh Mohammed is now a grandfather many times over. Fazza alone has four children:
    twins Rashid and Shaikha, born in two thousand and twenty-one, a son Mohammed, born in two thousand and twenty-three,
    and a daughter Hind, born in two thousand and twenty-five. Notice the names. Rashid for his late brother, Mohammed
    for his father, Hind for his mother. The next generation is already arriving, and many people in Dubai quietly wonder
    whether little Rashid bin Hamdan will one day be the heir to everything his grandfather built.'
  show:
  - him:children|family|Eid
  - him
  - cat:Hamdan bin Mohammed Al Maktoum
- say: Six wives, about thirty children, princesses on the run and sons who rule. The family of Dubai's ruler is one
    of the most fascinating royal families in the world, and Fazza sits right at its centre, as the heir to all of it.
    Which of Fazza's brothers or sisters would you like to know more about? Write it in the comments, and we might make
    the next video about them. Like this video and subscribe to The Luxury Lane for more untold royal stories. See you
    next time.
  show:
