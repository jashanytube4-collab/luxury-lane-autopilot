id: mother
title: "Prince Hamdan's Mother: The Most Private First Lady in the World"
thumbnail: {text: "HIS MOTHER'S STORY", tag: "RARELY SEEN", inset: "cat:Mohammed bin Rashid Al Maktoum"}
mood: elegant
description: >-
  She has been married to the ruler of Dubai for more than four decades, she raised the Crown Prince, and yet almost
  no one has ever seen her face. Who is Sheikha Hind bint Maktoum, the mother of Prince Hamdan (Fazza)? The story of
  the legendary 1979 royal wedding, the twelve children, the son she lost, and the quiet woman at the heart of the
  Dubai royal family.
tags: [Prince Hamdan mother, Sheikha Hind, Fazza mother, Sheikh Mohammed wife, Hind bint Maktoum, Dubai first lady,
       Dubai royal family, Sheikh Mohammed wives, Prince Hamdan family, Sheikh Rashid bin Mohammed, Fazza family,
       Dubai royal wedding 1979]
sections:
  - say: >-
      She is the first lady of one of the richest cities on Earth. She has been married to the ruler of Dubai for more
      than forty years. She is the mother of the Crown Prince, the woman who raised Fazza. And yet, if she walked
      past you in the street, you would never know who she is, because almost no one has ever seen her face. Who is
      Sheikha Hind bint Maktoum? How did a seventeen-year-old girl become the senior wife of Sheikh Mohammed bin
      Rashid? What really happened at their legendary wedding? And how did she survive the darkest day a mother can
      face? Stay with us until the end, because her story is one of the most moving in the whole royal family. If
      you enjoy royal stories, please like this video and subscribe. Let's begin.
    show: [him, "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      Sheikha Hind bint Maktoum bin Juma Al Maktoum was born into the Al Maktoum family itself, the dynasty that has
      ruled Dubai since the nineteenth century. She grew up in a world very different from the Dubai we know today.
      In the nineteen sixties, there were no skyscrapers, no metro and no airport full of the world's biggest planes.
      Dubai was a trading town on a creek, with wind towers, souks and wooden dhows. The discovery of oil in nineteen
      sixty-six changed everything. Within a few years, money, roads and new buildings arrived, and the ruling family
      found itself at the centre of one of the fastest transformations in modern history. Inside the palace, though,
      life for the daughters of the family stayed traditional. Girls were raised at home, close to their mothers and
      grandmothers, protected from the eyes of outsiders. That is the world young Hind grew up in. A world of family,
      faith and privacy, a world she would never really leave.
    show: ["cat:Dubai Creek", "cat:Sheikh Rashid bin Saeed Al Maktoum", "search:Dubai 1960s", "cat:Al Bastakiya"]
  - say: >-
      Sheikh Mohammed bin Rashid was the third son of Dubai's ruler at the time, Sheikh Rashid bin Saeed. By the late
      nineteen seventies he was already a powerful man. At just twenty-two, he had become the first Minister of
      Defence of the newly created United Arab Emirates, the youngest defence minister in the world. He was a
      horseman, a poet and a man everyone in Dubai knew. In nineteen seventy-nine, the families agreed on a marriage.
      Sheikh Mohammed was about thirty. Hind was just seventeen. Their wedding has become a legend in the Gulf.
      According to the stories still told in Dubai today, the celebration lasted for days, tens of thousands of
      guests were invited, and an entire arena was prepared for the festivities. Some accounts even call it one of the
      most expensive weddings ever held. Whatever the exact numbers were, one thing is certain. Dubai had never seen
      anything like it.
    show: ["cat:Mohammed bin Rashid Al Maktoum", "search:Dubai 1970s", "cat:Zabeel Palace"]
  - say: >-
      After the wedding, the young bride did something that surprised no one in her family and fascinated everyone
      outside it. She disappeared from public view. While her husband became one of the most photographed leaders in
      the Middle East, Sheikha Hind chose a life almost completely behind the palace walls. She devoted herself to her
      family, and that family grew quickly. In nineteen eighty-one, she gave birth to a son, Rashid, named after his
      grandfather, the ruler of Dubai. Just one year later, on the fourteenth of November, nineteen eighty-two, came
      a second son, Hamdan. The boy who would one day be known to millions as Fazza. Over the following years, more
      children followed. According to most accounts, Sheikha Hind became the mother of twelve of Sheikh Mohammed's
      children, sons and daughters who today hold some of the most important positions in Dubai.
    show: [him, "him:Mohammed bin Rashid|family", "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      While she raised her children in private, the city outside the palace walls exploded into the future. In
      nineteen eighty-five, her husband helped launch Emirates, an airline that started with two leased planes and
      became one of the biggest in the world. In nineteen ninety-nine, the sail-shaped Burj Al Arab rose from the sea.
      In two thousand and six, Sheikh Mohammed became ruler of Dubai, and Hind became the wife of the ruler. In two
      thousand and ten, the Burj Khalifa opened, the tallest building on the planet. Dubai became a name known in
      every country on Earth. Millions of tourists arrived every year. Billionaires bought islands shaped like palm
      trees. And in the middle of all that glamour, the first lady of Dubai was almost never seen. No magazine
      covers, no interviews, no red carpets. Only a handful of photographs over four decades, many of them showing
      her wearing the traditional gold-coloured face mask, the burqa, worn by older Emirati women.
    show: ["cat:Burj Khalifa", "search:Burj Al Arab", "search:Emirates airline Airbus A380", "cat:Dubai Creek"]
  - say: >-
      Raising a royal family is not like raising any other family. Her sons were trained from childhood for duty. They
      learned to ride horses before they could ride bicycles, they sat in their father's majlis listening to elders,
      and they were sent abroad to the best military academies. Hamdan and his older brother Rashid were especially
      close. They studied together, rode together and competed together. People who knew the family say the brothers
      were inseparable. Meanwhile, Sheikh Mohammed's life was changing. Like many Gulf rulers, he married more than
      once. Other wives and other children came into his life. And in two thousand and four, he married Princess Haya
      of Jordan, a glamorous Olympic rider who appeared at his side at Royal Ascot, at summits and in magazines. The
      contrast could not have been bigger. One wife lived in the spotlight. The other, the senior wife, the mother of
      the future Crown Prince, remained invisible. Here is a question for you. Which life do you think brings more
      happiness, the spotlight or privacy? Tell us in the comments.
    show: ["him:horse|endurance", "cat:Royal Ascot", "cat:Princess Haya bint Al Hussein", him]
  - say: >-
      Then came the day that every mother fears. On the nineteenth of September, two thousand and fifteen, the Dubai
      Media Office announced that Sheikh Rashid bin Mohammed, Hind's eldest son, had died of a heart attack. He was
      just thirty-three years old. The whole of Dubai went into mourning. Thousands of people came to offer
      condolences. Sheikh Mohammed, the ruler who had faced every challenge in public, now had to bury his firstborn
      son. Hamdan wrote that he had lost his best friend and the companion of his childhood. But behind the palace
      walls was a mother whose grief the world never saw. Sheikha Hind had carried him, raised him and watched him
      grow into a champion horseman. No official photo, no interview and no public statement from her was ever
      released. Her sorrow, like the rest of her life, stayed private. Those close to the family say her faith and
      her other children carried her through.
    show: ["him:condolence|mourning", "cat:Mohammed bin Rashid Al Maktoum", him]
  - say: >-
      And then, slowly, life returned to the family. In two thousand and nineteen, three of her sons, Hamdan, Maktoum
      and Ahmed, celebrated their weddings together in one magnificent evening. In two thousand and twenty-one,
      Hamdan became a father to twins and gave his son a name that must have meant everything to his mother: Rashid,
      the name of the son she had lost. More grandchildren followed. And in March two thousand and twenty-five,
      Hamdan welcomed a baby daughter and named her Hind, after his mother. For the most private woman in Dubai, it
      was the most public tribute her son could give. Today Sheikha Hind is a grandmother many times over. She is
      known in Dubai for her charity work and her support for women and families, always quietly, always without
      cameras. The few people who have met her describe a gentle, warm and deeply religious woman, the calm centre of
      a family that the whole world watches.
    show: ["him:wedding|celebrat|Eid", "him:children|family", "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      Why does she stay hidden? For Sheikha Hind, privacy is not a mystery and not a sadness. It is dignity. In her
      tradition, a woman's honour is protected, not displayed. And when you look at her son today, you can see her
      influence everywhere. Prince Hamdan shares his horses and his adventures with millions of people, but he has
      never shown his wife's face, and he speaks about his family with a respect that comes straight from the way he
      was raised. The ruler of Dubai built a city of glass and gold that the whole world can see. But the woman
      beside him for more than forty years chose to remain unseen. Perhaps that is the greatest strength of all. What
      do you think about Sheikha Hind's choice? Write it in the comments. And if this story touched you, like the
      video and subscribe to The Luxury Lane for more true stories about Prince Hamdan and his family. See you next
      time.
    show: [him, "cat:Zabeel Palace", "him:poetry|Dubai"]
