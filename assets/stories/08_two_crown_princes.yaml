id: two-crown-princes
title: 'Fazza vs Khaled: The Two Crown Princes Born in 1982 Who Will Run the UAE'
thumbnail:
  text: FAZZA VS KHALED
  tag: WHO WINS?
  inset: cat:Khaled bin Mohamed bin Zayed Al Nahyan
mood: epic
footage: Khaled bin Mohamed|Mohamed bin Zayed|Abu Dhabi
description: 'One was born in Abu Dhabi in January 1982, the other in Dubai ten months later. One is heir to a family
  Bloomberg calls the second-richest in the world, the other to the city that amazed the world. Prince Hamdan (Fazza)
  and Sheikh Khaled bin Mohamed bin Zayed: their lives, their power, their viral moments in India, and the future of
  the UAE.'
