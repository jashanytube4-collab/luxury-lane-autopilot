sections:
- say: He was supposed to be king. The firstborn son of the ruler of Dubai, a champion horseman, loved by the people.
    Then, one day in two thousand and eight, the crown went to his younger brother instead. No explanation. And seven
    years later, he was dead at thirty-three. The official statement said a heart attack. But the rumours started that
    same day, and they have never stopped. This is the story of Sheikh Rashid bin Mohammed, the older brother of Prince
    Hamdan. Why was he passed over? What did people whisper about his death? And what did Fazza do years later that made
    the whole of Dubai cry? Stay until the end. Like and subscribe, and let's begin.
  show:
  - cat:Endurance riding
  - cat:Mohammed bin Rashid Al Maktoum
  - him
- say: 'Sheikh Rashid bin Mohammed bin Rashid Al Maktoum was born in November nineteen eighty-one, the first son of Sheikh
    Mohammed and his senior wife, Sheikha Hind. He carried a name heavy with history: Rashid, after his grandfather,
    Sheikh Rashid bin Saeed, the legendary ruler who turned Dubai from a fishing town into a modern city. One year later,
    his brother Hamdan was born. The two boys grew up like twins: the same teachers, the same horses, the same dreams.
    In the Al Maktoum family, the eldest son is watched closely from the very beginning. For years, almost everyone in
    Dubai assumed that one day Rashid would rule.'
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Dubai Creek
  - cat:Mohammed bin Rashid Al Maktoum
- say: To understand the weight of the name Rashid, you have to go back to the grandfather. Sheikh Rashid bin Saeed ruled
    Dubai from nineteen fifty-eight until nineteen ninety. When he came to power, Dubai had no paved roads, no airport
    worth the name and no running water in most homes. He borrowed money to dredge the creek so that bigger ships could
    enter. He built bridges, a port and a hospital. When oil was discovered in nineteen sixty-six, he used the money
    not to build palaces, but to build infrastructure, betting that one day trade, not oil, would make Dubai rich. In
    nineteen seventy-one, he stood beside Sheikh Zayed of Abu Dhabi to create the United Arab Emirates. In nineteen seventy-nine,
    he opened the Dubai World Trade Centre, then the tallest building in the region, and the giant port of Jebel Ali.
    People called him the father of Dubai. To carry his name was an honour and a burden. Little Rashid, the eldest grandson,
    carried both.
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Dubai World Trade Centre
  - cat:Dubai Creek
  - search:Jebel Ali port
- say: Rashid was a born competitor. Like his father, he fell in love with endurance riding, the brutal sport of racing
    horses for up to one hundred and sixty kilometres through the desert in a single day. And he was brilliant at it.
    In two thousand and six, he rode for the UAE at the Asian Games in Doha and came home with gold. He owned racehorses
    that competed around the world. Friends described him as passionate, generous and fiercely competitive. And next
    to him, very often, rode his little brother Hamdan. They pushed each other, celebrated together and comforted each
    other after losses. It was a bond that would outlast everything.
  show:
  - cat:Endurance riding
  - him:endurance|horse|equestrian
  - cat:Meydan Racecourse
- say: Then came the first of February, two thousand and eight. Sheikh Mohammed, ruler since two thousand and six, issued
    a decree naming his Crown Prince, his heir. The name was not Rashid. It was Hamdan, aged twenty-five. In a family
    where the eldest son is the natural heir, this was a bombshell. The palace gave no reason. Rashid said nothing. And
    into that silence, the rumours rushed in. Over the years, claims spread online about a dark incident inside the palace,
    about personal struggles, about the ruler losing trust in his eldest son. None of these claims was ever confirmed,
    and the family has never answered any of them. What do you think? Should the eldest son always inherit the throne?
    Tell us in the comments.
  show:
  - him
  - cat:Hamdan bin Mohammed Al Maktoum
  - cat:Zabeel Palace
  - cat:Mohammed bin Rashid Al Maktoum
- say: To understand why people still talk about Rashid, look at what the two brothers became. Hamdan was made Chairman
    of the Dubai Executive Council at twenty-three, Crown Prince at twenty-five, and in two thousand and twenty-four,
    Deputy Prime Minister and Minister of Defence of the whole country. He married, became a father and gathered seventeen
    million followers. Rashid, the eldest, lived mostly away from the spotlight. He still rode, still raced his horses
    and still appeared at family occasions, but his name almost disappeared from the news. Two boys raised side by side,
    on two completely different roads. And people always wonder about the road not taken.
  show:
  - him:Executive Council|Crown Prince|defence
  - cat:Endurance riding
  - cat:Hamdan bin Mohammed Al Maktoum
- say: Whatever the reason, the brothers never turned against each other in public. There was no rivalry, no bitter interview,
    no scandal between them. Rashid stepped back into a quieter life of horses, sports and friends, while Hamdan became
    one of the most famous royals on the planet. And then came the nineteenth of September, two thousand and fifteen.
    The Dubai Media Office released a short statement. Sheikh Rashid bin Mohammed had died of a heart attack. He was
    thirty-three years old. Dubai went into mourning, flags flew at half mast, and thousands came to offer condolences.
  show:
  - him:condolence|mourning|funeral
  - cat:Zabeel Palace
  - cat:Mohammed bin Rashid Al Maktoum
- say: 'The funeral prayers for Rashid were held in Dubai, and he was laid to rest in the city his grandfather had built.
    Leaders from across the Emirates and the Gulf came to offer condolences to Sheikh Mohammed, who for once could not
    hide his pain in public. For Dubai''s people, it was a shock: the ruling family had always seemed untouchable. Every
    year since, on the anniversary of his death, fans and friends share his photos online with prayers. Few of them knew
    him personally. But they all know that the Crown Prince of Dubai lost his best friend that day.'
  show:
  - him:condolence|mourning
  - cat:Mohammed bin Rashid Al Maktoum
  - cat:Sheikh Rashid bin Saeed Al Maktoum
- say: 'But the timing made people ask questions. Just two weeks earlier, on the fourth of September, the UAE had suffered
    the deadliest day in its military history, when forty-five Emirati soldiers were killed in Yemen. Within hours of
    Rashid''s death, rumours flew across social media and some foreign websites claiming that he had died in Yemen, not
    at home. Others asked how a young, fit athlete could suffer a fatal heart attack at thirty-three. The official word
    never changed: a heart attack. No evidence for the rumours was ever presented. But because the family never speaks
    about private matters, the questions have never fully gone away.'
  show:
  - search:UAE armed forces
  - him:armed forces|military|martyr
  - cat:Mohammed bin Rashid Al Maktoum
- say: What nobody could doubt was Hamdan's grief. The Crown Prince, who usually shared horses, adventures and poetry,
    wrote that he had lost his best friend and the companion of his childhood. And six years later, in May two thousand
    and twenty-one, he sent a message the whole of Dubai understood. He became a father to twins, and he named his son
    Rashid. Today, little Rashid bin Hamdan is the eldest son of the Crown Prince. If one day he becomes heir, the name
    of the brother who was passed over will once again belong to the future of Dubai.
  show:
  - him
  - him:children|family|Eid
  - cat:Hamdan bin Mohammed Al Maktoum
- say: 'So what really happened to Sheikh Rashid? The official answer is simple: a heart attack at thirty-three. The
    rumours are many, and none was ever proven. What is certain is that two brothers who rode side by side in the desert
    ended up on very different paths, and that one of them still carries the other''s name in his heart and in his son.
    What do you believe? Write it in the comments, we read every one. Like this video and subscribe to The Luxury Lane
    for more untold stories of the Dubai royal family. See you next time.'
