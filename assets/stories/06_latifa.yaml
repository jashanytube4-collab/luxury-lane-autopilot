sections:
- say: It was a night in March, somewhere in the Indian Ocean. A small yacht was racing toward freedom. On board, a princess
    who had planned this moment for seven years. Then the lights appeared. Armed men stormed the boat. She was dragged
    away screaming that she wanted asylum. The princess was Sheikha Latifa, daughter of the ruler of Dubai and half-sister
    of Prince Hamdan. Why would a princess who had everything risk her life to run away? What happened to her after that
    night? And where is she now? Stay until the end, because the story took a twist nobody expected. If you want the
    untold stories of Dubai's royal family, like and subscribe. Let's begin.
  show:
  - search:yacht at night sea
  - cat:Latifa bint Mohammed Al Maktoum (II)
  - cat:Mohammed bin Rashid Al Maktoum
- say: Sheikha Latifa bint Mohammed Al Maktoum was born in nineteen eighty-five. Her father is Sheikh Mohammed bin Rashid,
    ruler of Dubai. Her mother, according to reports, is an Algerian-born woman, one of the ruler's wives. That makes
    her Fazza's half-sister. Latifa grew up in the palaces of Dubai, surrounded by luxury. She loved skydiving, horses
    and the sea, and trained in the martial art of capoeira. But according to her own words, she did not feel free. She
    later said she had tried to escape once before, as a teenager, in two thousand and two, and was caught and brought
    back. And she was not the only daughter with a story like this. Her older sister, Sheikha Shamsa, had disappeared
    from the streets of Cambridge in England back in the year two thousand.
  show:
  - cat:Latifa bint Mohammed Al Maktoum (II)
  - cat:Zabeel Palace
  - search:Cambridge England street
- say: To understand Latifa's fear, you need to know what happened to her older sister, Shamsa. In the summer of the
    year two thousand, nineteen-year-old Sheikha Shamsa ran away from the family's huge estate in Surrey, in England.
    For weeks she hid, until she was found on the streets of Cambridge, pushed into a car and flown back to Dubai. British
    police opened an investigation, but it went nowhere. Shamsa has rarely been seen in public since. Two decades later,
    a London judge concluded, on the balance of probabilities, that her father had ordered her abduction, which Sheikh
    Mohammed denied. For Latifa, her sister's fate was a warning. If she ever ran, she would have to make sure she was
    never found.
  show:
  - search:Cambridge England street
  - search:Surrey countryside
  - cat:Royal Courts of Justice
- say: For years, Latifa prepared in secret. She befriended a Finnish fitness and capoeira instructor named Tiina Jauhiainen,
    and contacted a former French naval officer, Hervé Jaubert, who had once escaped Dubai himself. In February two thousand
    and eighteen, the plan went into action. Latifa slipped out, crossed into Oman, and took a small boat out to sea
    to meet a yacht called Nostromo, waiting in international waters. Before she left, she recorded a video. If you are
    watching this video, she said, it is not such a good thing. Either I am dead, or I am in a very, very bad situation.
    For about eight days, the yacht sailed across the Arabian Sea toward India, and toward what she hoped would be a
    new life.
  show:
  - search:yacht sailing ocean
  - search:Oman coast
  - search:Arabian Sea
- say: In the video she recorded before her escape, Latifa explained why she was running. She said she had not been allowed
    to drive or to travel outside Dubai for years. She said that after her first escape attempt as a teenager she had
    been locked up for a long time. She talked about wanting to choose her own life, her own friends, her own future.
    Her family has never accepted her version of events and says she was always loved and cared for. But that video,
    filmed by a nervous young woman in a small room, became one of the most watched royal videos in the world, viewed
    millions of times in many languages.
  show:
  - cat:Latifa bint Mohammed Al Maktoum (II)
  - search:smartphone video
  - cat:Zabeel Palace
- say: On the night of the fourth of March, two thousand and eighteen, off the coast of Goa in India, it ended. Armed
    commandos boarded the Nostromo. According to Tiina Jauhiainen and Hervé Jaubert, Latifa was dragged away screaming
    that she wanted political asylum. She was taken back to Dubai. The family said the princess had been brought home
    safely to her family. Her friends said she had been captured. Here is our question for you. If you were born into
    one of the richest families on Earth, would you trade it all for freedom? Tell us in the comments.
  show:
  - search:Goa coast
  - search:Indian Ocean
  - cat:Latifa bint Mohammed Al Maktoum (II)
- say: In December two thousand and eighteen, Dubai released photos of Latifa having lunch with Mary Robinson, a former
    President of Ireland and former United Nations human rights chief, to show that she was safe. Robinson described
    her as a troubled young woman. Later, Robinson said she had been horribly tricked. Then, in February two thousand
    and twenty-one, the BBC broadcast secret videos that Latifa had recorded in a bathroom on a smuggled phone. I am
    a hostage, she said, and this villa has been converted into a jail. The world was shocked. The United Nations asked
    the UAE for proof that she was alive. Britain's foreign secretary called the videos distressing. The ruler of Dubai's
    family insisted she was being cared for at home.
  show:
  - search:BBC Broadcasting House
  - cat:Latifa bint Mohammed Al Maktoum (II)
  - search:United Nations Geneva
- say: There was more. In two thousand and twenty, a High Court judge in London, hearing the custody case brought by
    Princess Haya, found on the balance of probabilities that Sheikh Mohammed had ordered the abduction of both Latifa
    and her sister Shamsa. Sheikh Mohammed denied this and said the court had heard only one side. Then the story took
    a turn. In the spring and summer of two thousand and twenty-one, photos appeared on social media of Latifa in Dubai
    Mall, at Madrid airport and on holiday in Iceland. In a statement through lawyers, she said she was free to travel.
    In two thousand and twenty-two, the UN human rights chief, Michelle Bachelet, met her in Paris and said Latifa told
    her she was well and wanted her privacy respected.
  show:
  - cat:Royal Courts of Justice
  - search:Iceland landscape
  - search:Paris
  - cat:Mohammed bin Rashid Al Maktoum
- say: And what about Fazza? Through all of it, the Crown Prince of Dubai never said a single word in public about his
    half-sister. No post, no interview, no statement. While newspapers printed her videos, Hamdan carried on with his
    work, his horses and his duties, standing loyally beside his father. In the Gulf, family matters stay inside the
    family, and a son does not question his father in public. For many of Fazza's fans, Latifa's story was the first
    time they saw the darker side of a family they only knew from beautiful Instagram photos.
  show:
  - him
  - him:Mohammed bin Rashid
  - cat:Hamdan bin Mohammed Al Maktoum
- say: Outside Dubai, Latifa's friends refused to give up. Tiina Jauhiainen, who had been on the yacht with her, and
    a British lawyer named David Haigh, who had himself once been imprisoned in Dubai, started a campaign called Free
    Latifa. They held press conferences, spoke to the United Nations and kept her name in the news for years. It was
    their contacts that eventually brought the secret bathroom videos to the BBC. To the campaign, Latifa was a prisoner
    fighting for her freedom. To the royal family, it was a private matter being turned into a media war. The truth,
    as always with this family, stayed hidden behind palace walls.
  show:
  - search:press conference
  - search:United Nations Geneva
  - cat:Latifa bint Mohammed Al Maktoum (II)
- say: So what is the truth about Princess Latifa? A rebel princess who tried to escape a golden cage, a daughter brought
    home by a worried family, or both? Today she appears to travel and live quietly, away from the cameras, and says
    she wants privacy. But the image of a princess on a yacht in the night, running toward freedom, will never be forgotten.
    What do you think really happened? Write it in the comments, we read every one. Like this video, subscribe to The
    Luxury Lane for more untold royal stories, and see you next time.
