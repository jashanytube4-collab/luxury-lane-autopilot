sections:
- say: Two princes, born in the same year, ten months apart. Two crown princes of the two most powerful emirates in the
    United Arab Emirates. One is the heir to a family that Bloomberg ranks as the second-richest on the planet. The other
    is the heir to the city that made the whole world say wow. One went viral in India for thanking a driver. The other
    went viral for visiting a wounded Indian pilot. This is Fazza versus Khaled. Who are they really? How different are
    their lives? And which of them will be the most powerful man in the UAE one day? Stay until the end, because the
    answer to that last question surprises most people. Like and subscribe, and let's begin.
  show:
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
  - him
  - him:Khaled bin Mohamed
- say: Sheikh Khaled bin Mohamed bin Zayed Al Nahyan was born in Abu Dhabi on the eighth of January, nineteen eighty-two.
    He is the eldest son of Sheikh Mohamed bin Zayed, the President of the United Arab Emirates, and the grandson of
    Sheikh Zayed, the founding father of the country. Prince Hamdan bin Mohammed Al Maktoum was born in Dubai on the
    fourteenth of November, nineteen eighty-two, the second son of Sheikh Mohammed bin Rashid, ruler of Dubai, Vice President
    and Prime Minister of the UAE. So both men are sons of the two most powerful leaders in the country. Both were born
    in the same year. And both were raised from childhood to one day inherit enormous power.
  show:
  - cat:Abu Dhabi
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
  - cat:Mohammed bin Rashid Al Maktoum
  - him
- say: 'Their education already shows how different they are. Khaled studied international relations at the American
    University of Sharjah, and later earned a PhD in war studies from King''s College London. He is the scholar and the
    security man. In two thousand and sixteen he became head of the UAE''s national security, a role that kept him mostly
    out of the public eye. Hamdan went to the Royal Military Academy Sandhurst and the London School of Economics, and
    then threw himself into horses, poetry, adventure and Instagram. Khaled is known for working in the background. Fazza
    is known for being followed by more than seventeen million people. Which style do you prefer: the quiet strategist
    or the people''s prince? Tell us in the comments.'
  show:
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
  - search:King's College London
  - him:horse|endurance|poetry
  - him
- say: Now the power. Hamdan was named Crown Prince of Dubai in two thousand and eight, at only twenty-five. He has run
    Dubai's Executive Council for twenty years, and since two thousand and twenty-four he has also been the UAE's Deputy
    Prime Minister and Minister of Defence. Khaled became Crown Prince of Abu Dhabi much later, on the twenty-ninth of
    March, two thousand and twenty-three, by decree of his father. He now chairs Abu Dhabi's Executive Council and the
    board of ADNOC, the national oil giant. And here is the key point many people miss. In the UAE, the President has
    traditionally come from Abu Dhabi. That is why many observers describe Khaled as the most likely future President
    of the whole country, while Fazza is set to rule Dubai.
  show:
  - him:defence|Minister|armed forces
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
  - cat:Abu Dhabi
- say: To understand why their roles are different, you need to know how the UAE works. When the country was founded
    on the second of December, nineteen seventy-one, seven emirates joined together. Abu Dhabi, the largest and richest
    in oil, and Dubai, the great trading city, became the two pillars of the federation. By long tradition, the President
    has come from Abu Dhabi's Al Nahyan family, and the Vice President and Prime Minister from Dubai's Al Maktoum family.
    Sheikh Zayed and Sheikh Rashid, the two founding fathers, built that balance together. Today their grandsons, Khaled
    and Hamdan, are the next generation of the same partnership.
  show:
  - cat:Abu Dhabi
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Dubai Creek
- say: 'And then there is the money. Bloomberg''s ranking of the world''s richest families places the Al Nahyan family
    of Abu Dhabi second on the planet, with an estimated fortune of more than three hundred and thirty billion dollars,
    built on oil, sovereign wealth funds and investments across the globe. Members of the family own businesses and assets
    from banks to football clubs: Khaled''s uncle, Sheikh Mansour, owns Manchester City. Dubai''s ruling family does
    not appear near the top of that ranking, partly because much of Dubai''s wealth sits in state companies like Emirates
    airline, DP World and Dubai Holding rather than in private family fortunes. But nobody would call the Al Maktoums
    poor: palaces, superyachts and the Godolphin racing empire tell their own story.'
  show:
  - cat:Abu Dhabi
  - cat:Mansour bin Zayed Al Nahyan
  - search:Etihad Stadium Manchester
  - cat:Emirates (airline)
- say: Both princes have also won the hearts of India. In April two thousand and twenty-five, Fazza made his first official
    visit to India, met Prime Minister Modi, ate at a hidden restaurant in Mumbai, met Team India's cricket stars and
    posted a caption in Hindi. In October two thousand and twenty-six, he visited Captain Smit Machchhar, the Indian
    flydubai pilot who survived an axe attack in the cockpit, and called him part of our team. Khaled went viral in September
    two thousand and twenty-six. After the BRICS summit in New Delhi, as he walked to his plane, he turned back to shake
    hands with the Indian chauffeur who had driven him. The clip spread across India in hours, watched by millions.
  show:
  - him
  - him:India|Modi|Mumbai|pilot
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
  - search:New Delhi airport
- say: 'There is one more thing they have in common: privacy. Fazza married Sheikha Shaikha bint Saeed bin Thani Al Maktoum
    in two thousand and nineteen and now has four children, but the world has never seen his wife''s face. Khaled is
    just as protective of his family life, which rarely appears in the news. In their public lives, both princes are
    everywhere: summits, ministries, military parades. At home, both keep the doors firmly closed. In Gulf royal tradition,
    that is not secrecy. It is respect. And it is one of the reasons fans find them so fascinating.'
  show:
  - him:family|Eid|children
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
  - cat:Zabeel Palace
- say: So are they rivals? Fans love to compare them, but the reality is closer to a partnership. The official news shows
    them together again and again. In November two thousand and twenty-five, they watched the aerial displays at the
    Dubai Airshow side by side and toured Abu Dhabi's new Natural History Museum together. In June two thousand and twenty-five,
    they even walked into a restaurant in Dubai Mall for lunch, and diners were told Fazza had paid everyone's bill.
    Two men of the same age, from two very different families, who will one day be the two most powerful leaders in the
    country. Their friendship matters for the whole Gulf.
  show:
  - him:Khaled bin Mohamed
  - search:Dubai Airshow
  - search:Dubai Mall
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
- say: Here is the surprising answer to our question. Who will be more powerful? On paper, Khaled is the likely future
    President of the UAE, the head of the whole federation. But Fazza already holds national power right now as Deputy
    Prime Minister and Minister of Defence, and he is the face of the most famous city in the Middle East. One is likely
    to lead the country. The other is likely to lead the city the world dreams about. Different strengths, same generation,
    and a future the whole region is watching. Imagine the two of them twenty years from now, one leading the federation
    from Abu Dhabi, the other leading Dubai, both born in the same year and raised by fathers who built the country together.
    It would be the most powerful partnership in the history of the Emirates, and possibly the most closely watched pair
    of leaders in the entire Middle East.
  show:
  - him
  - cat:Burj Khalifa
  - cat:Abu Dhabi
  - cat:Khaled bin Mohamed bin Zayed Al Nahyan
- say: So, Fazza or Khaled? The poet horseman of Dubai or the quiet strategist of Abu Dhabi? Write your choice in the
    comments, and tell us why. We read every single comment. If you enjoyed this comparison, like the video and subscribe
    to The Luxury Lane for more stories about Prince Hamdan and the royal families of the Gulf. See you in the next story.
