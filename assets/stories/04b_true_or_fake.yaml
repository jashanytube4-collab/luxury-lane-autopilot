sections:
- say: 'Every week, new stories about Prince Hamdan go viral. A secret second wife. A jump from the tallest building
    in the world. A Bollywood friendship. A princess who saved India''s cricket trophy. Millions of people share them.
    But how many are actually true? Today we put nine of the most viral rumours about Fazza and the Dubai royal family
    to the test. Some are completely fake. Some are so real you will not believe it. Before each answer, pause and guess
    for yourself: true or fake? Write your score in the comments at the end. And if you love royal gossip, hit like and
    subscribe. Let''s begin.'
  show:
  - him
  - cat:Hamdan bin Mohammed Al Maktoum
- say: 'Rumour number one. Fazza secretly married a second wife called Hadiya Zen. The videos are everywhere: wedding
    photos, emotional captions, even stories of a jealous first wife and a family crisis. Millions have watched them.
    The verdict? Fake. There is no official announcement, no royal record and no credible report of a second marriage.
    Some users even claim the photos show a completely different woman, a model whose pictures were taken and reused
    under a new name. The only marriage of Prince Hamdan ever announced is his marriage to Sheikha Shaikha bint Saeed
    bin Thani Al Maktoum in two thousand and nineteen, and the world has never even seen her face. So the wedding photos
    you saw? They are not her.'
  show:
  - him:wedding|celebrat
  - cat:Dubai World Trade Centre
  - him
- say: 'Rumour number two. Fazza stopped using his car because a bird built a nest on it. It sounds like a fairy tale.
    The verdict? True. In August two thousand and twenty, Prince Hamdan noticed a bird sitting on her eggs in a small
    nest at the base of the windscreen of his Mercedes G-Class. Instead of moving it, he parked the car, surrounded it
    with red and white barriers so nobody would disturb her, and simply stopped driving it. He shared videos on Instagram,
    and when the eggs finally hatched, he posted the chicks with the words: sometimes the little things in life are more
    than enough. Did you know this one was real? Tell us in the comments.'
  show:
  - search:Mercedes G-Class
  - search:bird nest eggs
  - him
- say: 'Rumour number three. Fazza jumped off the Burj Khalifa. You have probably seen the headlines: the Crown Prince
    of Dubai parachuted from the tallest building on Earth. The verdict? Fake, but with a twist. Fazza really has been
    to the very top of the Burj Khalifa: in two thousand and thirteen he climbed to the tip of the spire to wave the
    UAE flag, and later shared photos from up there. And in February two thousand and twenty-five he shared a spectacular
    video of thirty-one extreme athletes base jumping from the tower during an event called EXIT one-three-nine. Some
    websites then wrote that the prince himself had jumped. He did not. The jumpers were professional athletes.'
  show:
  - cat:Burj Khalifa
  - search:base jump
  - him:Burj|skydiv
- say: Rumour number four. You can win the Sheikh Hamdan lottery. Messages on WhatsApp say you have won millions from
    the Sheikh Hamdan Foundation, with a certificate and a photo of the prince, and you only need to pay a small fee
    to release your prize. The verdict? Completely fake, and dangerous. There is no Sheikh Hamdan lottery. Scammers mix
    the Crown Prince's name and photos with the name of a real foundation that carries the name of his late uncle, Sheikh
    Hamdan bin Rashid, which supports medicine and education and runs no lottery at all. If anyone asks you for money
    to receive a prize, it is a scam. Please share this part with your family.
  show:
  - him
  - cat:Sheikh Hamdan bin Rashid Al Maktoum
  - search:smartphone WhatsApp
- say: Rumour number five. Fazza and Cristiano Ronaldo are friends. The verdict? True. The two have met several times
    in Dubai. Around New Year two thousand and nineteen, when Ronaldo was in Dubai for the Globe Soccer Awards, Fazza
    posted a photo with him, and Ronaldo shared his own picture with the Crown Prince giving a thumbs up. The photo reportedly
    collected more than one hundred and seventy thousand likes in a single hour. In January two thousand and twenty-two,
    Ronaldo met both Sheikh Mohammed and Fazza in Dubai, and Fazza showed him around the city. Two of the most followed
    men on Instagram, side by side.
  show:
  - cat:Cristiano Ronaldo
  - cat:Burj Al Arab
  - him
- say: 'Rumour number six. Fazza is close friends with Salman Khan. Indian fans love this one, and edited photos of the
    two together circulate every year. The verdict? Unproven. What is real is this: when Fazza''s twins were born in
    two thousand and twenty-one, Salman Khan publicly congratulated him on social media, and the actor has filmed several
    of his films in Dubai. But we could not find any confirmed meeting between the two men. Be careful with photos of
    them together: many viral celebrity pictures today are edited or even made with artificial intelligence. Would you
    like to see Fazza and Salman Khan meet for real? Tell us below.'
  show:
  - cat:Salman Khan
  - cat:Burj Khalifa
  - him
- say: Rumour number seven. A Dubai princess handed India the Asia Cup trophy. After India beat Pakistan in the Asia
    Cup final in Dubai in September two thousand and twenty-five, the Indian team refused to receive the trophy from
    the Asian Cricket Council president, Mohsin Naqvi, who is also a Pakistani minister. Viral videos then claimed that
    a princess of Dubai stepped in and presented the trophy to India. The verdict? Fake. No Dubai princess was involved.
    The trophy dispute dragged on for months, and in two thousand and twenty-six India's women's team also refused to
    take their Asia Cup trophy from him. The princess story was simply invented.
  show:
  - search:Dubai International Cricket Stadium
  - search:cricket trophy
  - cat:Burj Khalifa
- say: 'Rumour number eight. Fazza stopped in the street to comfort a crying stranger in London. The verdict? True. A
    clip filmed by his long-time friend Ahmad Jaber Al Harbi, the father of his little best friend Maj, showed the Crown
    Prince comforting an emotional young woman in London. Fazza later reposted it on his own Instagram stories with a
    heart. It is one of many real moments of kindness, from thanking a delivery rider who cleared a road to visiting
    an Indian pilot in hospital. So here is the pattern: the stories about Fazza''s kindness usually turn out to be true,
    while the stories about secret wives and scandals usually turn out to be fake.'
  show:
  - search:London street
  - him
  - him:people|citizens|London
- say: 'Rumour number nine. Fazza keeps lions and tigers in his palace. Countless videos claim the Crown Prince has a
    private zoo behind the walls of his home. The verdict? Partly true, but not confirmed. A vlogger who was invited
    onto royal grounds in Dubai showed big cats, gorillas and monkeys, and reports in international magazines repeated
    the story. Fazza is a famous animal lover who shares falcons, horses, camels and wildlife on his Instagram, and he
    has even released a trapped oryx himself. But the royal family has never officially shown a private zoo, and many
    of the viral lion videos online actually come from other people in the Gulf. So: animal lover, definitely. Lions
    in his own garden? Possible, but unproven.'
  show:
  - cat:White lions
  - him:falcon|horse|camel|animal
  - cat:Zabeel Palace
- say: 'So, how many did you get right? Second wife: fake. Bird nest car: true. Burj Khalifa jump: fake. Sheikh Hamdan
    lottery: fake. Cristiano Ronaldo: true. Salman Khan: unproven. Asia Cup princess: fake. Comforting a stranger in
    London: true. Lions in the palace: unproven. Write your score out of nine in the comments, and tell us which rumour
    we should check next. If you enjoyed this, like the video and subscribe to The Luxury Lane for the real stories behind
    the viral ones. See you next time.'
  show:
  - him
  - cat:Hamdan bin Mohammed Al Maktoum
