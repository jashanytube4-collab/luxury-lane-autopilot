id: inner-circle
title: "Who Are Uncle Saeed and Little Maj? Fazza's Real Inner Circle Revealed"
thumbnail: {text: "WHO ARE THEY?", tag: "FAZZA'S CIRCLE"}
mood: modern
description: >-
  They appear in Prince Hamdan's videos again and again: Uncle Saeed, the royal who gets thrown into the sea on
  fishing trips, and Maj, the little boy Fazza calls his best friend. Who are they really, how are they connected to
  the Crown Prince of Dubai, and what do they reveal about the man behind the title?
tags: [Uncle Saeed, Fazza Uncle Saeed, Sheikh Hamdan Uncle Saeed, Maj, Fazza and Maj, Sheikh Hamdan Maj,
       Mohammed bin Ahmed Jaber Al Harbi, Fazza friends, Prince Hamdan friends, Saeed bin Maktoum bin Juma,
       Fazza fishing, Sheikh Hamdan best friend]
sections:
  - say: >-
      If you follow Prince Hamdan, you know their faces, even if you do not know their names. A smiling older royal who
      laughs at every joke, climbs every obstacle and gets thrown into the sea. And a little boy with a big smile who
      goes fishing with the Crown Prince of Dubai and once surprised the Queen of England. Fans call them Uncle Saeed
      and Maj. Millions search for them every month. But who are they really? Is Uncle Saeed actually his uncle? Why
      does a future ruler call a schoolboy his best friend? And what do these two people reveal about the real Fazza?
      Stay until the end, because the story of Fazza's inner circle tells you more about him than any official
      biography. If you enjoy these stories, like the video and subscribe. Let's begin.
    show: [him, "him:fishing|sea|sport"]
  - say: >-
      Let us start with Uncle Saeed. His full name is Sheikh Saeed bin Maktoum bin Juma Al Maktoum. He is a member of
      the ruling family, and he has served as President of the UAE Padel Tennis Association, one of the fastest
      growing sports in the Emirates. In just a few years, padel courts have appeared on rooftops, in hotels and in
      sports clubs all over Dubai, and the sport now has thousands of players, from schoolchildren to senior officials. Now look closely at his name. Bin Maktoum bin Juma. Prince Hamdan's mother is
      Sheikha Hind bint Maktoum bin Juma. They come from the same branch of the Al Maktoum family. That is why so many
      fans say that Uncle Saeed is not just a nickname, but a real uncle, from his mother's side. The family does not
      publish such details officially, so we cannot show you a family tree from the palace. But one thing is clear
      from every video. Hamdan treats him exactly like family, with deep respect, endless jokes and real affection.
    show: [him, "search:padel tennis", "cat:Zabeel Palace"]
  - say: >-
      Uncle Saeed became famous among fans because he says yes to everything. In June two thousand and seventeen,
      during a Ramadan sports tournament in Dubai, he took on the NAS Night Challenge, a five kilometre obstacle course
      in the desert, at night, with thirteen brutal obstacles, alongside hundreds of much younger athletes. Prince
      Hamdan stood on the sidelines cheering him on. Uncle Saeed completed every single obstacle. In two thousand and
      nineteen, Hamdan organised a surprise for his birthday, filming the moment as he walked him into a building
      where the celebration was waiting. Fans watched Uncle Saeed's face light up. When Uncle Saeed was in hospital,
      a photo of Hamdan visiting him at his bedside went viral, and thousands of fans sent prayers for his recovery.
      Fans have also shared clips of the two test driving cars around Dubai and travelling together abroad.
    show: ["him:sport|challenge|Ramadan|run", "search:obstacle course race", him]
  - say: >-
      And then there are the fishing trips. In March two thousand and twenty-one, Prince Hamdan shared videos of a
      fishing trip off the coast of Dubai with family and friends. One clip became an instant classic. Uncle Saeed,
      fully dressed, being thrown into the sea by the group, while everyone, including the Crown Prince, laughed. Fans
      loved it, because it showed something they rarely see in a royal family. Playfulness. In public, Hamdan is a
      minister, a commander and a crown prince. With Uncle Saeed, he is just a nephew teasing his favourite uncle.
      Many fans say these clips are the reason they started following him. Here is a question for you. Which Uncle
      Saeed moment is your favourite? The birthday surprise, the obstacle course or the fishing trip? Tell us in the
      comments.
    show: ["search:Dubai sea boat fishing", "him:sea|marine|fishing", him]
  - say: >-
      Now let us meet the youngest member of the circle. His name is Mohammed bin Ahmed Jaber Al Harbi, but the whole
      internet knows him as Maj. He is the son of Ahmed Jaber Al Harbi, a long-time friend of Prince Hamdan. Maj grew
      up around the Crown Prince, and the two developed a friendship that fans found irresistible. A little boy and the
      future ruler of Dubai, fishing side by side, laughing on boats, exploring the desert. Maj's own Instagram account,
      run by his parents, has more than half a million followers. And on Maj's page, Fazza has been quoted calling him
      his best friend. For a man who is surrounded by ministers, generals and presidents, choosing a child as his best
      friend says a lot about what he values. Loyalty, simplicity and joy.
    show: [him, "him:children|students|school", "search:desert Dubai"]
  - say: >-
      Maj became famous far beyond Dubai thanks to one unforgettable moment. Around two thousand and fifteen, at an
      event attended by Queen Elizabeth the Second, the little boy reached out and surprised the British monarch with a
      handshake. The photos went viral around the world. A small Emirati boy, completely confident, greeting one of the
      most famous women on the planet. Fans joked that he had better protocol than many diplomats. Over the years,
      fans have watched Maj grow up through the Crown Prince's posts. Fishing trips, horses, desert drives, and even a
      video in which Hamdan appears to teach his little friend how to drive. Today Maj is no longer the tiny boy from
      the first videos, but his friendship with Fazza remains one of the sweetest stories in the royal family.
    show: ["search:Queen Elizabeth II", "him:horse|endurance", him]
  - say: >-
      Why do these two people matter so much to fans? Because they show the side of Prince Hamdan that no official
      photo can capture. Look at the people a man keeps closest, and you will understand him. Hamdan's inner circle is
      not made of celebrities or billionaires. It is an uncle who cheers loudly and laughs at himself, and a boy who
      loves the sea. The Crown Prince of Dubai has palaces, horses and a seat at the table with world leaders. But in
      his free time, he chooses fishing rods, family jokes and old friends. This is also the same man who once phoned
      a delivery rider to thank him for clearing a road, and who visited a wounded pilot in hospital. The pattern is
      always the same. Real people, real moments, real loyalty.
    show: [him, "him:people|citizens|family", "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      Of course, Fazza's closest circle also includes his brothers. The most famous are Sheikh
      Maktoum bin Mohammed and Sheikh Ahmed bin Mohammed, the two brothers who celebrated their weddings on the same
      night as Hamdan, in June two thousand and nineteen. Sheikh Maktoum is today First Deputy Ruler of Dubai and the
      UAE's Deputy Prime Minister and Minister of Finance, one of the most powerful men in the country. Sheikh Ahmed has
      led major sports and knowledge institutions in Dubai. Together with their father, the brothers form the heart of
      Dubai's leadership. But fans notice something special when they appear together. In public they are serious
      and formal. In the rare videos from family celebrations, they laugh, tease each other and dance side by side,
      exactly like brothers anywhere in the world. And then there are the animals. Hamdan's horses and falcons are
      such a big part of his life that many fans count them as members of the inner circle too. He rides at dawn,
      trains his falcons in the desert and shares their photos with as much pride as any family picture.
    show: ["cat:Maktoum bin Mohammed Al Maktoum", "him:horse|endurance|falcon", "cat:Dubai World Trade Centre"]
  - say: >-
      So now you know. Uncle Saeed is Sheikh Saeed bin Maktoum bin Juma, a royal from the same family branch as
      Fazza's mother, and the most fun uncle in Dubai. And Maj is Mohammed bin Ahmed Jaber Al Harbi, the son of a
      loyal friend, and the little best friend of the Crown Prince. Two names that millions search for, and one simple
      lesson: the people closest to Fazza are the ones who make him laugh. Who else from Fazza's circle should we tell
      you about next? Write it in the comments, we read every one. And if you enjoyed this, like the video and
      subscribe to The Luxury Lane for more true stories about Prince Hamdan. See you next time.
    show: [him, "him:fishing|sea|family"]
