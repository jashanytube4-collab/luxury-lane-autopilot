    show:
    - clip:ig-falcon-white-a
  - say: He simply parked the car, and let the video speak. Maybe that is why it travelled so far, because nobody felt told what to think.
    show:
    - clip:ig-falcon-white-b
  - say: And remember, the whole thing played out quietly, one small post at a time, while millions of people watched.
