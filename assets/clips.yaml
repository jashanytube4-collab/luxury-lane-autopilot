# Hand-picked clips of exact moments (the Burj Khalifa climb, the desert rescue, ...), used by stories with
# show tokens like "clip:burj-flag". Run `python -m tools.fetch_clips` on a home computer (YouTube blocks
# GitHub): it cuts each clip, crops away other channels' frames and tickers, and stores it in the private
# footage library as clip-<id>.mp4, where the autopilot picks it up.
#   yt:    YouTube video id of the source        parts: [[from, to], ...] seconds
#   crop:  [x0, y0, x1, y1] as fractions of the frame (optional)
#   credit: shown in the video description
#   match:  regex: any spoken sentence it matches shows this clip (every story, also the automatic ones)
clips:
  burj-flag:
    match: 'Burj Khalifa|spire|tallest building'
    yt: 47RlnicuI4s
    parts: [[0, 15]]
    credit: Sheikh Hamdan's video from the top of the Burj Khalifa (2013), as shared online
