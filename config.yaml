# The Luxury Lane — autopilot settings.
# Everything here is safe to edit; the next scheduled run picks it up.

channel:
  name: The Luxury Lane
  watermark: THE LUXURY LANE        # small brand mark on every video ("" to disable)

# Source: the official website of H.H. Sheikh Hamdan bin Mohammed (hamdan.ae) — videos, photos and articles.
source:
  library_repo: jashanytube4-collab/luxury-lane-library   # private copy of the official videos (YouTube blocks GitHub)
  instagram:                         # Instagram accounts read through Meta's official API (IG_TOKEN secret)
    - {name: faz3, pages: 30}        # his own posts: the personal moments (older posts too, collected over time)
    - {name: dubaimediaoffice, only_hamdan: true, pages: 4}   # official videos, only posts about him
  instagram_per_run: 100             # new videos copied, checked (face) and described (AI) per run;
                                     # new videos are copied into the private library automatically

schedule:
  timezone: Asia/Dubai
  shorts_per_day: 31
  first_post_between: ["06:00", "06:45"]   # first Short of the day lands randomly in this window (local time)
  gap_minutes: [38, 55]                    # random gap between Shorts (30 a day fill the whole 24 hours)
  one_per_hour: false                      # with 30 a day some hours get two; never closer than 38 minutes
  long_between: ["18:00", "20:00"]         # the daily long-form episode goes out in this evening window
  days_ahead: 2                            # keep today + tomorrow scheduled, so a missed run never leaves a gap
  min_lead_minutes: 25                     # never schedule anything sooner than this from "now"
  posts_per_day: 0                         # picture Shorts off: picture posts go to the Posts tab from the yearly pack
  posts_between: ["07:00", "23:30"]

longform:
  chapters: 6                        # events per episode (each becomes a chapter)
  target_minutes: 9.5                # aims for 8-12 minutes
  min_minutes: 8.2
  max_minutes: 13
  voice_rate: "-2%"                  # slightly calmer delivery for documentaries
  held:                              # long videos moved to another day by the owner (no new one is made that day)
    "2026-10-19": {video_id: apj28JczdLs, at: "2026-10-19T18:40:00+04:00",
                   title: "Inside Prince Hamdan's Secret Palace Life — Lions, Supercars and a Fortune Nobody Agrees On"}

short:
  min_seconds: 12                   # every Short is a random length between these (12-17 s)
  max_seconds: 17
  fps: 30
  cooldown_days: 3                   # a story rests this many days between its Shorts (7 ran out of footage at 30/day)
  moment_min_piece: 2.5              # moment Shorts: quick cuts of him from 2.5 s (older Shorts used the long moments)
  moment_max_pieces: 5               # at most 5 cuts per Short (always at least 12 s, only him)
  recycle_after_days: 60             # only if footage runs low: footage whose Shorts are 60+ days old gets a fresh cut
  deep_cut: null                     # null = automatic: when footage runs low (or Instagram fails) long official videos
                                     # give one Short per 45 s of video, from time ranges no Short used yet; false = never
  moment_share: 0.25                 # share of Shorts that are 12-17 s music-only "moments" of him (what the
                                     # most-viewed Fazza Shorts are); the rest are narrated stories

story:                               # long-form story episodes (assets/stories), told like the top royal channels
  voice: en-US-AvaMultilingualNeural # warm female storyteller voice
  voice_rate: "-7%"                  # ~158 words a minute (top royal channels: 140-168)
  kokoro_voice: af_heart             # backup female voice if the online voice is unavailable
  kokoro_speed: 0.95
  commons: false                     # no outside photos (other riders, streets, buildings): only Fazza himself
  cards: false                       # no full-screen text cards over a dark background
  pops: false                        # no pop-up words on screen
  end_card: 0                        # the video ends with the last words (no extra closing screen)
  gate:                              # quality gate: a story below this is NOT made (no repeats, no padding)
    block: false                     # false = the video is still made and the report flags thin footage
    min_clips: 100                   # distinct clips/photos in an 8-minute video (a new picture every ~4 s)
    min_sources: 10                  # different places the footage comes from
    max_source_share: 0.25           # no single source may be more than this share of the video
  ready_only: false                  # every day a long video; every story gets sentence-level clips automatically

news:                                # fresh news about him, scored 0-10 by the reporter (tools/reporter.py)
  extra_long: true                   # a story scoring above min_score gets an EXTRA long video the same day
  min_score: 6
  lead_minutes: 150                  # time for the script + render (about 45-80 minutes) before it goes public

members:                             # members-only content (Fazza Fam)
  shorts_per_week: 8                 # extra moment Shorts uploaded private; the Saturday helper makes them members-only
  weekday: 5                         # 5 = Saturday (Dubai time)

voice:
  engine: edge                       # edge (Microsoft neural, free) — falls back to kokoro automatically
  edge_voice: en-US-AvaMultilingualNeural   # the same warm female storyteller as the long videos
  edge_rate: "+6%"
  kokoro_voice: af_heart             # backup voice: the same female voice as the long videos
  kokoro_speed: 1.05

ai:
  # Open-source vision model that runs on the GitHub machine itself — no account, no key, never billed.
  model_repo: unsloth/Qwen3.5-4B-GGUF
  model_file: Qwen3.5-4B-Q4_K_M.gguf
  mmproj_file: mmproj-F16.gguf
  llama_cpp_version: b11342
  min_score: 6                       # 0-10 fan appeal for Shorts; weaker moments are skipped

music:
  volume_db: -21                     # music bed level when the narrator is silent
  duck_db: -9                        # extra reduction while the narrator speaks

youtube:
  category_id: "24"                  # Entertainment
  privacy: scheduled                 # scheduled (publish at the slot time) | private (for testing)
  base_tags: [Prince Hamdan, Fazza, Sheikh Hamdan, Crown Prince of Dubai, Hamdan bin Mohammed, faz3, Dubai prince,
              Dubai, فزاع, حمدان بن محمد]
  base_hashtags: ["#PrinceHamdan", "#Fazza", "#SheikhHamdan", "#Dubai", "#faz3", "#فزاع"]
