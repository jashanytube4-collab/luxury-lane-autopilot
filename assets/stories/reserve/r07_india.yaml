description: 'Prince Hamdan''s first official visit to India as Crown Prince of Dubai: the guard of honour in New Delhi, the walk through Prime Minister Narendra Modi''s garden, talks with S Jaishankar
  and Rajnath Singh, the opening bell of the Bombay Stock Exchange, a restaurant in Bandra, and the Team India jersey that said Dubai 11. And why he ended the trip with a message in Hindi. Built from Dubai
  Media Office, WAM, Gulf News and Indian news reports, official footage from the Prime Minister of India''s channel and news footage of the visit. Stock footage of India is for atmosphere.'
