id: dreams
title: "A Crying Boy Begged to See Dubai — What Prince Hamdan Did Next Made the World Cry"
thumbnail: {text: "HE MADE IT HAPPEN", tag: "TRUE STORY", scene: "clip:milan-cry-close@1.5"}
mood: elegant
description: >-
  A little boy in Kenya cried because he wanted to go to Dubai "right now". Weeks later, he was standing under the
  Burj Khalifa. The true story of how Prince Hamdan (Fazza) made Milan's dream come true — and six other real moments
  when the Crown Prince of Dubai surprised ordinary people, from a Pakistani delivery rider to an Indian pilot.
tags: [Prince Hamdan kindness, Fazza Kenyan boy, Milan Dubai, Sheikh Hamdan Kenya, Fazza viral, Sheikh Hamdan
       delivery rider, Abdul Ghafoor Talabat, Fazza surprise, Sheikh Hamdan paid bill, Prince Hamdan humble,
       Fazza good deeds, Sheikh Hamdan Milan]
sections:
  - say: >-
      Why did the Crown Prince of Dubai stop everything for a crying little boy he had never met? The boy was in
      Kenya. He wanted to go to Dubai, right now, and he thought Dubai might be a planet. His mother filmed it and
      posted it online. She had no idea the Crown Prince of Dubai was about to watch it.
    show: [him, "cat:Burj Khalifa", "search:Nairobi Kenya"]
  - say: >-
      The boy's name is Milan. His mother, Maria Nyambane, is a content creator in Kenya. One day, she shared a clip of Milan in tears, insisting he had to go to Dubai immediately. She hugged him
      and told him, first, breathe. I know you have big, big feelings. Then she made him a promise. I will work so, so,
      so hard to get money and take you to Dubai. The video was honest, sweet and very relatable, and it spread across
      social media. People in the UAE started commenting and inviting him. And then, one evening, the video appeared somewhere nobody expected: on the
      Instagram story of Prince Hamdan, with a message from the Crown Prince himself. It will make me very happy to see
      you in Dubai, hopefully very soon.
      Think about it from his mother's side. She had promised her son that she would
      work very hard to save for the trip. Overnight, the man whose city her son dreamed about had answered him in
      public, in front of millions of followers. A private family video had become a promise from the Crown Prince of
      Dubai, and the whole internet was waiting to see if he would keep it.
    show: ["search:Kenya family", "search:smartphone video", him]
  - say: >-
      Weeks later, Prince Hamdan shared a new video. Milan and his family were arriving in Dubai. Milan came with his brother Christopher, and what followed looked like a child's dream drawn with crayons. They stood
      at the foot of the Burj Khalifa, the tallest building in the world. They walked through the rainforest of The Green
      Planet, played in the snow at Ski Dubai, and explored IMG Worlds of Adventure. Then Prince Hamdan posted again:
      it was great to see Dubai's young friends, Milan and Christopher from Kenya. And the family said: thank you,
      Sheikh Hamdan. A boy who thought Dubai was
      a planet had landed on it. For millions of people watching, it was a reminder that sometimes the most powerful
      people in the world are still moved by a child's tears. Here is our question. If you could visit one place in
      Dubai, where would you go first? Tell us in the comments.
    show: ["cat:Burj Khalifa", "search:Dubai Fountain", "search:Ski Dubai", "search:IMG Worlds"]
  - say: >-
      Milan was not the first person Fazza surprised. Once, a video went viral in Dubai.
      A food delivery rider stopped his motorbike at a busy junction, picked up two heavy concrete blocks that had
      fallen into the road, carried them away so no one would crash, and rode off without waiting for thanks. Prince
      Hamdan shared the clip with a simple question: an act of goodness in Dubai to be praised. Can someone point me to
      this man? Within hours, the internet found him. His name was Abdul Ghafoor, a delivery rider from Pakistan. The
      Crown Prince phoned him personally. Imagine picking up your phone and hearing: hello, this is Sheikh Hamdan.
      The Crown Prince was abroad at the time, so he promised they would meet as soon as he was back in the UAE. And
      they did. It is an honour to meet
      you, Abdul Ghafoor, Hamdan wrote. You are a real good example to follow.
    show: ["search:delivery motorbike Dubai", "search:Sheikh Zayed Road", him]
  - say: >-
      Around the Special Olympics World Games in Abu Dhabi, another short video
      touched millions. Prince Hamdan walked up quietly behind a visually impaired man and hugged him from behind,
      asking him to guess who it was. The man listened for a second, recognised the Crown Prince by his voice, and
      broke into a huge smile, praying for God to protect him. Another time, diners at a
      restaurant in Dubai Mall had their own surprise. The Crown Prince of Dubai and the Crown Prince of Abu Dhabi
      walked in for lunch, greeted everyone in the room, and when the guests asked for their bills, they were told
      that Sheikh Hamdan had already paid for everyone. One diner said it was an experience she would never forget.
      And in London, he once stopped to take selfies with Dubai residents who recognised him in the street.
    show: ["search:Special Olympics", "search:Dubai Mall", him, "him:people|citizens|determination"]
  - say: >-
      Then came the story that the whole world talked about only weeks ago. An Indian captain named Smit Machchhar was attacked with an axe in the cockpit of a
      flydubai plane by his own co-pilot. Badly wounded, he managed to open the cockpit door so that crew and
      passengers could stop the attack. The plane landed safely and everyone survived. Days later, Prince Hamdan
      visited him in hospital. We are proud that he is part of our team, the Crown Prince said, part of the story of
      our nation and part of what the UAE stands for. An Indian pilot, a Pakistani rider, a Kenyan child, a visually
      impaired man, a room full of strangers in a restaurant. Different countries, different stories, and the same
      man showing up for them.
    show: ["search:flydubai Boeing 737", "him:hospital|visit|pilot", him]
  - say: >-
      Why does Fazza do this? Some people say it is simply good public relations, and it is true that these moments
      make Dubai look wonderful. But look at the details. He phones people himself. He keeps his promises weeks later.
      He shares other people's stories rather than his own. In the culture he grew up in, generosity is a duty of
      leadership, and his very nickname, Fazza, is often explained as the one who comes to help. Whatever the reason,
      the result is real. A delivery rider who will never forget his phone call. A child who will tell his own
      children about the day he saw the Burj Khalifa. A pilot who knows his courage was seen. These are the moments
      that turn a prince into someone people genuinely love.
    show: [him, "cat:Hamdan bin Mohammed Al Maktoum", "him:children|students|people"]
  - say: >-
      Fazza's surprises are not only for strangers who go viral. One year he sent personal messages
      to forty of the UAE's top high school students, congratulating each of them on their results. For a teenager,
      receiving a message from the Crown Prince is something you remember for the rest of your life. He regularly
      shares the achievements of young Emiratis, students who win competitions, athletes who break records, and
      inventors who build something new. And at the start of a new year, he shared a heartfelt video
      of his year, mixing official moments with precious family scenes, and a message that our ambitions are
      limitless. That phrase sums up the way he talks to young people. He does not tell them to be careful. He tells
      them to dream bigger. Maybe that is why a little boy in Kenya, who had never been to Dubai, already felt that it
      was a place where dreams can come true. And maybe that is why so many people around the world feel they know a
      prince they have never met.
    show: ["him:students|school|youth|graduat", "cat:Museum of the Future", him]
  - say: >-
      So, a crying boy in Kenya begged to see Dubai, and the Crown Prince of Dubai made it happen. Which of these
      stories touched you the most? Milan, Abdul Ghafoor, the man who recognised his voice, the paid bills or Captain
      Smit? Write it in the comments, we read every single one. And if you know a story of Fazza's kindness that we
      did not mention, tell us, we might make the next video about it. Like this video and subscribe to The Luxury
      Lane for more true stories about Prince Hamdan. See you next time.
    show: [him, "cat:Burj Khalifa"]
