  - say: So far we have talked about spending. Now for the part that rarely makes the headlines.
    show:
    - clip:ig-iftar-c
    - clip:ig-abra-a
  - say: In twenty twenty two, a delivery rider stopped in traffic to drag concrete blocks off a busy Dubai road.
    show:
    - sb-354338561
    - clip:ig-gwagon-desert-d
