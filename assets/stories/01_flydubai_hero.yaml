id: flydubai-hero
title: "The Pilot Who Saved 170 Lives — Why Prince Hamdan Rushed to His Bedside"
thumbnail: {text: "HE SAVED 170 LIVES", tag: "TRUE STORY", inset: "search:flydubai Boeing 737"}
mood: epic
description: >-
  An axe in the cockpit, a plane plunging thousands of feet, and a wounded Indian captain who found the strength to
  open one door. The true story of flydubai flight FZ1073 and Captain Smit Machchhar — and why Prince Hamdan,
  Crown Prince of Dubai, went to see him in hospital and called him "part of our team". Based on official statements
  and major news reports; the investigation is ongoing.
tags: [flydubai, Smit Machchhar, flydubai pilot, FZ1073, flydubai axe attack, Prince Hamdan pilot, Sheikh Hamdan
       flydubai, Fazza news, Indian pilot hero, flydubai Tel Aviv, Sheikh Hamdan hospital visit, Fazza 2026]
sections:
  - say: >-
      It was a normal morning flight out of Dubai. More than one hundred and seventy people on board. Then, high above
      the desert, the door of the cockpit became the front line of a nightmare. An axe. A wounded captain. A plane
      dropping thousands of feet. And one man, bleeding, who used the last of his strength to do one thing that saved
      everyone on board. Days later, the Crown Prince of Dubai walked into his hospital room. What really happened on
      flydubai flight FZ one zero seven three? Who is the captain the whole world is calling a hero? And what did
      Prince Hamdan say to him? Stay until the end, because his words moved millions. And if you want stories like
      this, like the video and subscribe. Let's begin.
    show: ["search:flydubai Boeing 737", him, "search:Dubai International Airport"]
  - say: >-
      On Wednesday, the thirtieth of September, two thousand and twenty-six, flydubai flight FZ one zero seven three
      left Dubai for Tel Aviv. The aircraft was a Boeing seven three seven MAX. In the cockpit were two pilots. The
      captain was Smit Machchhar, an Indian pilot who had grown up in Mumbai. At nineteen, he was studying management
      to help with his family's textile business when he caught what he called the aviation bug. His father paid for
      his training. His mother, he later admitted, was scared. He trained in New Zealand, flew for about ten years
      with the Indian airline SpiceJet, and joined flydubai in two thousand and twenty-two. By that morning he had
      almost ten thousand flying hours. Beside him sat his co-pilot, the first officer. Nobody on board had any idea
      what that man was about to do.
    show: ["search:flydubai aircraft", "search:Boeing 737 MAX cockpit", "search:Mumbai skyline"]
  - say: >-
      Somewhere over the region, the co-pilot reached for the crash axe, a tool kept in every cockpit for emergencies,
      and turned it on the captain. According to the UAE's attorney general, he attacked the captain on the flight
      deck and tried to take control of the aircraft. The captain was struck again and again, with wounds to his head,
      his hands and his neck. The plane began to fall. Passengers later described a terrifying, steep descent. Reports
      say part of the rudder was damaged during the dive. In the cabin, people screamed, prayed and held on to each
      other. In the cockpit, a wounded man had a choice to make. He could not fight the attacker and fly the plane at
      the same time. So he did the one thing that could save everyone. Bleeding heavily, he reached the cockpit door
      and opened it.
    show: ["search:airplane cabin passengers", "search:Boeing 737 MAX", "search:aircraft cockpit door"]
  - say: >-
      That single movement changed everything. Crew members and passengers rushed in. A relief pilot, travelling on
      board, entered the cockpit. Together, a small group overpowered the co-pilot and pulled him away from the
      controls. The relief pilot took over, steadied the aircraft and turned it toward the nearest suitable airport,
      Tabuk, in northwestern Saudi Arabia. The Boeing landed safely. Every passenger survived. The captain was handed
      over to doctors, his injuries serious but, thank God, not fatal. In a video recorded from his hospital bed, he
      said he had been fighting for his life. Within hours, the story was on every news channel in the world. Here
      is our question for you. If you had been on that plane, would you have had the courage to go into that cockpit?
      Tell us in the comments.
    show: ["search:Tabuk airport", "search:airport runway landing", him]
  - say: >-
      Then came the official words. The UAE's attorney general, Hamad Al Shamsi, said the investigation had found that
      the co-pilot attempted to carry out a terrorist act. Investigators began examining physical and digital
      evidence, and security services from several countries joined the inquiry. International news agencies,
      citing sources, reported that the co-pilot was an Omani national who had earlier been barred from flying by
      Oman Air over concerns about radical views, before being hired by flydubai. Officials did not publicly confirm
      his name, and the investigation into how and why this happened is still continuing. The UAE suspended flights
      to Israel. Leaders across the region condemned the attack. And in India, one name was suddenly everywhere.
      Prime Minister Narendra Modi said the captain had shown the world the highest form of courage. India's ambassador
      to the UAE called him a brave son of India. His home state of Gujarat announced an award in his honour.
    show: [him, "search:Abu Dhabi skyline", "search:India flag", "him:Minister|defence"]
  - say: >-
      After treatment in Saudi Arabia, Captain Smit was flown back to the UAE to continue his recovery in Abu Dhabi.
      And on Saturday, the third of October, he had a visitor. Prince Hamdan bin Mohammed, Crown Prince of Dubai,
      Deputy Prime Minister and Minister of Defence of the United Arab Emirates, came to his bedside. Remember, flydubai
      is Dubai's own airline. This was Hamdan's city, Hamdan's airline and, in his eyes, one of Hamdan's people. The
      Crown Prince praised the captain for courage, responsibility and care for human life. Then he said the words that
      travelled around the world. We are proud that he is part of our team, part of the story of our nation, and part
      of what the UAE stands for. A nation of compassion, a nation of peace, and a nation of life. An Indian pilot,
      honoured by the Crown Prince of Dubai as one of their own.
    show: ["him:hospital|visit|pilot|flydubai", him, "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      Why did this moment touch so many people? Because the UAE is home to millions of people from every corner of the
      world, and nearly one in three residents comes from India. Pilots, nurses, engineers, drivers, families who
      build their lives in Dubai. When Prince Hamdan called an Indian captain part of our team, millions of them felt
      seen. It is not the first time Fazza has done something like this. Over the years he has visited wounded
      soldiers in hospital, taken selfies with Dubai residents he met on the streets of London, and stepped out of the protocol to thank ordinary
      people. But this time the
      whole world was watching. Within days, the Indian embassy reported that Captain Smit was making steady progress
      and regaining his health. Messages poured in from passengers, pilots and strangers, many of them simply saying
      thank you. One door, opened by a wounded man, and more than one hundred and seventy families still have their
      loved ones.
    show: ["search:Dubai residents", him, "him:people|citizens|workers"]
  - say: >-
      Why was opening that door so important? After the attacks of September the eleventh,
      two thousand and one, airlines around the world changed their cockpits forever. Cockpit doors became
      reinforced, strong enough to stop bullets and impossible to kick open. They can only be unlocked from inside,
      or by crew using special access codes with a delay. The idea was simple: no one outside should ever be able to
      force their way in. But that same protection creates a terrible danger when the threat is already inside. If one
      pilot turns on the other, the people who could help are locked out. That is exactly what happened on flight FZ
      one zero seven three. The passengers and crew could hear that something was wrong, but they could not get in.
      And the crash axe, the very tool meant to help pilots escape a fire or break through a jammed panel, had become
      a weapon. Reports say a relief pilot noticed something unusual at the cockpit door and was ready to enter. But
      the decisive moment came from the captain himself. Wounded, bleeding and losing strength, he chose to unlock the
      door from the inside rather than keep fighting alone. Aviation experts say that decision probably saved the
      aircraft. Without it, help might have arrived too late.
    show: ["search:aircraft cockpit door", "search:Boeing 737 cockpit", "search:airplane in flight"]
  - say: >-
      Captain Smit Machchhar did not choose to become a hero. He went to work, like he had done for years, and when the
      worst moment came, he thought of his passengers before himself. And Prince Hamdan reminded the world that real
      leadership means showing up for the people who show up for everyone else. What do you think about Captain
      Smit's courage, and about Fazza's visit? Write your message to the captain in the comments, maybe he will read
      it. And if you want more true stories about Prince Hamdan, the moments the cameras do not always show, like this
      video and subscribe to The Luxury Lane. See you in the next story.
    show: [him, "search:flydubai Boeing 737"]
