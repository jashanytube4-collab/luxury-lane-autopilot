description: 'What is Sheikh Hamdan, Crown Prince of Dubai, building under the sea? The Dubai Reef project, part of the Dubai Can campaign: thousands of concrete modules on the sea floor, a planned area
  its organisers put at more than 600 square kilometres, and the day Fazza put on scuba gear and dived to the first modules himself. Plus the hawksbill turtles he released near the Burj Al Arab. Built from
  his own Instagram videos, official announcements and news reports; project figures are labelled as the project''s own. Stock footage of reefs, turtles and the coast is for atmosphere only.'
