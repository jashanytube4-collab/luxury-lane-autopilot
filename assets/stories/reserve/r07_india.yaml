    show:
    - sb-3666285
    - clip:in-flags-trees
- beats:
  - say: His first stop was the home of Prime Minister Narendra Modi. The car pulled up under a white portico.
    show:
    - clip:in-pm-car
    - clip:dmo-dprt-01
    - clip:in-pm-pose
