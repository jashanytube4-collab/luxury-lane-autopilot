  - say: His wife, who, as far as we can find, has never given a single interview.
    show:
    - clip:horse-car
    - sb-348896723
  - say: And four small children, growing up inside one of the most watched families in the Gulf.
    show:
    - him
    - sb-6803751
  - say: Today we follow the women behind Prince Hamdan, using only the public record, with no invented gossip. Every picture of a woman you see here is stock footage, shown for atmosphere only.
    show:
