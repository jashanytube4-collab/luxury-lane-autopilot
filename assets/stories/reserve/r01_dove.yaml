    show:
    - clip:ig-gwagon-desert-b
  - say: And then, one morning, Prince Hamdan posted an eighty second video.
    show:
    - clip:ig-dove-hatch
  - say: The chicks had hatched. Two of them, right there beside the windshield of his black Mercedes.
    show:
    - clip:ig-dove-hatch
  - say: In the video the parents remove the broken pieces of eggshell. They feed the chicks, and they keep them warm.
    show:
    - clip:ig-dove-shell
  - say: The camera stays still, and so does everything around it.
    show:
    - clip:ig-dove-brood
  - say: 'The caption said: Sometimes the little things in life are more than enough.'
    show:
