id: haya
title: "The Princess Who Fled Dubai's Ruler: Prince Hamdan's Stepmother Haya"
thumbnail: {text: "SHE RAN AWAY", tag: "TRUE STORY", inset: "cat:Princess Haya bint Al Hussein"}
mood: epic
description: >-
  A Jordanian princess, an Olympic rider, the glamorous wife of Dubai's ruler — and then, in 2019, she fled to London
  with her two children. The true story of Princess Haya bint Al Hussein, Prince Hamdan's stepmother, from her royal
  childhood to the longest and most expensive royal court battle in British history. Based on public court rulings and
  official statements.
tags: [Princess Haya, Haya bint Hussein, Sheikh Mohammed wife, Princess Haya divorce, Dubai royal family,
       Prince Hamdan stepmother, Fazza family, Sheikh Mohammed divorce, Princess Haya London, Dubai ruler wife,
       royal divorce, Princess Haya story]
sections:
  - say: >-
      She was a real princess, the daughter of a king. She rode horses at the Olympic Games. She married one of the
      richest and most powerful men in the world, the ruler of Dubai, Prince Hamdan's father. For fifteen years she
      lived a life of palaces, racehorses and red carpets. And then, one day in two thousand and nineteen, she was
      gone. Who is Princess Haya? Why did she leave Dubai with her two children? And how did her story end in the
      most expensive royal court case Britain has ever seen? Stay until the end, because this is one of the most
      dramatic royal stories of our time, and every part of it is true. If you like royal stories, like this video
      and subscribe. Let's begin.
    show: ["cat:Princess Haya bint Al Hussein", "cat:Mohammed bin Rashid Al Maktoum", him]
  - say: >-
      Haya bint Al Hussein was born in Amman on the third of May, nineteen seventy-four. Her father was King Hussein
      of Jordan, one of the most respected monarchs in the Arab world. Her mother was Queen Alia. When Haya was just
      two years old, tragedy struck. In nineteen seventy-seven, Queen Alia was killed in a helicopter crash. The little
      princess grew up without her mother, and those who knew her say that loss shaped her forever. Haya was sent to
      school in England, and later studied at Oxford. But her true passion was horses. She became a serious show
      jumper, and in the year two thousand she rode for Jordan at the Olympic Games in Sydney. Years later, she would
      be elected President of the International Equestrian Federation, the world governing body of horse sport. She
      was clever, independent and modern. She was, in every way, a princess of the new century.
    show: ["cat:Princess Haya bint Al Hussein", "search:King Hussein of Jordan", "cat:Endurance riding"]
  - say: >-
      Horses brought her to Dubai. Sheikh Mohammed bin Rashid, then Crown Prince of Dubai, was one of the most
      important figures in world horse racing, the founder of the Godolphin stable and a champion endurance rider. In
      April two thousand and four, Princess Haya married Sheikh Mohammed. She was twenty-nine, he was in his fifties,
      and he already had other wives, including his senior wife, Sheikha Hind, the mother of Prince Hamdan. Haya
      became what the media called his junior wife. But unlike Sheikha Hind, who never appeared in public, Haya was
      everywhere. She stood beside her husband at Royal Ascot, she spoke at international conferences, she worked
      with the United Nations on humanitarian causes. To the outside world, she became the face of a modern Dubai.
      In two thousand and seven, she gave birth to a daughter, Jalila. In two thousand and twelve, a son, Zayed. For
      years, they looked like the perfect royal family.
    show: ["cat:Royal Ascot", "cat:Mohammed bin Rashid Al Maktoum", "cat:Princess Haya bint Al Hussein"]
  - say: >-
      Haya was not just a decoration at her husband's side. She threw herself into humanitarian work. In Dubai she
      led the International Humanitarian City, a huge hub from which aid agencies send food, medicine and shelter to
      disaster zones around the world. In two thousand and seven, the United Nations named her a Messenger of Peace,
      and she campaigned against hunger, travelling to some of the poorest places on Earth. Photographs show her in
      refugee camps, in hospitals and at the World Food Programme, far from the palaces of the Gulf. At the same
      time, she led the world of international horse sport, flying between championships in Europe, America and
      Asia. In Dubai, people admired her energy. Abroad, she was described as a bridge between the Arab world and the
      West. Her brother, King Abdullah the Second, ruled Jordan, and her husband ruled Dubai. Few women anywhere had
      such influence. It seemed that nothing could ever shake her position. But the higher a person climbs, the
      further there is to fall.
    show: ["cat:Princess Haya bint Al Hussein", "search:World Food Programme aid", "cat:Expo 2020"]
  - say: >-
      But behind the image, something was going wrong. In two thousand and eighteen, one of Sheikh Mohammed's
      daughters from another marriage, Sheikha Latifa, tried to escape from Dubai by sea. Her boat was intercepted in
      the Indian Ocean and she was brought back. The story made headlines around the world. Princess Haya, who was
      close to the family, later said in a British court that what she learned during that time changed everything
      for her. In early two thousand and nineteen, without the world knowing, Sheikh Mohammed divorced her under
      Islamic law. And in April two thousand and nineteen, Princess Haya left Dubai. She travelled first to Germany,
      and then to London, taking Jalila and Zayed with her. Soon after, Sheikh Mohammed published a poem online that
      many readers understood as aimed at a wife who had betrayed him. The royal marriage that had looked like a
      fairy tale was over, and a battle was about to begin.
    show: ["cat:Mohammed bin Rashid Al Maktoum", "search:London High Court", "cat:Princess Haya bint Al Hussein"]
  - say: >-
      Sheikh Mohammed went to the High Court in London, asking for the children to be returned to Dubai. Princess
      Haya asked the court to protect them. What followed became one of the longest and most closely watched family
      cases in British legal history. In two thousand and twenty, judgments were published that shocked the world.
      The court found, on the balance of probabilities, that Sheikh Mohammed had ordered the abduction of two of his
      adult daughters, Shamsa in two thousand, and Latifa, and that he had run a campaign of intimidation against
      Haya. In two thousand and twenty-one, another ruling found that her phone and the phones of her lawyers had been
      hacked with powerful spyware on his behalf. Sheikh Mohammed denied the allegations. He said the case only told
      one side of the story, and that as a head of government he could not take part in the fact-finding. Now we
      want to know what you think. Should royal family disputes be settled in public courts? Tell us in the
      comments.
    show: ["search:Royal Courts of Justice London", "cat:Princess Haya bint Al Hussein", him]
  - say: >-
      In December two thousand and twenty-one, the court made its financial ruling. Sheikh Mohammed was ordered to
      provide a settlement worth more than five hundred and fifty million pounds, mostly to pay for the security, the
      homes and the education of Jalila and Zayed for the rest of their childhood. It was reported as the largest
      award of its kind in British history. Princess Haya now lives in Britain with her children, far from the
      palaces of Dubai. She rarely gives interviews. Sheikh Mohammed has continued to rule Dubai and to serve as Prime
      Minister of the United Arab Emirates. And throughout all of it, one man stayed completely silent: Prince
      Hamdan. Haya was his stepmother. Jalila and Zayed are his half-sister and half-brother. Yet the Crown Prince
      has never said a single public word about the case. He kept working, kept riding and kept sharing his life with
      his followers, as if the storm around his father's marriage belonged to another world.
    show: ["cat:Mohammed bin Rashid Al Maktoum", him, "him:Mohammed bin Rashid"]
  - say: >-
      Why the silence? In the Gulf, family matters are kept inside the family. A son does not speak publicly about
      his father's marriages, and the Crown Prince's loyalty to his father has always been total. Hamdan has spent
      his whole adult life at Sheikh Mohammed's side, first as Chairman of the Executive Council, then as Crown
      Prince, and since two thousand and twenty-four as the UAE's Minister of Defence. For Haya, the story is about a
      mother protecting her children. For Dubai, it is a chapter the royal family prefers not to discuss. And for the
      millions who follow Fazza, it is a reminder that even the most glamorous families carry private pain. Two very
      different women, Sheikha Hind, who chose to stay invisible, and Princess Haya, who lived in the spotlight and
      then ran from it. Two wives of the same ruler, two completely different destinies.
    show: [him, "cat:Princess Haya bint Al Hussein", "cat:Zabeel Palace"]
  - say: >-
      So, was Princess Haya's escape an act of courage, or the end of a marriage that could never work? The courts
      have spoken, Sheikh Mohammed has given his denial, and the princess has rebuilt her life in England. Whatever
      you believe, it is one of the most extraordinary royal stories of the twenty-first century. Write your opinion
      in the comments, we read them all. And if you want to know more about the family of Prince Hamdan, his mother,
      his brother and his own private life, like this video and subscribe to The Luxury Lane. See you in the next
      story.
    show: [him, "cat:Mohammed bin Rashid Al Maktoum"]
