    show:
    - clip:ig-gwagon-rain-b
  - say: Fact two. The posts were simple, a short caption and the moment itself.
    show:
    - clip:ig-dove-shell
  - say: Fact three. He had been showing animals on his page long before this one.
    show:
    - clip:ig-camels-car-a
  - say: There are camels that put their heads through his car window to be petted.
    show:
    - clip:ig-camel-window-b
  - say: There are falcons beside him, horses that rest their faces on his shoulder, and a herd of elephants walking beside a dirt road.
    show:
    - clip:ig-elephants-a
  - say: So this was not a one-time act. It matched a pattern that his followers had seen again and again.
