    show:
    - sb-349227386
    - sb-354573172
    - clip:ig-council-room
  - say: And in July twenty twenty four, he was also named the UAE's Deputy Prime Minister and Minister of Defence.
    show:
    - clip:ig-iftar-a
    - sb-354386316
  - say: In July this year alone, he approved eighteen billion dirhams of new projects for Dubai.
    show:
    - sb-351922312
    - sb-354567891
