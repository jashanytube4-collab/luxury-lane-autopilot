    - clip:ig-gwagon-rain-a
  - say: That is not what he did.
    show:
    - him
  - say: He said on Instagram that he would not use his vehicle for some time, so that he would not disturb the bird building a nest on it.
    show:
    - clip:ig-dove-gwagon
  - say: Read that sentence again, because it is the whole story.
    show:
    - him
  - say: 'A man who can have any car in the country said: this one can wait.'
    show:
    - clip:ig-gwagon-desert-a
  - say: And the news reports add a detail that makes it even more striking.
    show:
    - clip:ig-dove-close
