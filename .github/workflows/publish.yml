name: Publish an approved test video

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Test run whose video was approved (its 'test-videos' download)"
        required: true
      story:
        description: "Story id of that video, e.g. real-days"
        required: true
      thumbnail:
        description: "Optional thumbnail file in the repo (else the test run's own)"
        required: false
        default: ""
      minutes:
        description: "Goes public this many minutes after upload, or at an exact time like 2026-10-18T18:40:00+04:00"
        required: false
        default: "15"

concurrency:
  group: luxury-lane-publish          # own lane: it never edits the plan, so it never waits for the autopilot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the approved video
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n test-videos -D work/approved
      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m tools.publish_rendered work/approved "${{ inputs.story }}" "${{ inputs.thumbnail }}" "${{ inputs.minutes }}"
