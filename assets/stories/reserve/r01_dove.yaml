description: A dove built a nest on the Mercedes G-Class of Sheikh Hamdan, Crown Prince of Dubai. He had tape put around the car, left it alone, filmed the chicks hatching and posted the
  story. Built only from his own Instagram posts and news reports from Gulf News, Gulf Today and Esquire Middle East.
