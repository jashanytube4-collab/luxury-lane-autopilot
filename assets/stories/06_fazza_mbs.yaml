id: fazza-mbs
title: 'Fazza vs MBS: The Gulf''s Two Most Famous Crown Princes — Friends or Rivals?'
thumbnail:
  text: FRIENDS OR RIVALS?
  tag: FAZZA VS MBS
  inset: cat:Mohammad bin Salman in 2019
mood: epic
footage: Salman|Saudi
description: 'One is the Crown Prince of Dubai, a poet and horseman followed by millions. The other is the Crown Prince
  of Saudi Arabia, the most powerful young leader in the Arab world, linked by reports to a $450 million painting and
  a $300 million château. Prince Hamdan (Fazza) and Mohammed bin Salman (MBS): their meetings, their money, and the quiet
  race between Dubai and Riyadh.'
