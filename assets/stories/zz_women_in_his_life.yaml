description: His mother has reportedly never had her photograph officially published. His grandmother was called the Mother of Dubai. His wife has never given an
  interview. Who are the women behind Prince Hamdan (Fazza), the Crown Prince of Dubai, what the public record really says about them, what he has said and done for
  women, and the rumour you will see online that nobody has been able to prove. Built only from official announcements and major news reports; anything unconfirmed
  is called a rumour. Stock pictures of people, places and moods are for atmosphere only and do not show the family members mentioned.
