id: flydubai-truth
title: 'The Shocking Truth Behind the flydubai Cockpit Attack — and What Prince Hamdan Did Next'
thumbnail:
  text: SHOCKING TRUTH
  tag: FLYDUBAI PILOT
mood: epic
commons: true
footage: flydubai|pilot|hospital|condolence
description: 'An axe in the cockpit, a plane falling thousands of feet, and a wounded Indian captain who found the
  strength to open one door. The shocking truth about flydubai flight FZ1073, Captain Smit Machchhar — and the moment
  Prince Hamdan, Crown Prince of Dubai, came to his bedside and called him "part of our team". Based on official
  statements and major news reports; the investigation is ongoing.'
