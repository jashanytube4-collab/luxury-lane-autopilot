description: 'Five shocking truths about flydubai flight FZ1073: the danger that came from the seat beside the captain,
  the emergency tool that became a weapon, the door that turned into a trap, what investigators now say, and the
  moment Prince Hamdan, Crown Prince of Dubai, stood at Captain Smit Machchhar''s hospital bed. Based on official
  statements and major news reports; the investigation is ongoing.'
