id: mahra
title: "Fazza's Sister Divorced Her Husband on Instagram — The Sheikha Mahra Story"
thumbnail: {text: "SHE DIVORCED HIM ONLINE", tag: "FAZZA'S SISTER", inset: "cat:Princess Mahra bint Mohammed of Dubai"}
mood: modern
description: >-
  "Dear husband… I hereby declare our divorce." With one Instagram post, Prince Hamdan's half-sister Sheikha Mahra
  shocked the world. Who is the Dubai princess with a Greek mother, a royal wedding, a baby daughter and a perfume
  called "Divorce"? The true story of Sheikha Mahra bint Mohammed, from palace childhood to global headlines.
tags: [Sheikha Mahra, Mahra divorce, Dubai princess divorce, Sheikha Mahra Instagram, Fazza sister,
       Prince Hamdan sister, Sheikh Mohammed daughter, Mahra bint Mohammed, Dubai royal family, Mahra M1 Divorce perfume,
       Sheikha Mahra French Montana, Dubai princess]
sections:
  - say: >-
      It was just a few lines of text on Instagram. Dear husband. As you are occupied with other companions, I hereby
      declare our divorce. I divorce you, I divorce you, and I divorce you. Take care. Your ex-wife. Within hours,
      the post had travelled around the world. Because the woman who wrote it was not an ordinary influencer. She was
      a princess of Dubai, the daughter of the ruler, and the half-sister of Prince Hamdan. Who is Sheikha Mahra? How
      did her royal fairy tale turn into the most talked-about divorce on the internet? And what did she do next that
      shocked people even more? Stay until the end, because this story has more twists than any drama. If you enjoy
      royal stories, like this video and subscribe. Let's begin.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "cat:Mohammed bin Rashid Al Maktoum", him]
  - say: >-
      Sheikha Mahra bint Mohammed bin Rashid Al Maktoum was born in nineteen ninety-four. Her father is Sheikh
      Mohammed bin Rashid, ruler of Dubai and Prime Minister of the United Arab Emirates. Her mother is Zoe
      Grigorakos, a woman of Greek origin, one of Sheikh Mohammed's lesser-known wives. That makes Mahra the
      half-sister of Prince Hamdan, who was born to the ruler's senior wife, Sheikha Hind. Mahra grew up between
      palaces, surrounded by brothers and sisters from different mothers, in one of the largest royal families in the
      world. Unlike many women of her family, she did not stay invisible. She studied international relations at
      university, she spoke about women's empowerment, and she built a large following on social media, sharing
      fashion, travel and her love of horses. Young Emiratis saw her as a new kind of princess, modern, confident and
      very much herself.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "cat:Mohammed bin Rashid Al Maktoum", "cat:Burj Khalifa"]
  - say: >-
      In two thousand and twenty-three, Mahra married Sheikh Mana bin Mohammed bin Rashid bin Mana Al Maktoum, a
      businessman from a branch of the extended ruling family. The wedding was a lavish celebration, and photos of
      the couple shared online looked like a fairy tale, the princess in white, the groom in traditional robes, the
      flowers, the lights, the music. Fans called them a perfect match. A year later, in May two thousand and
      twenty-four, the couple welcomed a baby daughter. Mahra shared her joy with her followers, posting a photo with
      her newborn and a loving caption to her husband. Everything seemed perfect. But just weeks later, fans began to
      notice small things. Pictures of the couple disappeared from their accounts. They stopped following each other.
      People started asking questions in the comments. And then, on the sixteenth of July, two thousand and
      twenty-four, came the post that nobody expected.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "cat:Dubai World Trade Centre", "search:Dubai wedding hall"]
  - say: >-
      I hereby declare our divorce. Those words were a reference to an Islamic form of divorce called talaq, in which
      a husband pronounces the divorce three times. Traditionally, it is the husband who says it. Mahra turned the
      tradition upside down and said it herself, in public, in front of millions of people. The reaction was
      explosive. Newspapers from London to New York to Mumbai reported the story. Some people called her brave, a
      woman refusing to suffer in silence. Others said that a royal divorce should never be announced online.
      Religious scholars debated whether a woman could divorce in that way at all. But one thing was clear. A princess
      of Dubai had just done something no one in her family had ever done before. Here is our question for you.
      Was Mahra right to announce her divorce publicly, or should she have kept it private? Tell us in the comments.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", him, "cat:Zabeel Palace"]
  - say: >-
      If people thought the story was over, they were wrong. A few weeks later, Mahra announced a new product from
      her own brand, Mahra M1. It was a perfume. And its name was Divorce. The bottle was black, the marketing was
      dramatic, and the message was unmistakable. Mahra had taken the most painful moment of her life and turned it
      into a statement of independence. Fans lined up to buy it, and the internet exploded again. Some called it the
      greatest comeback in royal history. Others thought it went too far. Then, in two thousand and twenty-five, came
      another twist. It was reported that Mahra had become engaged to the American rapper French Montana, who had
      been seen with her in Paris, Dubai and Morocco. A princess of Dubai and a hip hop star from New York. The world
      could hardly believe it.
    show: ["cat:Princess Mahra bint Mohammed of Dubai", "search:perfume bottle black", "cat:French Montana"]
  - say: >-
      And what did her family say? Nothing. Sheikh Mohammed made no public comment on his daughter's divorce. Prince
      Hamdan, her half-brother, stayed silent too, as he always does on family matters. In the Al Maktoum family,
      private life stays private, even when one member decides to make hers very public. Some observers believe the
      family quietly accepted Mahra's choices. After all, she had not broken any law, and she had always presented
      herself proudly as the daughter of the ruler of Dubai. Others think the
      silence itself said a lot. Either way, Mahra became a symbol of a changing generation in the Gulf, young royals
      who grew up with smartphones and social media, and who no longer accept that their stories must be told by
      someone else.
    show: ["cat:Mohammed bin Rashid Al Maktoum", him, "cat:Princess Mahra bint Mohammed of Dubai"]
  - say: >-
      There is something else that makes Mahra's story so fascinating. Compare her to the other women of her family.
      Sheikha Hind, Hamdan's mother, has lived for more than forty years almost without being photographed. Hamdan's
      own wife has never shown her face to the public. And then there is Mahra, posting her wedding, her baby, her
      divorce and her new love for millions to see. Three women in one family, three completely different worlds.
      The Dubai of Mahra's generation is a city of influencers, startups and global brands, and Mahra is very much a
      daughter of that new Dubai. Her brother Hamdan, meanwhile, has become one of the most powerful men in the
      country, Crown Prince of Dubai and Minister of Defence of the United Arab Emirates, a man who shares his
      adventures online but keeps his private life completely closed.
    show: [him, "cat:Burj Khalifa", "cat:Museum of the Future", "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      So, is Sheikha Mahra a rebel, or simply a modern woman living her life on her own terms? A royal who broke the
      rules, or a princess who rewrote them? Whatever you think, her story shows that even in the most traditional
      royal families, the world is changing. Write your opinion in the comments, we read every single one. And if you
      want more true stories about Prince Hamdan's family, his mother, his brother and the secrets of the Dubai royal
      palace, like this video and subscribe to The Luxury Lane. See you in the next story.
    show: [him, "cat:Princess Mahra bint Mohammed of Dubai"]
