id: real-days
title: 'The Real Fazza: How the Crown Prince of Dubai Actually Spends His Days'
thumbnail:
  text: HIS REAL LIFE
  tag: BEHIND THE SCENES
mood: elegant
footage: endurance|Fitness|Dubai Ride|Executive Council|condolence|Iftar|graduation|students
description: 'Not the official portraits — the real hours. From endurance races that start in the dark, to the top of the
  Burj Khalifa, to his camels, his falcons and the quiet moments with his children: how Prince Hamdan (Fazza), Crown Prince
  of Dubai, really spends his days, told with real footage of every moment.'
