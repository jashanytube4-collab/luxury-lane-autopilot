id: latifa
title: The Princess Who Tried to Escape Dubai by Sea — The Untold Story of Fazza's Sister Latifa
thumbnail:
  text: SHE TRIED TO ESCAPE
  tag: TRUE STORY
  inset: cat:Latifa bint Mohammed Al Maktoum (II)
mood: epic
footage: Mohammed bin Rashid|father
description: A secret plan, a getaway yacht in the Indian Ocean, commandos at night and smuggled videos saying "I'm a
  hostage". The true story of Sheikha Latifa, daughter of Dubai's ruler and Prince Hamdan's half-sister — from her escape
  attempt in 2018 to her reappearance in Europe. Based on court findings, UN statements and major news reports.
