id: brother
title: "The Brother Who Should Have Been King: What Happened to Fazza's Brother Rashid?"
thumbnail: {text: "HIS BROTHER RASHID", tag: "SAD STORY"}
mood: epic
description: >-
  He was the firstborn son of Dubai's ruler, a champion horseman and the brother Prince Hamdan called his best friend.
  So why was Sheikh Rashid bin Mohammed never named Crown Prince — and what happened on the day Dubai lost him at just
  33? The true story of Fazza's older brother, and the tribute Hamdan still carries with him today.
tags: [Sheikh Rashid bin Mohammed, Prince Hamdan brother, Fazza brother, Rashid bin Mohammed death,
       Dubai crown prince succession, Sheikh Mohammed son, Dubai royal family, Fazza family, Prince Hamdan sad story,
       Sheikh Rashid Al Maktoum, Dubai royal family secrets, Prince Hamdan son Rashid]
sections:
  - say: >-
      For years, everyone in Dubai believed he would be king. He was the eldest son of the ruler, a champion
      horseman, strong, proud and loved by the people. His younger brother looked up to him more than anyone in the
      world. But in two thousand and eight, the crown went to the younger brother instead. And seven years later, the
      eldest son was gone, at just thirty-three years old. This is the story of Sheikh Rashid bin Mohammed, the older
      brother of Prince Hamdan. Why was he never named Crown Prince? What happened on the day Dubai lost him? And how
      does Fazza still honour him today? Stay until the end, because the last part of this story will touch your
      heart. And if you love royal stories, please like and subscribe. Let's begin.
    show: [him, "him:horse|endurance", "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      Sheikh Rashid bin Mohammed bin Rashid Al Maktoum was born in nineteen eighty-one, the first son of Sheikh
      Mohammed bin Rashid and his senior wife, Sheikha Hind. He was named after his grandfather, Sheikh Rashid bin
      Saeed, the legendary ruler who had turned Dubai from a small trading town into a modern city. The name alone
      carried a promise. Just one year later, a second son was born, Hamdan. The two boys grew up almost like twins.
      They shared the same teachers, the same horses and the same dreams. In the Al Maktoum family, sons are raised
      for duty. They learn to ride, to shoot, to sit silently in the majlis while elders discuss the affairs of the
      emirate. Rashid, as the eldest, was watched especially closely. Many people in Dubai assumed that one day he
      would follow his father and lead the city.
    show: ["cat:Sheikh Rashid bin Saeed Al Maktoum", "cat:Mohammed bin Rashid Al Maktoum", "cat:Dubai Creek", him]
  - say: >-
      To understand the weight of the name Rashid, you have to go back to the grandfather. Sheikh Rashid bin Saeed
      ruled Dubai from nineteen fifty-eight until nineteen ninety. When he came to power, Dubai had no paved roads, no
      airport worth the name and no running water in most homes. He borrowed money to dredge the creek so that bigger
      ships could enter. He built bridges, a port and a hospital. When oil was discovered in nineteen sixty-six, he
      used the money not to build palaces, but to build infrastructure, betting that one day trade, not oil, would
      make Dubai rich. In nineteen seventy-one, he stood beside Sheikh Zayed of Abu Dhabi to create the United Arab
      Emirates. In nineteen seventy-nine, he opened the Dubai World Trade Centre, then the tallest building in the
      region, and the giant port of Jebel Ali. People called him the father of Dubai. To carry his name was an honour
      and a burden. Little Rashid, the eldest grandson, carried both.
    show: ["cat:Sheikh Rashid bin Saeed Al Maktoum", "cat:Dubai World Trade Centre", "cat:Dubai Creek",
           "search:Jebel Ali port"]
  - say: >-
      Rashid's great love was horses. Like his father, he became a serious endurance rider, competing in races of up
      to one hundred and sixty kilometres in a single day, through the desert heat. It is one of the toughest sports
      in the world, for horse and for rider. And Rashid was very good at it. In two thousand and six, he rode for the
      United Arab Emirates at the Asian Games in Doha and came home with gold. He also loved horse racing and owned
      racehorses that competed around the world. Friends described him as passionate, generous and fiercely
      competitive. His younger brother Hamdan rode beside him in many of those early races. The two brothers pushed
      each other, celebrated together and, when one of them lost, comforted each other. Those years in the saddle
      created a bond that would last for the rest of their lives.
    show: ["cat:Endurance riding", "him:endurance|horse|equestrian", "cat:Meydan Racecourse"]
  - say: >-
      Then, on the first of February, two thousand and eight, a decree changed the future of Dubai. Sheikh Mohammed,
      who had become ruler two years earlier, named his Crown Prince, his official heir. The name announced was not
      Rashid. It was Hamdan, just twenty-five years old. In many royal families, the eldest son is the natural heir.
      So the decision surprised many people. No official reason was ever given. The palace said nothing, and Rashid
      said nothing. The newspapers of the region simply reported the decree and the celebrations that followed, as
      people lined up to congratulate the new Crown Prince. Years later, leaked diplomatic cables made claims about the reasons, claims the family never
      confirmed and never answered. What is certain is that the brothers did not fall apart. There was no public
      rivalry, no bitter interview, no scandal between them. Rashid stepped back from the spotlight, and Hamdan
      stepped into it. Now we want to hear from you. Do you think the eldest son should always become king, or should
      a ruler choose the one he thinks is best? Tell us in the comments.
    show: [him, "cat:Hamdan bin Mohammed Al Maktoum", "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      In the following years, Hamdan became one of the most famous royals in the world, with millions of followers and
      a packed schedule of government work. Rashid lived a quieter life, focused on his horses, his sports and his
      friends. But the brothers stayed close. Hamdan often spoke of Rashid with deep affection. And then came the
      nineteenth of September, two thousand and fifteen. That morning, the Dubai Media Office released a short,
      devastating statement. Sheikh Rashid bin Mohammed bin Rashid Al Maktoum had died of a heart attack. He was
      thirty-three years old. Dubai was stunned. Flags flew at half mast and the city went into mourning. In the
      confusion of those first days, rumours spread online that he had died somewhere else, in some other way. The
      official word never changed. A heart attack, at thirty-three, in the prime of his life.
    show: ["him:condolence|mourning|funeral", "cat:Zabeel Palace", "cat:Mohammed bin Rashid Al Maktoum"]
  - say: >-
      The funeral prayers were held in Dubai, and thousands came to pay their respects. Sheikh Mohammed, a father who
      had always appeared strong in public, now stood before the world having lost his firstborn son. Leaders from
      across the region came to offer condolences. And then the world saw Hamdan's grief. The Crown Prince, who
      usually shared horses, adventures and poetry with his followers, wrote a message for his brother. He said he had
      lost his best friend and the companion of his childhood, and that Rashid would be missed forever. Fans who had
      followed Fazza for years had never seen him like that. For many of them, it was the first time they truly
      understood how much his older brother had meant to him. The race partner, the childhood companion, the brother
      who had stepped aside without a word, was gone.
    show: ["him:condolence|mourning", him, "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      Six years passed. In May two thousand and twenty-one, Prince Hamdan announced that he had become a father to
      twins, a girl and a boy. The name he chose for his son was the most emotional message he could send. He named
      him Rashid. Across Dubai, people understood immediately. The little boy carries the name of his great
      grandfather, who built modern Dubai, and of the uncle he will never meet, the brother his father loved so much.
      Today, little Rashid bin Hamdan is the eldest son of the Crown Prince of Dubai. One day, people already whisper,
      he may be the one who leads the city. If that happens, the name Rashid will once again belong to the heir of
      Dubai, and in a way, the brother who should have been king will finally have his place in the story.
    show: ["him:children|family|Eid", him, "cat:Sheikh Rashid bin Saeed Al Maktoum"]
  - say: >-
      The story of Sheikh Rashid is a reminder that behind the palaces and the titles, a royal family is still a
      family, with brothers who love each other, decisions that hurt, and losses that never heal. Hamdan became Crown
      Prince, then Deputy Prime Minister and Minister of Defence of the United Arab Emirates. But every time he looks
      at his son, he sees the name of the brother who rode beside him in the desert. Do you think Rashid would have
      been a good ruler? And what do you think about Hamdan naming his son after him? Write your thoughts in the
      comments, we read every one. If this story touched you, like the video and subscribe to The Luxury Lane for
      more true stories about Prince Hamdan and his family. See you next time.
    show: [him, "him:horse|poetry"]
