- beats:
  - say: It began at the airport in New Delhi, where his royal jet rolled slowly to a stop beside a red canopy.
    show:
    - clip:dmo-sseg-00
    - clip:dmo-sseg-08
    - clip:dmo-sseg-01
    sfx: impact
  - say: Next to the red carpet, the flags of both countries waved together.
    show:
    - clip:dmo-sseg-18
    - clip:dmo-sseg-12
  - say: The guard of honour stretched far down the red carpet.
    show:
    - clip:dmo-sseg-14
  - say: Slowly, the Crown Prince of Dubai walked down the stairs of his jet onto Indian soil.
    show:
    - clip:inf-00
    - clip:in-stairs-close
    sfx: whoosh
  - say: At the bottom, an Indian Air Force officer stood ready and shook his hand.
    show:
    - clip:inf-01
    fx: flash
  - say: Then came the minister India had sent to welcome him, Suresh Gopi. A warm handshake.
    show:
    - clip:inf-03
  - say: A whole line of officials was waiting too, and he greeted them one handshake at a time.
    show:
    - clip:inf-15
    sfx: impact
  - say: India had rolled out the long red carpet, quite literally, all the way across the tarmac.
    show:
    - clip:inf-13
  - say: Then, under a red canopy, he took his place on the saluting stand as the national anthems of both countries played.
    show:
    - clip:in-canopy
    - clip:in-salute-stand
  - say: Sailors in white uniforms and white caps stood in perfect rows for the guard of honour.
    show:
    - clip:in-guard-rows
    sfx: whoosh
  - say: He stood to attention, perfectly still and calm, as an officer saluted beside him.
    show:
    - clip:in-salute-close
  - say: Then he walked the whole length of the guard of honour, slowly, past every single soldier.
    show:
    - clip:inf-14
    fx: flash
  - say: An Indian officer walked at his side, step by step.
    show:
    - clip:in-walk-officer
    sfx: impact
  - say: Then the Air Force and the Army marched past in his honour, in perfect step, row after row.
    show:
    - clip:inx-yqpe-01
    - clip:inx-yqpe-02
  - say: An officer checked every soldier in the line. And every soldier stood to attention. Not one of them moved.
    show:
    - clip:inx-yqpe-03
    - clip:inx-yqpe-04
  - say: He walked along the red carpet with the Indian officials, slowly, talking as they went, past the saluting stand and the flags.
    show:
    - clip:inx-yqpe-11
    - clip:inx-yqpe-13
    sfx: whoosh
  - say: Then something lovely happened. Drummers began to play a welcome.
    show:
    - clip:in-drums
