description: '"Baby, I lied about my age." "My queen, just one minute please." Thousands of videos claim to be new love
  poems by Prince Hamdan (Fazza), read in English by a deep voice. But are they really his? How the fake Fazza poem videos
  work, how to spot them, and the truth about the real poetry of the Crown Prince of Dubai.'
