id: true-or-fake
title: '9 Viral Fazza Rumours: TRUE or FAKE? Second Wife, Ronaldo, Burj Khalifa Jump & More'
thumbnail:
  text: TRUE OR FAKE?
  tag: VIRAL RUMOURS
mood: modern
footage: wedding|family|horse|London|Burj|sport|car
description: A secret second wife. A jump off the Burj Khalifa. A friendship with Cristiano Ronaldo. A car abandoned
  for a bird. A Dubai princess and the Asia Cup trophy. We checked nine of the most viral rumours about Prince Hamdan
  (Fazza) and the Dubai royal family — some are completely fake, some are 100% true. Which ones did you believe?
