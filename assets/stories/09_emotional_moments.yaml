sections:
- say: He is a Crown Prince, a Minister of Defence and one of the most powerful young men in the Middle East. In official
    photos he is calm, serious, almost untouchable. But every now and then, a camera catches something else. A moment
    of grief he cannot hide. A stranger in tears he refuses to walk past. A small act of kindness nobody asked him to
    do. Today we bring you the most emotional real moments of Prince Hamdan, the moments that made millions of people
    say, this is why we love Fazza. Stay until the end, because the last one is the most personal of all. Like and subscribe,
    and let's begin.
  show:
  - him
  - him:people|citizens|elder
- say: March two thousand and seventeen. A heavy truck is stuck deep in the soft sand of the Dubai desert. The driver
    has tried everything. Then a black Mercedes G-Class pulls up, and out steps the Crown Prince of Dubai. A video filmed
    that day shows Fazza tying a tow rope from his own car to the truck and trying to pull it free. The first time, the
    rope snaps. He does not give up. He advises the driver to lighten the load, tries again, and this time the truck
    rolls free. The video ends with the driver shaking the prince's hand. Within hours, it had spread across the Emirates.
    A future ruler, covered in desert dust, helping a stranger with his own car.
  show:
  - search:Mercedes G-Class
  - search:Dubai desert dunes
  - search:truck desert
  - him
- say: Another video went viral for a very different reason. Fazza was photographed with a young woman with Down syndrome
    who was crying, overwhelmed with emotion at meeting him. Instead of moving on, he put his arm around her shoulder
    and gently asked her not to cry, staying with her until she smiled. The clip was filmed and shared by his long-time
    friend Ahmad Jaber Al Harbi, and Fazza later reposted it himself. In another moment, at an event for people of determination,
    he quietly walked up behind a visually impaired man and hugged him, asking him to guess who it was. The man recognised
    him by his voice and broke into a huge smile.
  show:
  - him:determination|people
  - search:London street
  - him
- say: 'Then there was the bird. In August two thousand and twenty, Fazza noticed a bird sitting on her eggs in a tiny
    nest on his Mercedes, right at the base of the windscreen. Most people would have moved the nest. He parked the car,
    surrounded it with barriers so nobody would disturb her, and stopped using it. He shared the story with his followers,
    and when the eggs finally hatched, he posted the chicks with a simple sentence: sometimes the little things in life
    are more than enough. Which of these moments touched you the most so far? Tell us in the comments.'
  show:
  - search:bird nest eggs
  - search:Mercedes G-Class
  - him:animal|falcon|horse
- say: Not every emotional moment is a sad one. In November two thousand and thirteen, Dubai won the right to host Expo
    twenty-twenty after a long international campaign, and Fazza had been part of the team that fought for it. Days later,
    he climbed to the very top of the Burj Khalifa, the tallest building on Earth, and waved the UAE flag from the tip
    of the spire. The photos went around the world. It was not a staged speech or a press conference. It was a young
    man so proud of his city that he climbed above the clouds to celebrate it.
  show:
  - cat:Burj Khalifa
  - cat:Expo 2020
  - him:Burj|Expo
- say: Some moments are about respect. A video from two thousand and twenty-one showed Fazza greeting the Ruler of Ajman,
    an elder statesman, with a gesture of deep traditional respect, and the clip won hearts across the Gulf. Fans have
    shared many clips of him greeting older men with the traditional kiss on the forehead, a gesture of honour in Emirati
    culture, and sitting with families at majlis gatherings. In his culture, respect for elders is not politeness. It
    is a duty. And for many young Arabs who follow him, these simple gestures say more about him than any speech.
  show:
  - him:elder|veteran|majlis|condolence
  - cat:Mohammed bin Rashid Al Maktoum
  - him
- say: 'And some moments are about strangers who will never forget him. In July two thousand and twenty-two, he asked
    his followers to help him find a delivery rider who had stopped in heavy traffic to clear concrete blocks from the
    road. When they found him, a Pakistani rider named Abdul Ghafoor, Fazza phoned him personally and later met him.
    In two thousand and twenty-six, he invited a little boy from Kenya, who had cried because he wanted to see Dubai,
    to visit the city. And in October two thousand and twenty-six, he visited Captain Smit Machchhar, the Indian pilot
    wounded in an axe attack on a flydubai flight, and told the world: we are proud that he is part of our team.'
  show:
  - search:delivery motorbike Dubai
  - cat:Burj Khalifa
  - him:hospital|pilot|visit
- say: There is also a moment that shows his playful side, with an old friend. In one of his most watched videos, Fazza
    greets an elderly man, Abdullah Bu Humaid, with a warm hug, and then jokingly lists all the things his old friend
    loves, while everyone around them laughs. Hundreds of thousands of people watched it within hours. Fans loved seeing
    the Crown Prince joking like a grandson with a grandfather. It is the same warmth he shows with his Uncle Saeed on
    fishing trips, and with his little best friend Maj. The people closest to him are not celebrities. They are the people
    who make him laugh.
  show:
  - him
  - him:elder|people|majlis
  - search:Dubai sea boat
- say: His uncle, Sheikh Saeed bin Maktoum bin Juma, known to fans as Uncle Saeed, has been part of some of Fazza's warmest
    videos. In two thousand and nineteen, Fazza organised a surprise for his uncle's birthday, filming the moment he
    walked him into a room where the celebration was waiting. Years earlier, at a night-time desert obstacle race with
    thirteen brutal obstacles, Fazza stood at the side cheering his uncle on as he completed every single one. Moments
    like these explain why fans call him a family man before anything else.
  show:
  - him:sport|challenge|family
  - search:obstacle course race
  - him
- say: 'And now the most personal moment of all. In September two thousand and fifteen, Fazza''s older brother, Sheikh
    Rashid, died suddenly at the age of thirty-three. Fazza wrote that he had lost his best friend and the companion
    of his childhood. Six years later, in two thousand and twenty-one, he did something that surprised his followers.
    He posted a video tribute to Rashid, filled with memories of his brother, a sign that the pain had never left him.
    That same year, he named his newborn son Rashid. For a man who almost never shows his private feelings in public,
    it was the most open his heart has ever been. What makes all these moments special is that most of them were never
    planned. They were filmed on phones by friends, passers-by and the people he helped, not by official cameras. That
    is why they feel so real. In a world where many famous people stage their kindness for social media, the moments
    that made Fazza loved were often shared by others first. And every time one of them goes viral, millions of people
    around the world send the same message in the comments: may God protect him.'
  show:
  - cat:Endurance riding
  - him:condolence|mourning
  - cat:Sheikh Rashid bin Saeed Al Maktoum
- say: A rescued truck, a crying stranger, a bird's nest, a hug for an old friend, a brother he never forgot. These are
    the moments the official photos never show, and they are the reason millions of people around the world feel they
    know a prince they have never met. Which moment made you love Fazza even more? Write it in the comments, we read
    every single one. If this video touched you, like it and subscribe to The Luxury Lane. See you next time.
