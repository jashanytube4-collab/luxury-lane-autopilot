sections:
- say: 'For years, millions of fans asked one question: when will Fazza become a father? Today he has four children.
    But you have probably never seen their faces clearly. In the photos he shares, a little hand, a tiny foot, a child
    seen from behind, a face hidden by an emoji. Why does the Crown Prince of Dubai hide his children? What secret messages
    are hidden in their names? And which of them could one day rule Dubai? Stay until the end, because the name of his
    youngest child is the most emotional of all. If you love Fazza''s family stories, like and subscribe. Let''s begin.'
  show:
  - him
  - him:children|kids|family
  - cat:Hamdan bin Mohammed Al Maktoum
- say: It begins with a wedding. In May two thousand and nineteen, Fazza married Sheikha Shaikha bint Saeed bin Thani
    Al Maktoum, a woman from within the Al Maktoum family. A month later, on the sixth of June, he celebrated together
    with two of his brothers in a magnificent triple royal wedding at the Dubai World Trade Centre. The world's most
    eligible bachelor was finally married. And then, for two years, fans waited for news. Every Instagram post was searched
    for clues. Every rumour was shared. Fazza said nothing, as always. Until the twentieth of May, two thousand and twenty-one.
  show:
  - cat:Dubai World Trade Centre
  - him:wedding|celebrat
  - him
- say: 'That day, Fazza posted a photo that broke the internet. No faces. Just two tiny feet: one wrapped in blue, one
    wrapped in pink. The Crown Prince of Dubai had become the father of twins, a boy and a girl. Within hours, the post
    had millions of likes and congratulations from around the world, from royals to Bollywood stars. Soon after, he shared
    a photo of himself holding both newborns in his arms. And then came one of the most touching pictures of all: his
    father, Sheikh Mohammed, the ruler of Dubai, holding his grandchildren. Three generations of the Al Maktoum family
    in one photo.'
  show:
  - him:children|family
  - cat:Mohammed bin Rashid Al Maktoum
  - him
- say: Then came the names, and every person in Dubai understood their meaning. The boy was named Rashid. That is the
    name of Fazza's grandfather, Sheikh Rashid bin Saeed, the ruler who built modern Dubai. But above all, it is the
    name of Fazza's older brother, Sheikh Rashid bin Mohammed, who died suddenly in two thousand and fifteen at the age
    of thirty-three, the brother Fazza called his best friend and childhood companion. Six years after losing him, Fazza
    gave his name to his firstborn son. The girl was named Shaikha, a name of honour in the family. A brother brought
    back to life in a name. Did you know the meaning of little Rashid's name? Tell us in the comments.
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Endurance riding
  - him
- say: On the twenty-fifth of February, two thousand and twenty-three, a third child arrived, a boy. Fazza named him
    Mohammed, after his own father, the ruler of Dubai. In Gulf tradition, naming a son after his grandfather is one
    of the greatest honours a son can give. Little Mohammed bin Hamdan bin Mohammed carries his grandfather's name in
    full. Fazza celebrated quietly, sharing small moments, never a full portrait. When the twins turned two, he celebrated
    their birthday on Instagram, and again the photos were careful, faces hidden. Fans noticed the pattern. Fazza shares
    the joy, but never the faces.
  show:
  - cat:Mohammed bin Rashid Al Maktoum
  - him:family|Eid|children
  - cat:Zabeel Palace
- say: 'Why? The answer goes back to how he was raised. His own mother, Sheikha Hind, has almost never been photographed
    in more than forty years. His wife has never shown her face to the public. In the Al Maktoum family, the private
    lives of women and children are protected, not hidden in shame but guarded with respect. There is also a modern reason.
    Fazza knows how the internet works. Every photo he posts is copied, edited and shared by millions, and fake stories
    about his family appear every week. By hiding his children''s faces, he gives them something almost impossible for
    a royal child: the chance of a normal childhood.'
  show:
  - him
  - cat:Zabeel Palace
  - him:children|students|school
- say: 'To understand what kind of father Fazza is, look at the father who raised him. Sheikh Mohammed took his sons
    everywhere: to building sites, to the stables at dawn, to the majlis where elders discussed the affairs of the city.
    Fazza learned to ride before he could ride a bicycle, and learned poetry by listening to his father recite it. Today,
    the few moments he shares with his own children look strikingly similar: a child beside a horse, a small hand in
    his at a family gathering. The grandfather who built modern Dubai is now watching his son raise the next generation
    the same way he was raised.'
  show:
  - him:Mohammed bin Rashid
  - cat:Mohammed bin Rashid Al Maktoum
  - cat:Endurance riding
- say: And then, in March two thousand and twenty-five, the fourth child arrived, a baby girl. Fazza shared a birth card
    on Instagram, and when fans read the name, many of them were moved to tears. Hind bint Hamdan bin Mohammed Al Maktoum.
    Hind, the name of his mother, Sheikha Hind, the woman who raised him far from the cameras. A month later, he shared
    a rare photo holding his baby daughter. Look at the names together now. Rashid for the brother he lost. Mohammed
    for the father who prepared him to rule. Hind for the mother who gave him everything. His children carry the whole
    story of his life.
  show:
  - him:family|children
  - him
  - cat:Hamdan bin Mohammed Al Maktoum
- say: So which of them could rule Dubai one day? Nobody can say, and the family never discusses succession in public.
    But many people in Dubai have noticed that Rashid bin Hamdan is the eldest son of the Crown Prince, and that his
    name is the name of the founder of modern Dubai. If one day he becomes heir, the name Rashid will once again belong
    to the future of the city. For now, they are simply four small children growing up in a royal family, with a father
    who rides horses at sunrise and a grandfather who rules one of the most famous cities on Earth.
  show:
  - cat:Sheikh Rashid bin Saeed Al Maktoum
  - cat:Burj Khalifa
  - him
- say: 'There is one more detail fans love. When Fazza shares his children, it is almost always in simple moments: a
    small hand holding his finger, a child near a horse, a family celebration at Eid. No palaces, no luxury cars, no
    bodyguards in the frame. For a man who has everything, the photos he chooses to share are the ones any father could
    take. Maybe that is why his followers feel so close to him. Behind the Crown Prince, the Minister of Defence and
    the poet, there is simply a father who wants his children to grow up with love and privacy. And for the people of
    Dubai, these children are more than royal babies. They are a sign that the family that built the city will carry
    on. Every time Fazza shares even a small glimpse of them, fans flood his comments with prayers and blessings in dozens
    of languages, from Arabic and English to Hindi, Urdu and Malayalam. Millions of people who will never meet these
    children already feel connected to them, simply because they love their father. It is one of the most unusual relationships
    in the world: a family the public adores, but almost never sees.'
  show:
  - him:horse|family|Eid
  - him
  - him:children|kids
- say: Rashid, Shaikha, Mohammed and Hind. Four names, four messages, and one father who protects them from the cameras.
    Which name touches you the most? And would you like Fazza to show his children's faces one day, or should he keep
    them private? Write your answer in the comments, we read every one. Like this video and subscribe to The Luxury Lane
    for more true stories about Prince Hamdan and his family. See you next time.
