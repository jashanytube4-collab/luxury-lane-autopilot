id: palace-life
title: "Inside Prince Hamdan's Secret Palace Life — Lions, Supercars and a Fortune Nobody Agrees On"
thumbnail: {text: "HIS SECRET LIFE", tag: "INSIDE", inset: "cat:Zabeel Palace"}
mood: epic
footage: "horse|endurance|falcon|race|skydiv|London|sport|fitness|Burj"
description: >-
  Lions in the garden, a fleet of supercars, a 531-foot family superyacht, private jets and a palace most people will
  never see. How does Prince Hamdan — Fazza, Crown Prince of Dubai — really live, and how rich is he? What the reports
  say, what the rumours claim, and what is actually true.
tags: [Prince Hamdan lifestyle, Fazza lifestyle, Sheikh Hamdan net worth, Fazza palace, Zabeel Palace,
       Prince Hamdan cars, Fazza lions, Dubai royal family wealth, Sheikh Hamdan luxury life, Fazza net worth,
       Dubai crown prince lifestyle, Sheikh Mohammed yacht Dubai]
sections:
  - say: >-
      Lions and tigers living behind palace walls. A garage full of supercars. A family superyacht longer than a
      football pitch. Private jets, racehorses worth millions and a fortune that some websites claim runs into the
      billions. This is the world of Prince Hamdan, the Crown Prince of Dubai, the man millions know as Fazza. But how
      much of it is real? How rich is he actually? What is inside the palace he calls home? And what is the one luxury
      Fazza values more than all his money? Stay until the end, because the answer to that last question is not what
      you expect. If you love royal lifestyle stories, hit like and subscribe right now. Let's go inside.
    show: [him, "cat:Zabeel Palace", "cat:Burj Al Arab", "cat:White lions"]
  - say: >-
      Let us start with the question everyone asks. How much is Fazza worth? Search online and you will find numbers
      that make your head spin: four billion, fourteen billion, even eighteen billion dollars. The truth is that
      nobody outside the family really knows. Royal wealth in the Gulf is not like the wealth of a businessman. Much of
      it belongs to the family, to the state and to investment companies, not to one person. Respected publications
      that have tried to estimate his personal fortune put it at around four hundred million dollars, far less than the
      viral numbers, but still an enormous sum. And of course, he is the heir to a family whose combined fortune is
      counted in billions. Whatever the exact figure, money has never been the problem for the Crown Prince of Dubai.
    show: [him, "cat:Palm Jumeirah", "cat:Burj Al Arab", "cat:Hamdan bin Mohammed Al Maktoum"]
  - say: >-
      Now the palace. Fazza grew up around Zabeel Palace, the vast official residence of Dubai's ruling family, hidden
      behind high walls in the heart of the city. Reports describe a complex of gardens, majlis halls, stables and
      private quarters that very few outsiders have ever entered. And here is the part that sounds like a fairy tale.
      According to a vlogger who was invited inside, and to reports that followed, the royal grounds include a private
      collection of animals: lions, tigers, even gorillas and monkeys. Fazza is a famous animal lover. On his Instagram,
      followed by more than seventeen million people, he has shared falcons, horses, camels and wildlife from his
      travels. To his fans, the idea of a prince with lions in the garden is the ultimate royal fantasy.
    show: ["cat:Zabeel Palace", "cat:White lions", "him:falcon|horse|camel|animal", "search:falcon UAE"]
  - say: >-
      Then there are the cars. Reports say that back in two thousand and fourteen, Fazza spent hundreds of thousands
      of dollars on a fleet of new cars in a single go. Fans have filmed him driving through London and Dubai in
      everything from Mercedes G-Class off-roaders to sleek supercars, and those clips regularly get millions of views.
      Dubai itself is a city of supercars, where even the police drive Lamborghinis and Bugattis. But here is what
      surprises people. In many of the most famous videos, Fazza is behind the wheel himself, with no motorcade, no
      sirens, just the Crown Prince driving like anyone else. What is your dream car? Tell us in the comments, and let
      us know if you think Fazza has it.
    show: ["cat:Ferrari", "search:Mercedes G-Class", "cat:Rolls-Royce Phantom", "search:Dubai police supercar"]
  - say: >-
      Now go even bigger. Fazza's father, Sheikh Mohammed, is reported to own one of the largest superyachts ever
      built, simply called Dubai. It stretches about five hundred and thirty-one feet, with a value reported at around
      four hundred million dollars. It has hosted royal guests in the waters of the Gulf for years. And when the family
      travels, it does so in style. Aviation trackers report that the Dubai royal flight operates a fleet of large
      private jets, including Boeing seven forty-sevens fitted out like flying palaces. Add the horses: the family's
      Godolphin racing empire has won some of the biggest races on the planet, from the Epsom Derby to the Dubai World
      Cup. This is a family that does nothing small.
    show: ["search:superyacht Dubai", "cat:Mohammed bin Rashid Al Maktoum", "cat:Meydan Racecourse", "cat:Royal Ascot"]
  - say: >-
      But the real luxury of Fazza's life is not something you can buy. It is adventure. He has jumped out of planes
      as a skydiver, dived the waters off Fujairah, climbed to the very top of the Burj Khalifa to wave the UAE flag,
      and ridden horses for one hundred and sixty kilometres through the desert to become world endurance champion in
      two thousand and fourteen. Every summer, fans spot him in London and Europe, often walking the streets with just
      a few friends, stopping for selfies with people from Dubai who recognise him. In a world where most billionaires
      hide behind tinted windows, the Crown Prince of Dubai seems happiest outdoors, sweating, riding and taking risks.
    show: ["him:skydiv|adventure|endurance|horse", "cat:Burj Khalifa", "cat:Endurance riding", him]
  - say: >-
      And then there is the most private luxury of all: his family. In two thousand and nineteen, Fazza married
      Sheikha Shaikha bint Saeed bin Thani Al Maktoum in a royal celebration shared with two of his brothers. Since
      then, he has become a father of four: twins Rashid and Shaikha, a son named Mohammed and a daughter named Hind.
      Yet the world has never seen his wife's face. Not once. For a man who shares lions, supercars and skydives with
      seventeen million followers, the one thing he keeps completely hidden is the woman he loves. Some fans find that
      mysterious. Others think it is the most romantic thing about him.
    show: ["him:family|Eid|wedding|children", "cat:Dubai World Trade Centre", him]
  - say: >-
      Part of the fascination with Fazza is his Instagram, where he simply calls himself Faz3. More than seventeen
      million people follow it. The name Fazza is usually explained as the one who comes to help, and it is also the
      pen name he uses for his poetry. His posts are a mix of everything fans dream about: falcons on his arm, horses
      at sunrise, skydives over the desert, snowy mountains in Europe, and every now and then a tiny hand of one of
      his children. Every post gets hundreds of thousands of likes in minutes. Fan pages copy every photo and every
      video. For millions of young people, especially in India, Pakistan and the Arab world, his feed is a window into
      a royal life they will never live, but love to watch.
    show: ["him:falcon|horse|skydiv|desert", "search:Instagram app", him]
  - say: >-
      And then there is his discipline. Fazza is famous for fitness. In two thousand and seventeen, he launched the
      Dubai Fitness Challenge, asking every resident to do thirty minutes of exercise every day for thirty days. Every
      year since, Sheikh Zayed Road, the city's biggest highway, has been closed for the Dubai Run and the Dubai Ride,
      with the Crown Prince himself running and cycling among tens of thousands of residents. Imagine jogging next to
      a prince on an empty eight-lane highway, with the Burj Khalifa above you. That is the other side of all the
      luxury. The man with the lions and the superyachts gets up early, trains hard and asks an entire city to do the
      same.
    show: ["him:fitness|run|ride|cycling|challenge", "cat:Burj Khalifa", "search:Sheikh Zayed Road"]
  - say: >-
      Even his choice of homes abroad has made headlines. Fans regularly spot him in London during the summer, and
      royal watchers say the family has long owned grand properties and racing estates in England, where its horses
      train for the biggest races of the season. Wherever he goes, a small group of friends and staff follows, but
      rarely the huge entourage you might expect from a future ruler.
    show: ["search:London Hyde Park", "cat:Royal Ascot", "him:London|Britain|United Kingdom"]
  - say: >-
      So, how does Prince Hamdan really live? The truth is somewhere between the rumours and the reality. Not eighteen
      billion dollars in a personal bank account, but a life of palaces, horses, supercars, private jets and lions,
      surrounded by one of the wealthiest families in the world. And yet the things he shows the most are the simplest:
      his horses at sunrise, his children's small hands, a walk through London with friends. Maybe that is the real
      secret of Fazza's luxury life. He has everything, and he still chooses the simple things. Which part of Fazza's
      lifestyle would you choose? Write it in the comments. Like this video, subscribe to The Luxury Lane, and see you in
      the next story.
    show: [him, "him:horse|endurance"]
