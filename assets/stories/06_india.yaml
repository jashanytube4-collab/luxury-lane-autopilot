id: india
title: "What Fazza Did in India That Nobody Expected — Prince Hamdan's First Visit"
thumbnail: {text: "FAZZA IN INDIA", tag: "FIRST VISIT"}
mood: arabian
description: >-
  A guard of honour in Delhi, lunch with Prime Minister Modi, a secret dinner in a Bandra restaurant, Team India's
  biggest stars and an Instagram caption in Hindi that went viral. The full story of Prince Hamdan's first official
  visit to India, and why more than four million Indians in the UAE are so close to Fazza's heart.
tags: [Fazza in India, Sheikh Hamdan India visit, Prince Hamdan India, Sheikh Hamdan Modi, Fazza Mumbai,
       Sheikh Hamdan Pali Bhavan, Sheikh Hamdan Team India, Fazza Rohit Sharma, Dubai crown prince India,
       Sheikh Hamdan Hindi, India UAE relations, Fazza India 2025]
sections:
  - say: >-
      He has met kings, presidents and world champions. But when Prince Hamdan landed in India, he did something none
      of his followers expected. He walked into a hidden restaurant in Bandra. He held a Team India jersey with the
      word Dubai on it. And he wrote a message to his seventeen million followers in Hindi. Why did Fazza's first
      official visit to India become such a big moment? What happened in his talks with Prime Minister Modi? And what
      is the special connection between Dubai and India that most people do not know? Stay until the end, because the
      numbers at the end of this story will surprise you. If you are watching from India, or if you love India, like
      this video and subscribe. Let's begin.
    show: [him, "him:India|Modi|Mumbai|Delhi", "search:India Gate New Delhi"]
  - say: >-
      On Tuesday, the eighth of April, two thousand and twenty-five, Prince Hamdan's plane touched down at Indira
      Gandhi International Airport in New Delhi. It was his first official visit to India as Crown Prince of Dubai,
      and his most high-profile trip abroad since becoming the UAE's Deputy Prime Minister and Minister of Defence. He
      came at the invitation of Prime Minister Narendra Modi. At the airport, he was received with a ceremonial guard
      of honour by Union Minister Suresh Gopi. Behind him walked a powerful delegation: ministers of the UAE
      government and Sheikh Ahmed bin Saeed, the chairman of Emirates airline and Dubai Airports. This was not a
      tourist trip. It was a message. Dubai wanted India to know how important it is. The visit also completed a
      remarkable series. In January two thousand and twenty-four, the UAE's President, Sheikh Mohamed bin Zayed, had
      visited India for a global business summit, and in September two thousand and twenty-four, the Crown Prince of
      Abu Dhabi, Sheikh Khaled, had held his own talks with Modi. Now it was Dubai's turn, and Dubai sent its future
      ruler. Indian newspapers covered every step, and Indian fans of Fazza, who had followed him online for years,
      suddenly saw him walking on Indian soil.
    show: ["search:Indira Gandhi International Airport", "him:India|official visit", "search:New Delhi"]
  - say: >-
      That same day, Prime Minister Modi hosted the Crown Prince for a working lunch. Afterwards, Modi wrote that the
      visit was a special one, reaffirming a deep-rooted friendship and opening the way for stronger collaboration. He
      said Dubai had played a key role in the India and UAE strategic partnership. Prince Hamdan wrote that the talks
      had reaffirmed the strength of UAE and India ties, a relationship built on trust, shaped by history and driven
      by a shared vision. The two sides spoke about trade, tourism, food security, artificial intelligence and space.
      Hamdan also met External Affairs Minister S Jaishankar at Hyderabad House, and, as the UAE's defence minister,
      he met India's Defence Minister Rajnath Singh to discuss military partnership, co-production and technology.
      Rajnath Singh said both countries were committed to peace and prosperity in the region.
    show: ["search:Hyderabad House New Delhi", "search:Narendra Modi", him, "him:defence|Minister"]
  - say: >-
      Then the Crown Prince flew to Mumbai, and the visit suddenly became very personal. On his Instagram stories, fans
      saw something they never expected. Fazza was inside Pali Bhavan, a much-loved restaurant in Bandra West, walking
      past walls of colourful steel tiffin boxes into a private dining room upstairs, with a long table decorated with
      paintings and collectibles. Indian food, Indian design, Indian hospitality. The owner, Mishali Sanghani, who
      actually lives in Dubai, said it felt almost like a dream, a cherished moment she never imagined would happen in
      Mumbai rather than in Dubai. A local resident described the restaurant as a hidden gem, known mainly to people
      who already know it. Overnight, everyone knew it. Here is our question for you. If Fazza came to your city,
      which restaurant should he try? Tell us in the comments.
    show: ["search:Mumbai Bandra", "search:Indian thali food", "search:Mumbai Marine Drive", him]
  - say: >-
      And then came the moment that made Indian social media explode. In Mumbai, Prince Hamdan met the stars of Team
      India: captain Rohit Sharma, T twenty captain Suryakumar Yadav and Hardik Pandya, together with ICC chairman Jay
      Shah. He congratulated them on winning the ICC Champions Trophy final, which India had won at the Dubai
      International Cricket Stadium just weeks earlier. He signed a Team India jersey printed with the word Dubai and
      the number eleven, and posed with Rohit Sharma holding it. Then he posted the photos with a caption in Hindi:
      Team India ke saath ek yaadgaar mulaqat. A memorable meeting with Team India. Indian fans could not believe it.
      The Crown Prince of Dubai, writing in Hindi. The post went viral within hours.
    show: ["search:cricket stadium Dubai", "search:Rohit Sharma", "search:cricket India", him]
  - say: >-
      Photos from the visit also showed Prince Hamdan at the Bombay Stock Exchange, the oldest stock exchange in Asia,
      where he opened trading alongside its chief executive. He also took part in a business roundtable with leading
      Indian and Emirati business figures, discussing infrastructure, energy, fintech and innovation. Why does all of
      this matter so much? Look at the numbers shared by the Dubai Media Office. More than four million Indians live in
      the UAE, the largest foreign community in the country. Non-oil trade between India and the UAE reached more than
      fifty-four billion dollars in two thousand and twenty-three. In a single year, more than sixteen thousand Indian
      companies joined the Dubai Chamber of Commerce. For millions of Indian families, Dubai is not a foreign city. It
      is where a brother works, where a mother sends money home from, where dreams are built.
    show: ["search:Bombay Stock Exchange", "search:Dubai Creek abra", "cat:Dubai Creek", him]
  - say: >-
      That is why Fazza's visit touched so many people. For Indian residents of Dubai, seeing their Crown Prince in
      Delhi and Mumbai felt like seeing a family member visit their home town. And it is not a one-way love story.
      Prince Hamdan has thanked an Indian pilot as part of our team, his city hosts India's cricket finals, and every
      year millions of Indian tourists fill Dubai's malls, beaches and skyscrapers. From the old days, when dhows sailed
      between the Gulf and the coast of Gujarat and Kerala, to today's flights every few minutes between the two
      countries, India and Dubai have always been connected by the sea, by trade and by people. Fazza's visit simply
      put a smile on that long history.
    show: ["search:dhow Dubai Creek", "cat:Dubai Creek", him, "search:Kerala backwaters"]
  - say: >-
      The connection between Dubai and India is much older than most people realise. Long before oil,
      long before skyscrapers, merchants from Gujarat, Sindh and the Malabar coast traded with the Gulf. Wooden dhows
      carried rice, spices, timber and cloth to Dubai Creek and returned with dates and pearls. Indian traders set up
      shops in the old souks, and some of the oldest businesses in Dubai were started by Indian families. Here is a
      fact that surprises almost everyone. For years, the money used in Dubai was not the dirham. It was the Indian
      rupee, and later a special Gulf rupee issued by the Reserve Bank of India for use in the Gulf. Only in nineteen
      sixty-six did Dubai switch to other currencies, and the UAE dirham arrived after the country was founded in
      nineteen seventy-one. So when Fazza walked into a restaurant in Mumbai, he was not visiting a distant country.
      He was visiting an old neighbour, a partner whose story is written into the history of his own city.
    show: ["cat:Dubai Creek", "cat:Al Bastakiya", "search:dhow wooden boat", "search:old Indian rupee coin"]
  - say: >-
      So what did Fazza do in India that nobody expected? He ate in a hidden Bandra restaurant, met Team India's
      biggest stars, opened the oldest stock exchange in Asia and spoke to India in Hindi. A Crown Prince who arrived
      as a statesman and left as a friend. Would you like Prince Hamdan to visit India again? Which city should he go
      to next? Write it in the comments, we read every single one. And if you enjoyed this story, like the video and
      subscribe to The Luxury Lane for more true stories about Prince Hamdan. See you next time.
